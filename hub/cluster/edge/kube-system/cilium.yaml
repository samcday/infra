---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: edge
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.18.0
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    # Conservative config for 2GB RAM nodes
    envoy:
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_BIND_SERVICE
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: "true"
      hostNetwork:
        enabled: false
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.24.0.0/16
    k8sServiceHost: edge-apiserver.tailnet.hub.samcday.com
    k8sServicePort: 6443
    kubeProxyReplacement: true
    nodeIPAM:
      enabled: true
    operator:
      replicas: 1
      rollOutPods: true
    routingMode: native
