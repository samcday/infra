apiVersion: v1
kind: Secret
metadata:
  name: edge-cloud-init
  namespace: kube-system
stringData:
  user-data: |
    #!/bin/bash
    set -uexo pipefail
    export DEBIAN_FRONTEND=noninteractive
    curl -fsSL https://tailscale.com/install.sh | sh
    tailscale up --accept-routes --login-server=https://headscale.tail22d0a0.ts.net --auth-key={{.TS_AUTH_KEY}}
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
    apt-get update
    apt install -y containerd kubelet kubeadm kubectl
    cat <<EOF | tee /etc/sysctl.d/k8s.conf
    net.ipv4.ip_forward = 1
    EOF
    sysctl --system
    systemctl enable containerd.service kubelet.service
    echo 'KUBELET_EXTRA_ARGS="--cloud-provider=external"' > /etc/default/kubelet
    mkdir -p /etc/containerd
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
    systemctl restart containerd.service
    kubeadm join edge-apiserver.tailnet.hub.samcday.com:6443 --token {{.BOOTSTRAP_TOKEN}} --discovery-token-ca-cert-hash sha256:{{.CA_HASH}}
