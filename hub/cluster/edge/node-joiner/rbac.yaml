---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-joiner
  namespace: edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-joiner
  namespace: edge
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-joiner
  namespace: edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-joiner
subjects:
  - kind: ServiceAccount
    name: node-joiner
    namespace: edge
