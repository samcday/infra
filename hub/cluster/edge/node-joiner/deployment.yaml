apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-joiner
  namespace: edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: node-joiner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-joiner
    spec:
      serviceAccountName: node-joiner
      containers:
        - name: shell-operator
          image: ghcr.io/flant/shell-operator:v1.4.16
          env:
            - name: KUBECONFIG
              value: /etc/edge-kubeconfig/kubeconfig
            - name: SHELL_OPERATOR_HOOKS_DIR
              value: /hooks
            - name: SHELL_OPERATOR_TMP_DIR
              value: /tmp/shell-operator
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: edge-kubeconfig
              mountPath: /etc/edge-kubeconfig
              readOnly: true
            - name: hooks
              mountPath: /hooks
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits:   { memory: 256Mi }
      volumes:
        - name: edge-kubeconfig
          secret:
            secretName: admin-kubeconfig
            defaultMode: 0400
            items:
              - key: value
                path: kubeconfig
        - name: hooks
          configMap:
            name: node-joiner-hook
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
