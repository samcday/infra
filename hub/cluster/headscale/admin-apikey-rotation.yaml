apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-admin-apikey-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-admin-apikey-rotation
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [admin-apikey]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-admin-apikey-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-admin-apikey-rotation
subjects:
  - kind: ServiceAccount
    name: headscale-admin-apikey-rotation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-admin-apikey-rotation-20260728
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: headscale-admin-apikey-rotation
      containers:
        - name: rotate
          image: ghcr.io/samcday/infra-headscale-node-cleaner:2026072008
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail

              headscale_pod=$(kubectl -n headscale get pods \
                -l app.kubernetes.io/instance=headscale -o json | jq -r '
                  .items[]
                  | select(any(.status.containerStatuses[]?;
                      .name == "generic" and .ready))
                  | .metadata.name
                ' | head -n1)
              [[ -n "$headscale_pod" ]]

              new_key=$(kubectl -n headscale exec "$headscale_pod" -c generic -- \
                headscale apikeys create --expiration 8760h)
              [[ "$new_key" == hskey-api-* ]]

              encoded_key=$(printf %s "$new_key" | base64 | tr -d '\n')
              kubectl -n headscale patch secret admin-apikey --type=merge \
                -p "{\"data\":{\"key\":\"$encoded_key\"}}" >/dev/null
              unset new_key encoded_key

              echo "Headscale admin API key rotated"
