---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operator
  namespace: rook-ceph
spec:
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      version: v1.17.7
  install:
    remediation:
      retries: 3
  interval: 1h
  upgrade:
    remediation:
      retries: 3
  values:
    # https://github.com/rook/rook/blob/release-1.17/deploy/charts/rook-ceph/values.yaml
    csi:
      # Live working sets on 2026-07-12 were 20-50Mi per node plugin and
      # 58-80Mi per provisioner pod. Keep the existing limits while reserving
      # enough headroom above observed use for CSI bursts and upgrades.
      csiCephFSProvisionerResource: |
        - name : csi-provisioner
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-resizer
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-attacher
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-snapshotter
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-cephfsplugin
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi

      # -- CEPH CSI CephFS plugin resource requirement list
      # @default -- see values.yaml
      csiCephFSPluginResource: |
        - name : driver-registrar
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-cephfsplugin
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi

      csiRBDProvisionerResource: |
        - name : csi-provisioner
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-resizer
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-attacher
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-snapshotter
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-rbdplugin
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        - name : csi-omap-generator
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
      csiRBDPluginResource: |
        - name : driver-registrar
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
        - name : csi-rbdplugin
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 32Mi
            limits:
              memory: 256Mi
      pluginNodeAffinity: node-role.kubernetes.io/worker=true
      pluginTolerations: []
      provisionerNodeAffinity: node-role.kubernetes.io/worker=true
      provisionerTolerations: []
    monitoring:
      enabled: true
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    resources:
      limits:
        cpu: ~
      requests:
        cpu: ~
