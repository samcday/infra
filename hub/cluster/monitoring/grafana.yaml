---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 8.10.4
  install:
    remediation:
      retries: -1
  interval: 1h
  releaseName: grafana
  upgrade:
    remediation:
      retries: -1
  values:
    # https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
    ingress:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts: [grafana.hub.samcday.com]
      ingressClassName: nginx
      tls:
        - hosts: [grafana.hub.samcday.com]
          secretName: grafana-certificate
    grafana.ini:
      database:
        type: sqlite3
        path: /var/lib/grafana/grafana.db
    persistence:
      enabled: true
      storageClassName: openebs-hostpath
      size: 10Gi
    replicas: 1
    serviceMonitor:
      enabled: true
    sidecar:
      dashboards:
        enabled: true
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
        searchNamespace: ALL
      datasources:
        enabled: true
        labelValue: "1"
        searchNamespace: ALL
