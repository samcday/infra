apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hub-etcd-prometheus
  namespace: monitoring
spec:
  commonName: prometheus
  issuerRef:
    kind: ClusterIssuer
    name: etcd
  privateKey:
    algorithm: ECDSA
  secretName: hub-etcd-prometheus
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hub-etcd
  namespace: monitoring
spec:
  endpoints:
    - interval: 15s
      port: http-metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            key: ca.crt
            name: hub-etcd-prometheus
        cert:
          secret:
            key: tls.crt
            name: hub-etcd-prometheus
        keySecret:
          key: tls.key
          name: hub-etcd-prometheus
      relabelings:
        - replacement: hub
          targetLabel: cluster
  jobLabel: jobLabel
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: kube-prometheus-stack-kube-etcd
      release: kube-prometheus-stack
