---
apiVersion: v1
kind: ConfigMap
metadata:
  name: karma
  namespace: monitoring
data:
  karma.yaml: |
    karma:
      name: hub-alerts
    alertmanager:
      interval: 30s
      servers:
        - name: hub
          cluster: hub
          uri: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
          external_uri: https://alertmanager.hub.samcday.com
          timeout: 15s
          proxy: true
          healthcheck:
            filters:
              watchdog:
                - alertname=Watchdog
        - name: home
          cluster: home
          uri: https://alertmanager.samcday.com
          external_uri: https://alertmanager.samcday.com
          timeout: 20s
          readonly: true
          healthcheck:
            filters:
              watchdog:
                - alertname=Watchdog
    filters:
      default:
        - "@state=active"
        - alertname!=Watchdog
        - alertname!=InfoInhibitor
    grid:
      sorting:
        order: label
        reverse: false
        label: severity
        customValues:
          labels:
            severity:
              critical: 1
              warning: 2
              info: 3
    ui:
      colorTitlebar: true
      multiGridLabel: cluster
    labels:
      order:
        - severity
        - cluster
        - namespace
        - pod
        - container
        - instance
        - alertname
      color:
        custom:
          severity:
            - value: critical
              color: "#dc2626"
            - value: warning
              color: "#d97706"
            - value: info
              color: "#2563eb"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: karma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karma
    spec:
      containers:
        - name: karma
          image: ghcr.io/prymitive/karma:v0.122
          args:
            - --config.file=/etc/karma/karma.yaml
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/karma
      volumes:
        - name: config
          configMap:
            name: karma

---
apiVersion: v1
kind: Service
metadata:
  name: karma
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: karma
  ports:
    - name: http
      port: 80
      targetPort: http
