---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      version: 70.3.0
  interval: 1h
  values:
    # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfigMatcherStrategy:
          type: None
        externalUrl: https://alertmanager.hub.samcday.com:9093
        replicas: 3
      ingress:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts: [alertmanager.hub.samcday.com]
        ingressClassName: nginx
        tls:
          - hosts: [alertmanager.hub.samcday.com]
            secretName: alertmanager-certificate
    defaultRules:
      disabled:
        KubeClientCertificateExpiration: true
    grafana:
      enabled: false
      forceDeployDatasources: true
      sidecar:
        datasources:
          isDefaultDatasource: false
    kubeApiServer:
      serviceMonitor:
        relabelings:
          - replacement: hub
            targetLabel: cluster
    kubeControllerManager:
      serviceMonitor:
        relabelings:
          - replacement: hub
            targetLabel: cluster
    kubeEtcd:
      endpoints:
        - 10.0.1.10
        - 10.0.1.11
        - 10.0.1.12
      service:
        port: 2379
        targetPort: 2379
      serviceMonitor:
        # The direct ServiceMonitor uses cert-manager Secret references so the
        # Prometheus operator manages the TLS assets without static file paths.
        enabled: false
    # Using Cilium kube-proxy replacement
    kubeProxy:
      enabled: false
    kubeScheduler:
      serviceMonitor:
        relabelings:
          - replacement: hub
            targetLabel: cluster
    prometheus:
      ingress:
        enabled: false
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts: [prometheus.hub.samcday.com]
        ingressClassName: nginx
        tls:
          - hosts: [prometheus.hub.samcday.com]
            secretName: prometheus-certificate
      prometheusSpec:
        additionalScrapeConfigs:
          - job_name: node-exporter
            static_configs:
              - targets:
                  - 10.0.1.1:9100
                labels:
                  instance: hub-cluster-router
        enableAdminAPI: true
        enableRemoteWriteReceiver: true
        externalLabels:
          cluster: hub
        externalUrl: https://prometheus.hub.samcday.com
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        replicaExternalLabelName: __replica__
        # Keep monitoring off the etcd hosts. Worker request headroom currently
        # fits one replica; restore HA after capacity is freed or added.
        replicas: 1
        resources:
          requests:
            memory: 4Gi
        # Keep enough local history to demonstrate whether the containment
        # changes improve tail latency. This remains ephemeral until durable
        # monitoring storage is provisioned outside the control-plane disks.
        retention: 7d
        retentionSize: 5GB
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
    # https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-node-exporter/values.yaml
    prometheus-node-exporter:
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
      hostRootFsMount:
        enabled: false
      prometheus:
        monitor:
          relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
            replacement: $1
            action: replace
    prometheusOperator:
      enabled: false
