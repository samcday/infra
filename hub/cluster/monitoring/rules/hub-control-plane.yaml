apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hub-control-plane
  namespace: monitoring
spec:
  groups:
    - name: HubControlPlane
      rules:
        # This histogram has 1s and 5s buckets but no 3s bucket. Use exact
        # bucket subtraction instead of interpolated quantiles, and require
        # both an absolute request rate and a ratio to suppress sparse noise.
        - alert: HubEtcdClientLatencyHigh
          expr: |
            (
              clamp_min(
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="+Inf"
                  }[5m])
                )
                  -
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="1.0"
                  }[5m])
                ),
                0
              ) > 0.05
            )
            and on (instance)
            (
              clamp_min(
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="+Inf"
                  }[5m])
                )
                  -
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="1.0"
                  }[5m])
                ),
                0
              )
                /
              sum by (instance) (
                rate(etcd_request_duration_seconds_bucket{
                  cluster="hub", le="+Inf"
                }[5m])
              ) > 0.005
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              More than fifteen hub API server {{ $labels.instance }} etcd
              requests per five minutes, and over 0.5% of them, have exceeded
              one second.
        - alert: HubEtcdClientLatencyCritical
          expr: |
            (
              clamp_min(
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="+Inf"
                  }[5m])
                )
                  -
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="5.0"
                  }[5m])
                ),
                0
              ) > 0.01
            )
            and on (instance)
            (
              clamp_min(
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="+Inf"
                  }[5m])
                )
                  -
                sum by (instance) (
                  rate(etcd_request_duration_seconds_bucket{
                    cluster="hub", le="5.0"
                  }[5m])
                ),
                0
              )
                /
              sum by (instance) (
                rate(etcd_request_duration_seconds_bucket{
                  cluster="hub", le="+Inf"
                }[5m])
              ) > 0.001
            )
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              More than three hub API server {{ $labels.instance }} etcd
              requests per five minutes, and over 0.1% of them, have exceeded
              five seconds continuously for ten minutes.
        - alert: HubEtcdFailedProposals
          expr: |
            sum by (instance) (
              increase(etcd_server_proposals_failed_total{
                cluster="hub", job="kube-etcd"
              }[15m])
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Hub etcd member {{ $labels.instance }} has recorded more than
              five failed consensus proposals in fifteen minutes.
        - alert: HubEtcdHeartbeatFailures
          expr: |
            sum by (instance) (
              increase(etcd_server_heartbeat_send_failures_total{
                cluster="hub", job="kube-etcd"
              }[15m])
            ) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Hub etcd leader {{ $labels.instance }} has recorded more than
              ten heartbeat send failures in fifteen minutes.
        - alert: HubEtcdSlowApplies
          expr: |
            (
              sum by (instance) (
                rate(etcd_server_slow_apply_total{
                  cluster="hub", job="kube-etcd"
                }[15m])
              ) > 0.1
            )
            and on (instance)
            (
              sum by (instance) (
                rate(etcd_server_slow_apply_total{
                  cluster="hub", job="kube-etcd"
                }[15m])
              )
                /
              sum by (instance) (
                rate(etcd_server_proposals_committed_total{
                  cluster="hub", job="kube-etcd"
                }[15m])
              ) > 0.005
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Hub etcd member {{ $labels.instance }} is recording over 0.1
              slow applies per second, exceeding 0.5% of committed proposals.
        - alert: HubEtcdMetricsMissing
          expr: (count(up{job="kube-etcd"} == 1) or vector(0)) < 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Prometheus can scrape fewer than three hub etcd members.
        - alert: HubControlPlaneIOPressure
          expr: |
            rate(node_pressure_io_stalled_seconds_total{instance=~"hub-az1-cp[123]"}[5m]) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Hub control-plane node {{ $labels.instance }} is fully stalled on I/O over 5% of the time.
        - alert: HubControlPlaneIOPressureCritical
          expr: |
            rate(node_pressure_io_stalled_seconds_total{instance=~"hub-az1-cp[123]"}[5m]) > 0.20
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Hub control-plane node {{ $labels.instance }} is fully stalled on I/O over 20% of the time.
        - alert: KubeVIPRestarting
          expr: |
            sum(
              increase(
                kube_pod_container_status_restarts_total{
                  namespace="kube-system",
                  container="kube-vip"
                }[10m]
              )
            ) > 0
          labels:
            severity: critical
          annotations:
            summary: kube-vip restarted during the last ten minutes; the hub API VIP may have flapped.
        - alert: KubeVIPLeaseStale
          expr: |
            time() - (
              max(
                kube_lease_renew_time{
                  namespace="kube-system",
                  lease="plndr-cp-lock"
                }
              ) or vector(0)
            ) > 90
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: The kube-vip leader lease has not been renewed for over ninety seconds.
        - alert: KubeVIPMetricsMissing
          expr: |
            (
              count(
                up{
                  namespace="kube-system",
                  service="kube-vip-metrics"
                } == 1
              ) or vector(0)
            ) < 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Prometheus can scrape fewer than three kube-vip instances.
