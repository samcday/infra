apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pagerduty
  namespace: monitoring
spec:
  receivers:
    - name: pagerduty
      pagerdutyConfigs:
        - sendResolved: true
          serviceKey:
            name: pagerduty
            key: integration-key
          url: https://events.eu.pagerduty.com/generic/2010-04-15/create_event.json
  route:
    groupBy:
      - alertname
      - cluster
    groupInterval: 5m
    groupWait: 30s
    matchers:
      - name: severity
        value: critical
    receiver: pagerduty
    repeatInterval: 2h
