apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpas
  namespace: monitoring
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    alertmanager:
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      spec:
        targetRef:
          apiVersion: monitoring.coreos.com/v1
          kind: Alertmanager
          name: kube-prometheus-stack-alertmanager
        updatePolicy:
          updateMode: Auto
    grafana:
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: grafana
        updatePolicy:
          updateMode: Auto
    kube-state-metrics:
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: kube-prometheus-stack-kube-state-metrics
        updatePolicy:
          updateMode: Auto
    node-exporter:
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: DaemonSet
          name: kube-prometheus-stack-prometheus-node-exporter
        updatePolicy:
          updateMode: Auto
    prometheus:
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      spec:
        targetRef:
          apiVersion: monitoring.coreos.com/v1
          kind: Prometheus
          name: kube-prometheus-stack-prometheus
        updatePolicy:
          updateMode: Auto
