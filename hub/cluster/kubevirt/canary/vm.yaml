apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: arch-canary
  namespace: kubevirt-canary
spec:
  dataVolumeTemplates:
    - metadata:
        name: arch-canary-root
        annotations:
          samcday.com/source-sha256: a99844dda491606f81f463ce96851ae03d90ca8fa727671cac2da86a07a7cd61
      spec:
        source:
          http:
            url: https://geo.mirror.pkgbuild.com/images/v20260701.551070/Arch-Linux-x86_64-cloudimg-20260701.551070.qcow2
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
          storageClassName: ceph-block
          volumeMode: Block
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arch-canary
    spec:
      nodeSelector:
        samcday.com/kubevirt: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 0
      domain:
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachGraphicsDevice: false
          disks:
            - disk:
                bus: virtio
              name: root
            - disk:
                bus: virtio
              name: cloud-init
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1536Mi
      networks:
        - name: default
          pod: {}
      volumes:
        - dataVolume:
            name: arch-canary-root
          name: root
        - cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: arch-canary
              preserve_hostname: false
              users:
                - default
              ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwawprQXEkGl38Q7T0PNseL0vpoyr4TbATMkEaZJTWQ
              ssh_pwauth: false
              disable_root: true
              runcmd:
                - [systemctl, enable, --now, sshd.service]
          name: cloud-init
