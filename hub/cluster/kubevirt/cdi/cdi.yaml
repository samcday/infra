apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
      - WebhookPvcRendering
    scratchSpaceStorageClass: ceph-block
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
  workload:
    nodeSelector:
      samcday.com/kubevirt: "true"
