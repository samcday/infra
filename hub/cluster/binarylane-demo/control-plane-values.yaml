apiServer:
  service:
    spec:
      type: ClusterIP
bootstrapTokens:
  - extraGroups: [system:bootstrappers:kubeadm:default-node-token]
    # token ID+secret is set from HelmRelease spec.valuesFrom
clusterCIDRs: [172.24.0.0/16]
clusterDNS: [172.23.0.10]
clusterName: binarylane-demo
etcd:
  certIssuer:
    name: etcd
    kind: ClusterIssuer
  endpoints:
    - https://hub-az1-cp1.hub.internal:2379
    - https://hub-az1-cp2.hub.internal:2379
    - https://hub-az1-cp3.hub.internal:2379
# TODO: set externalIP after ts-apiserver registers with headscale
externalHostname: binarylane-demo-apiserver.tailnet.hub.samcday.com
konnectivity:
  agent:
    image: registry.k8s.io/kas-network-proxy/proxy-agent:v0.32.0
  server:
    image: registry.k8s.io/kas-network-proxy/proxy-server:v0.32.0
parentClusterDomain: cluster.hub.internal
scheduler:
  config:
    profiles:
      - pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                  - name: cpu
                    weight: 1
                  - name: memory
                    weight: 100
  deployment:
    spec:
      replicas: 1
      strategy:
        type: Recreate
serviceCIDRs: [172.23.0.0/16]
serviceIP: 172.23.0.1
