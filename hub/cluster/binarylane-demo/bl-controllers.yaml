---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bl-controllers
  namespace: binarylane-demo
spec:
  chart:
    spec:
      chart: chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: binarylane-controllers
        namespace: flux-system
  dependsOn:
    - name: control-plane
    - name: bl-controllers-config
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: kubeconfig
                  configMap:
                    name: kubeconfig
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: cert
                  secret:
                    secretName: admin
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: kubeconfig
                  mountPath: /kubeconfig
                  subPath: kubeconfig
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: cert
                  mountPath: /cert
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: KUBECONFIG
                  value: /kubeconfig
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: TMPL_TS_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: node-ts-auth
                      key: key
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: TMPL_BOOTSTRAP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: bl-controllers-config
                      key: token
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: TMPL_CA_HASH
                  valueFrom:
                    configMapKeyRef:
                      name: ca-hash
                      key: hash
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRole
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: unused
          - target:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRoleBinding
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: unused
  values:
    existingSecret: bl-token
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    autoscaler:
      enabled: true
      config:
        namePrefix: bldemo-
        nodeGroups:
          - id: syd
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: syd
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
          - id: mel
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: mel
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
          - id: bne
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: bne
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
          - id: per
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: per
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
          - id: adl
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: adl
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
          - id: sin
            minSize: 0
            maxSize: 3
            size: std-1vcpu
            region: sin
            image: ubuntu-24.04
            vcpus: 1
            memoryMb: 2048
            diskGb: 20
      cloudInit: |
        #!/bin/bash
        set -uexo pipefail
        export DEBIAN_FRONTEND=noninteractive
        curl -fsSL https://tailscale.com/install.sh | sh
        tailscale up --accept-routes --login-server=https://headscale.tail22d0a0.ts.net --auth-key={{.TS_AUTH_KEY}}
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
        apt-get update
        apt install -y containerd kubelet kubeadm kubectl
        cat <<EOF | tee /etc/sysctl.d/k8s.conf
        net.ipv4.ip_forward = 1
        EOF
        sysctl --system
        systemctl enable containerd.service kubelet.service
        echo 'KUBELET_EXTRA_ARGS="--cloud-provider=external"' > /etc/default/kubelet
        mkdir -p /etc/containerd
        containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
        systemctl restart containerd.service
        kubeadm join binarylane-demo-apiserver.tailnet.hub.samcday.com:6443 --token {{.BOOTSTRAP_TOKEN}} --discovery-token-ca-cert-hash sha256:{{.CA_HASH}}
    mtls:
      enabled: true
      clientSecretName: binarylane-controller-mtls-client
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bl-controllers-config
  namespace: binarylane-demo
spec:
  chart:
    spec:
      chart: hub/cluster/binarylane-demo/bl-config
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: node-bootstrap-token
      valuesKey: id
      targetPath: token.id
    - kind: Secret
      name: node-bootstrap-token
      valuesKey: secret
      targetPath: token.secret
