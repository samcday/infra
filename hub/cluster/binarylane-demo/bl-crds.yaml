---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bl-crds
  namespace: binarylane-demo
spec:
  chart:
    spec:
      chart: charts/binarylane-controllers-crds
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: binarylane-controllers
        namespace: flux-system
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
