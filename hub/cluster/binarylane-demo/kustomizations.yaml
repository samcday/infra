apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kustomizations
  namespace: binarylane-demo
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      spec:
        interval: 1h
        prune: true
        sourceRef:
          kind: GitRepository
          name: infra
          namespace: flux-system
        timeout: 5m
    kube-system:
      spec:
        path: hub/cluster/binarylane-demo/kube-system
    gateway-api:
      spec:
        dependsOn: [name: kube-system]
        kubeConfig:
          secretRef:
            name: admin-kubeconfig
        path: hub/cluster/binarylane-demo/gateway-api
    asg:
      spec:
        dependsOn: [name: kube-system]
        kubeConfig:
          secretRef:
            name: admin-kubeconfig
        path: hub/cluster/binarylane-demo/asg
