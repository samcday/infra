apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames: [litellm.samcday.com]
  parentRefs:
    - name: public
      namespace: ingress-nginx
      sectionName: http
  rules:
    - matches:
        # Match the tunnel's original HTTPS scheme, as on llm.samcday.com.
        - method: GET
          path: {type: Exact, value: /v1/models}
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path: {type: Exact, value: /v1/responses}
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path: {type: Exact, value: /v1/chat/completions}
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path: {type: Exact, value: /v1/messages}
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Cache-Control, value: no-store}
              - {name: Strict-Transport-Security, value: max-age=31536000}
      timeouts: {request: 0s, backendRequest: 0s}
      backendRefs:
        - {name: litellm, port: 4000}
