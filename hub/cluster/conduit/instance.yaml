---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: litestream
  namespace: conduit
spec:
  generateBucketName: conduit-litestream-
  storageClassName: ceph-bucket

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: conduit
  namespace: conduit
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    additionalContainers:
      - name: litestream
        image: docker.io/litestream/litestream:v0.5.8@sha256:9874588ddb04789179d0d93cc902ba9309bb0cac4c33eb5631599d4559c60106
        args:
          - replicate
          - -config
          - /etc/litestream.yml
        envFrom:
          - secretRef:
              name: litestream
          - configMapRef:
              name: litestream
        volumeMounts:
          - name: data
            mountPath: /var/lib/matrix-conduit
          - name: configmap
            mountPath: /etc/litestream.yml
            subPath: litestream.yml
            readOnly: true
    configMap:
      enabled: true
      data:
        conduit.toml: |-
          [global]
          server_name = "samcday.com"
          database_backend = "sqlite"
          database_path = "/var/lib/matrix-conduit/"
          address = "0.0.0.0"
          port = 6167
          allow_encryption = true
          allow_federation = true
          allow_registration = false
          trusted_servers = ["matrix.org"]

          [global.well_known]
          client = "https://matrix.samcday.com"
          server = "matrix.samcday.com:443"
        litestream.yml: |-
          dbs:
            - path: /var/lib/matrix-conduit/conduit.db
              restore-if-db-not-exists: true
              replica:
                url: s3://${BUCKET_NAME}/conduit.db?endpoint=http://${BUCKET_HOST}:${BUCKET_PORT}&region=${BUCKET_REGION}&force-path-style=true
      mountFiles:
        - subPath: conduit.toml
          mountPath: /etc/conduit/conduit.toml
        - subPath: litestream.yml
          mountPath: /etc/litestream.yml
    deploymentStrategy:
      type: Recreate
    env:
      CONDUIT_CONFIG: /etc/conduit/conduit.toml
      CONDUIT_ALLOW_REGISTRATION: "false"
      CONDUIT_REGISTRATION_TOKEN: "disabled-registration-token"
    image:
      repository: docker.io/matrixconduit/matrix-conduit
      tag: latest@sha256:4078e80577ccaaf05290a7bb08badc321a5c44a8c8f5f3dce0fb1ae5a0825e64
    ingress:
      enabled: false
    initContainers:
      - name: litestream-restore
        image: docker.io/litestream/litestream:v0.5.8@sha256:9874588ddb04789179d0d93cc902ba9309bb0cac4c33eb5631599d4559c60106
        command:
          - /bin/sh
          - -ec
        args:
          - >-
            litestream restore
            -if-db-not-exists
            -config /etc/litestream.yml
            /var/lib/matrix-conduit/conduit.db
        envFrom:
          - secretRef:
              name: litestream
          - configMapRef:
              name: litestream
        volumeMounts:
          - name: data
            mountPath: /var/lib/matrix-conduit
          - name: configmap
            mountPath: /etc/litestream.yml
            subPath: litestream.yml
            readOnly: true
    livenessProbe:
      httpGet:
        path: /_matrix/client/versions
        port: http
    persistence:
      enabled: true
      mountPath: /var/lib/matrix-conduit
      storage: 20Gi
      accessMode: ReadWriteOnce
      storageClassName: ceph-block
    ports:
      - name: http
        containerPort: 6167
    readinessProbe:
      httpGet:
        path: /_matrix/client/versions
        port: http
    service:
      ports:
        - targetPort: http
          protocol: TCP
          name: http
          port: 80

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: conduit-identity-check
  namespace: conduit
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: conduit
                      app.kubernetes.io/name: generic
                  topologyKey: kubernetes.io/hostname
          restartPolicy: Never
          containers:
            - name: check
              image: docker.io/python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  python - <<'PY'
                  import base64
                  import json
                  import sqlite3
                  import sys
                  import urllib.request

                  db_path = "/var/lib/matrix-conduit/conduit.db"
                  key_url = "http://conduit-generic.conduit.svc/_matrix/key/v2/server"
                  expected_server_name = "samcday.com"

                  def normalize_b64(value):
                    if not isinstance(value, str):
                      return None
                    return value + ("=" * (-len(value) % 4))

                  conn = sqlite3.connect(db_path)
                  row = conn.execute("SELECT value FROM global WHERE key = ?", (b"keypair",)).fetchone()
                  if row is None:
                    print("identity-check: missing global.keypair row")
                    sys.exit(1)

                  blob = row[0]
                  if not isinstance(blob, (bytes, bytearray)):
                    print("identity-check: unexpected keypair value type")
                    sys.exit(1)
                  if b"\xff" not in blob or len(blob) < 33:
                    print("identity-check: malformed keypair blob")
                    sys.exit(1)

                  local_key_id = blob.split(b"\xff", 1)[0].decode("ascii")
                  local_pubkey_bytes = blob[-32:]
                  local_pubkey = base64.b64encode(local_pubkey_bytes).decode("ascii")

                  with urllib.request.urlopen(key_url, timeout=15) as response:
                    remote = json.load(response)

                  remote_server_name = remote.get("server_name")
                  if remote_server_name != expected_server_name:
                    print(
                      "identity-check: server_name mismatch:",
                      remote_server_name,
                      "!=",
                      expected_server_name,
                    )
                    sys.exit(1)

                  remote_keys = remote.get("verify_keys", {})
                  remote_key = remote_keys.get(f"ed25519:{local_key_id}", {}).get("key")
                  try:
                    remote_pubkey_bytes = base64.b64decode(normalize_b64(remote_key), validate=True)
                  except Exception:
                    print("identity-check: remote key is not valid base64")
                    print(f"remote: ed25519:{local_key_id} {remote_key}")
                    sys.exit(1)

                  if remote_pubkey_bytes != local_pubkey_bytes:
                    print("identity-check: signing key mismatch")
                    print(f"local:  ed25519:{local_key_id} {local_pubkey}")
                    print(f"remote: ed25519:{local_key_id} {remote_key}")
                    sys.exit(1)

                  print(f"identity-check: ok ed25519:{local_key_id}")
                  PY
              volumeMounts:
                - name: data
                  mountPath: /var/lib/matrix-conduit
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: conduit-generic

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: conduit
  namespace: conduit
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - samcday.com
    - matrix.samcday.com
  parentRefs:
    - name: public
      namespace: ingress-nginx
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: conduit-generic
          port: 80
