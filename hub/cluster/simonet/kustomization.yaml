apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simonet
configMapGenerator:
  - name: control-plane-values
    files:
      - values.yaml=control-plane-values.yaml
resources:
  - ../../../.kustomize-config
  - bootie.yaml
  - cilium.yaml
  - control-plane.yaml
  - coredns.yaml
  - external-dns.yaml
  - namespaces.yaml
  - node-bootstrap-token.yaml
  - prometheus-operator-crds.yaml
