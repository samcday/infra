---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: simonet
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.18.0
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    # https://github.com/cilium/cilium/blob/master/install/kubernetes/cilium/values.yaml
    autoDirectNodeRoutes: true
    bgpControlPlane:
      enabled: true
    bpf:
      masquerade: true
      tproxy: true
    hubble:
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: true
          className: nginx
          hosts: [hubble.simonet.hub.samcday.com]
          tls:
            - hosts: [hubble.simonet.hub.samcday.com]
              secretName: hubble-cert
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.25.0.0/16
    k8sServiceHost: simonet.hub.samcday.com
    k8sServicePort: 6443
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      dsrDispatch: opt
      mode: dsr
      serviceTopology: true
    # Cilium is autodetecting the incorrect 1280 MTU of tailscale0
    # https://github.com/cilium/cilium/issues/14339
    MTU: 1500
    operator:
      prometheus:
        serviceMonitor:
          enabled: true
      rollOutPods: true
      replicas: 2
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    routingMode: native
    socketLB:
      hostNamespaceOnly: true
