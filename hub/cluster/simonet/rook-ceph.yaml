---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: simonet
spec:
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      version: v1.17.7
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: rook-ceph
  targetNamespace: rook-ceph
  values:
    # https://github.com/rook/rook/blob/release-1.17/deploy/charts/rook-ceph/values.yaml
    csi:
      csiCephFSProvisionerResource: |
        - name : csi-provisioner
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-resizer
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-attacher
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-snapshotter
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-cephfsplugin
          resource:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

      # -- CEPH CSI CephFS plugin resource requirement list
      # @default -- see values.yaml
      csiCephFSPluginResource: |
        - name : driver-registrar
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-cephfsplugin
          resource:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

      csiRBDProvisionerResource: |
        - name : csi-provisioner
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-resizer
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-attacher
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-snapshotter
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-rbdplugin
          resource:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        - name : csi-omap-generator
          resource:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      csiRBDPluginResource: |
        - name : driver-registrar
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
        - name : csi-rbdplugin
          resource:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        - name : liveness-prometheus
          resource:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
    monitoring:
      enabled: true
    resources:
      limits:
        cpu: ~
      requests:
        cpu: ~
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: simonet
spec:
  chart:
    spec:
      chart: rook-ceph-cluster
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      version: v1.17.7
  dependsOn:
    - name: rook-ceph-operator
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: rook-ceph
  targetNamespace: rook-ceph
  # postRenderers:
  #   - kustomize:
  #       patches:
  #         # Some of the rules shipped by Rook aren't suitable, but can only be removed with patches like so
  #         # https://github.com/rook/rook/blob/release-1.15/deploy/charts/rook-ceph-cluster/prometheus/localrules.yaml
  #         - target:
  #             group: monitoring.coreos.com
  #             version: v1
  #             kind: PrometheusRule
  #             name: prometheus-ceph-rules
  #           patch: |
  #             # CephNodeDiskspaceWarning
  #             - op: remove
  #               path: /spec/groups/6/rules/4
  #             # CephNodeNetworkPacketErrors
  #             - op: remove
  #               path: /spec/groups/6/rules/2
  #             # CephNodeNetworkPacketDrops
  #             - op: remove
  #               path: /spec/groups/6/rules/1
  values:
    # https://github.com/rook/rook/blob/release-1.17/deploy/charts/rook-ceph-cluster/values.yaml
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: []
          allowedTopologies: []
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
    cephClusterSpec:
      # for MONTHS since first deploying Ceph, I woke up just about every morning to a fresh round
      # of alerts, because some osds have crashed overnight. still no idea why. it still happens today.
      # but it always happens in the dead of night and never seems to cause enough impact for me to care.
      crashCollector:
        disable: true
      dashboard:
        ssl: false
      mon:
        count: 3
      removeOSDsIfOutAndSafeToRemove: true
      resources:
        cleanup: &resources
          limits:
            cpu: ~
          requests:
            cpu: ~
        crashcollector: *resources
        logcollector:
          limits:
            cpu: ~
            memory: 512Mi
          requests:
            cpu: ~
            memory: 512Mi
        mgr: *resources
        mgr-sidecar: *resources
        mon: *resources
        osd:
          limits:
            cpu: ~
            memory: 4Gi
          requests:
            cpu: ~
            memory: 2Gi
        prepareosd: *resources
      storage:
        useAllDevices: true
        useAllNodes: true
        config:
          encryptedDevice: "true"
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
            - failureDomain: host
              erasureCoded:
                dataChunks: 2
                codingChunks: 1
              name: ec
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
            resources:
              limits:
                cpu: ~
                memory: 4Gi
              requests:
                cpu: ~
                memory: 1Gi
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: []
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
    cephObjectStores:
      - name: ceph-objectstore
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
            nginx.ingress.kubernetes.io/proxy-buffering: "off"
            nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300s"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300s"
          host:
            name: obj.simonet.hub.samcday.com
          ingressClassName: nginx
          tls:
            - hosts: [obj.simonet.hub.samcday.com]
              secretName: rgw-cert
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              limits:
                cpu: ~
                memory: 2Gi
              requests:
                cpu: ~
                memory: 1Gi
            instances: 2
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
    ingress:
      dashboard:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        host:
          name: ceph-dashboard.simonet.hub.samcday.com
        tls:
          - hosts: [ceph-dashboard.simonet.hub.samcday.com]
            secretName: dashboard-certificate
        ingressClassName: nginx
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-extras
  namespace: simonet
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: rook-ceph
  targetNamespace: rook-ceph
  values:
    rook-config-override:
      apiVersion: v1
      kind: ConfigMap
      data:
        # mon_osd_crush_smoke_test = false fixes the issue of mon 100% CPU usage when creating OSD pools
        # seems to happen specifically under CoreOS + derivatives. Insanity.
        # https://tracker.ceph.com/issues/57782
        config: |
          [global]
          mon_osd_crush_smoke_test = false
          mon_data_avail_warn = 15
