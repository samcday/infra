---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: simonet
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.15.2
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  # Can't control the output of the webhook configs in chart (yet), so just manually delete them out for now.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: ValidatingWebhookConfiguration
              name: kube-system-cert-manager-webhook
            patch: |-
              $patch: delete
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingWebhookConfiguration
              metadata:
                name: kube-system-cert-manager-webhook
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: MutatingWebhookConfiguration
              name: kube-system-cert-manager-webhook
            patch: |-
              $patch: delete
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingWebhookConfiguration
              metadata:
                name: kube-system-cert-manager-webhook
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
    cainjector:
      replicaCount: 0
    crds:
      enabled: true
      keep: true
    replicaCount: 0
    webhook:
      replicaCount: 0
      url:
        host: cert-manager-controller-webhook.simonet.svc.cluster.hub.internal
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-controller
  namespace: simonet
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.15.2
  driftDetection:
    mode: enabled
  interval: 1h
  # Can't control the output of the webhook configs in chart (yet), so just manually delete them out for now.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: ValidatingWebhookConfiguration
              name: cert-manager-controller-webhook
            patch: |-
              $patch: delete
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingWebhookConfiguration
              metadata:
                name: cert-manager-controller-webhook
          - target:
              group: admissionregistration.k8s.io
              version: v1
              kind: MutatingWebhookConfiguration
              name: cert-manager-controller-webhook
            patch: |-
              $patch: delete
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingWebhookConfiguration
              metadata:
                name: cert-manager-controller-webhook
  values:
    # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
    cainjector:
      # couldn't quite figure out how to pet this appropriately
      enabled: false
      extraArgs: &extraArgs
        - --kubeconfig=/kubeconfig
      serviceAccount: &serviceAccount
        create: false
      volumeMounts: &volumeMounts
        - name: cert
          mountPath: /cert
        - name: kubeconfig
          mountPath: /kubeconfig
          subPath: kubeconfig
      volumes: &volumes
        - name: cert
          secret:
            secretName: admin
        - name: kubeconfig
          configMap:
            name: kubeconfig
    clusterResourceNamespace: kube-system
    crds:
      enabled: false
    extraArgs: *extraArgs
    global:
      rbac:
        create: false
    prometheus:
      servicemonitor:
        enabled: true
    serviceAccount: *serviceAccount
    startupapicheck:
      enabled: false
    volumeMounts: *volumeMounts
    volumes: *volumes
    webhook:
      config:
        apiVersion: webhook.config.cert-manager.io/v1alpha1
        kind: WebhookConfiguration
        tlsConfig:
          filesystem:
            certFile: /serving-cert/tls.crt
            keyFile: /serving-cert/tls.key
      extraArgs: *extraArgs
      serviceAccount: *serviceAccount
      url:
        host: cert-manager-controller-webhook.simonet.svc.cluster.hub.internal
      volumeMounts:
        - name: cert
          mountPath: /cert
        - name: kubeconfig
          mountPath: /kubeconfig
          subPath: kubeconfig
        - name: serving-cert
          mountPath: /serving-cert
      volumes:
        - name: cert
          secret:
            secretName: admin
        - name: kubeconfig
          configMap:
            name: kubeconfig
        - name: serving-cert
          secret:
            secretName: cert-manager-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook
spec:
  commonName: webhook-ca
  dnsNames:
    - cert-manager-controller-webhook.simonet.svc.cluster.hub.internal
  duration: 336h # 2 weeks
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  secretName: cert-manager-webhook-ca
  usages: [server auth]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-issuers
  namespace: simonet
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    _:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
    letsencrypt:
      spec:
        acme:
          email: me@samcday.com
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt
          solvers:
          - dns01:
              cloudflare:
                apiTokenSecretRef:
                  name: cloudflare
                  key: token
    selfsigned:
      spec:
        selfSigned: {}
