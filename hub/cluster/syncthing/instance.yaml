---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: instance
  namespace: syncthing
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    additionalVolumeMounts:
      - name: data
        mountPath: /var/syncthing
    additionalVolumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
    deploymentStrategy:
      type: Recreate
    image:
      repository: docker.io/syncthing/syncthing
      tag: 2.0.9
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      className: nginx
      hosts:
        - host: syncthing.hub.samcday.com
          paths:
            - path: /
              servicePortName: http
      tls:
        - hosts: [syncthing.hub.samcday.com]
          secretName: certificate
    livenessProbe:
      httpGet:
        path: /rest/noauth/health
        port: http
    ports:
      - name: http
        containerPort: 8384
    readinessProbe:
      httpGet:
        path: /rest/noauth/health
        port: http
    service:
      ports:
        - targetPort: http
          protocol: TCP
          name: http
          port: 80
