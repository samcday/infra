---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: instance
  namespace: syncthing
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    additionalVolumeMounts:
      - name: data
        mountPath: /var/syncthing
    additionalVolumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
    deploymentStrategy:
      type: Recreate
    image:
      repository: docker.io/syncthing/syncthing
      tag: 2.1.3
    ingress:
      enabled: false
    livenessProbe:
      httpGet:
        path: /rest/noauth/health
        port: http
    ports:
      - name: http
        containerPort: 8384
    readinessProbe:
      httpGet:
        path: /rest/noauth/health
        port: http
    service:
      ports:
        - targetPort: http
          protocol: TCP
          name: http
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: syncthing
  namespace: syncthing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: syncthing.hub.samcday.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: syncthing.hub.samcday.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  hostnames:
    - syncthing.hub.samcday.com
  parentRefs:
    - name: syncthing
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: instance-generic
          port: 80
