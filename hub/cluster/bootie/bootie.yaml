apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bootie
  namespace: kube-system
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    initContainers:
      - name: butane
        image: ghcr.io/samcday/infra-bootie:2025083005 # {"$imagepolicy": "flux-system:bootie"}
        command:
          - ash
          - -uexo
          - pipefail
          - -c
          - |
            for f in /butane/*.yaml; do
              name=$(basename $f)
              butane --strict < $f > /ignition/${name/.yaml}.ign
            done
        volumeMounts:
          - name: butane
            mountPath: /butane
          - name: ignition
            mountPath: /ignition
    additionalVolumeMounts:
      - name: ignition
        mountPath: /ignition
    additionalVolumes:
      - name: butane
        secret:
          secretName: butane
      - name: ignition
        emptyDir: {}
    deploymentStrategy:
      type: Recreate
    image:
      repository: ghcr.io/samcday/infra-bootie
      tag: "2025083005" # {"$imagepolicy": "flux-system:bootie:tag"}
    livenessProbe:
      httpGet: ~
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    readinessProbe: ~
    replicaCount: 1
    service:
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: bootie-hub.samcday.com
      loadBalancerClass: io.cilium/bgp-control-plane
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
