apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bootie
  namespace: kube-system
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    initContainers:
      - name: butane
        image: ghcr.io/samcday/infra-bootie:2026042401 # {"$imagepolicy": "flux-system:bootie"}
        command:
          - ash
          - -uexo
          - pipefail
          - -c
          - |
            mkdir -p /ignition/common
            for f in /butane/common/*.yaml; do
              name=$(basename $f)
              butane --strict < $f > /ignition/common/${name/.yaml}.ign
            done
            for f in /butane/*.yaml; do
              name=$(basename $f)
              butane -d /ignition --strict < $f > /ignition/${name/.yaml}.ign
            done
        volumeMounts:
          - name: butane
            mountPath: /butane
          - name: butane-common
            mountPath: /butane/common
          - name: ignition
            mountPath: /ignition
    additionalVolumeMounts:
      - name: ignition
        mountPath: /ignition
    additionalVolumes:
      - name: butane
        secret:
          secretName: butane
      - name: butane-common
        secret:
          secretName: butane-common
      - name: ignition
        emptyDir: {}
    deploymentStrategy:
      type: Recreate
    env:
      FCOS_BASE: http://10.0.1.1/static
      FCOS_VERSION: 42.20250803.3.0
    image:
      repository: ghcr.io/samcday/infra-bootie
      tag: "2026042401" # {"$imagepolicy": "flux-system:bootie:tag"}
    livenessProbe:
      httpGet: ~
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    podAnnotations:
      reloader.stakater.com/auto: "true"
    readinessProbe: ~
    replicaCount: 1
    service:
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: bootie.hub.samcday.com
      loadBalancerClass: io.cilium/bgp-control-plane
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
