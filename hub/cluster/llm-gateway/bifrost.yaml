apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
spec:
  replicas: 1
  # OSS quota counters are process-local; do not overlap replicas.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost
          image: docker.io/maximhq/bifrost:v2.2.6@sha256:d0b4708ace1aa175766f94afa715fd9bba3a1b56c1dc2afff15a21edf3ae4e2a
          command: [/app/main]
          args:
            - -app-dir
            - /app/data
            - -host
            - 0.0.0.0
            - -port
            - "8080"
            - -log-level
            - warn
          env:
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: CLIPROXY_API_KEY
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: BIFROST_ADMIN_PASSWORD
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: BIFROST_ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-data
        - name: config
          configMap:
            name: bifrost-config
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
spec:
  selector:
    app.kubernetes.io/name: bifrost
  ports:
    - name: http
      port: 8080
      targetPort: http
