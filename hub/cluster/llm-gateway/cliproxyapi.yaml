apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxyapi-auth
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxyapi
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-config
          image: docker.io/eceasy/cli-proxy-api:v8.0.22@sha256:fb287227792ae14eff38063479568049c90cb692b1f299e39c6f54650584428f
          command: [/bin/sh, /config/prepare-config.sh]
          env:
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: CLIPROXY_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime
              mountPath: /runtime
      containers:
        - name: cliproxyapi
          image: docker.io/eceasy/cli-proxy-api:v8.0.22@sha256:fb287227792ae14eff38063479568049c90cb692b1f299e39c6f54650584428f
          command: [/CLIProxyAPI/CLIProxyAPI]
          args: [-config, /runtime/config.yaml]
          ports:
            - name: http
              containerPort: 8317
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          # Node-origin TCP probes are blocked by the private ingress policy.
          # Use the image's bash TCP support to check loopback instead.
          readinessProbe:
            exec:
              command: [/usr/bin/timeout, "2", /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8317"]
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/usr/bin/timeout, "2", /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8317"]
            timeoutSeconds: 3
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: auth
              mountPath: /auths
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cliproxyapi-config
        - name: runtime
          emptyDir:
            medium: Memory
        - name: auth
          persistentVolumeClaim:
            claimName: cliproxyapi-auth
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
spec:
  selector:
    app.kubernetes.io/name: cliproxyapi
  ports:
    - name: http
      port: 8317
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliproxyapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
      ports:
        - protocol: TCP
          port: 8317
