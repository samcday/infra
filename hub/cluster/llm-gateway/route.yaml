apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - llm.samcday.com
  parentRefs:
    - name: public
      namespace: ingress-nginx
      sectionName: http
  rules:
    - matches:
        # Envoy rewrites X-Forwarded-Proto on the tunnel's HTTP origin hop.
        # Preserve HTTPS-only matching with Cloudflare's visitor scheme instead.
        - method: GET
          path:
            type: Exact
            value: /v1/models
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path:
            type: Exact
            value: /v1/chat/completions
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path:
            type: Exact
            value: /v1/responses
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path:
            type: Exact
            value: /v1/responses/compact
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path:
            type: Exact
            value: /anthropic/v1/messages
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
        - method: POST
          path:
            type: Exact
            value: /anthropic/v1/messages/count_tokens
          headers:
            - name: CF-Visitor
              type: RegularExpression
              value: '^\{\s*"scheme"\s*:\s*"https"\s*\}$'
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
              - name: Strict-Transport-Security
                value: max-age=31536000
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: bifrost
          port: 8080
