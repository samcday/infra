apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - llm.samcday.com
  parentRefs:
    - name: public
      namespace: ingress-nginx
      sectionName: http
  rules:
    - matches:
        # Cloudflare sets X-Forwarded-Proto from the visitor's connection.
        # This Gateway's HTTP listener is behind the encrypted tunnel.
        - method: GET
          path:
            type: Exact
            value: /v1/models
          headers:
            - name: X-Forwarded-Proto
              value: https
        - method: POST
          path:
            type: Exact
            value: /v1/chat/completions
          headers:
            - name: X-Forwarded-Proto
              value: https
        - method: POST
          path:
            type: Exact
            value: /v1/responses
          headers:
            - name: X-Forwarded-Proto
              value: https
        - method: POST
          path:
            type: Exact
            value: /v1/responses/compact
          headers:
            - name: X-Forwarded-Proto
              value: https
        - method: POST
          path:
            type: Exact
            value: /anthropic/v1/messages
          headers:
            - name: X-Forwarded-Proto
              value: https
        - method: POST
          path:
            type: Exact
            value: /anthropic/v1/messages/count_tokens
          headers:
            - name: X-Forwarded-Proto
              value: https
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
              - name: Strict-Transport-Security
                value: max-age=31536000
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: bifrost
          port: 8080
