---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: litestream
  namespace: vaultwarden
spec:
  generateBucketName: vaultwarden-litestream-
  storageClassName: ceph-bucket

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  chart:
    spec:
      chart: generic
      sourceRef:
        kind: HelmRepository
        name: community-tooling-charts
        namespace: flux-system
      version: 8.1.1
  interval: 1h
  values:
    # https://github.com/community-tooling/charts/blob/main/charts/generic/values.yaml
    additionalContainers:
      - name: litestream
        image: docker.io/litestream/litestream:v0.5.8@sha256:9874588ddb04789179d0d93cc902ba9309bb0cac4c33eb5631599d4559c60106
        args:
          - replicate
          - -config
          - /etc/litestream.yml
        envFrom:
          - secretRef:
              name: litestream
          - configMapRef:
              name: litestream
        volumeMounts:
          - name: data
            mountPath: /data
          - name: configmap
            mountPath: /etc/litestream.yml
            subPath: litestream.yml
            readOnly: true
    configMap:
      enabled: true
      data:
        litestream.yml: |-
          dbs:
            - path: /data/db.sqlite3
              restore-if-db-not-exists: true
              replica:
                url: s3://${BUCKET_NAME}/db.sqlite3?endpoint=http://${BUCKET_HOST}:${BUCKET_PORT}&region=${BUCKET_REGION}&force-path-style=true
      mountFiles:
        - subPath: litestream.yml
          mountPath: /etc/litestream.yml
    deploymentStrategy:
      type: Recreate
    env:
      DOMAIN: https://vaultwarden.samcday.com
      ROCKET_PORT: "80"
      DATA_FOLDER: /data
      SIGNUPS_ALLOWED: "false"
    envFrom:
      - secretRef:
          name: admin-token
    image:
      repository: docker.io/vaultwarden/server
      tag: 1.34.3-alpine@sha256:d70118b9dafb8588ee2651ceb5df68db27dcbd8e18467722010644ba48d5d6d6
    ingress:
      enabled: false
    initContainers:
      - name: litestream-restore
        image: docker.io/litestream/litestream:v0.5.8@sha256:9874588ddb04789179d0d93cc902ba9309bb0cac4c33eb5631599d4559c60106
        command:
          - /bin/sh
          - -ec
        args:
          - >-
            litestream restore
            -if-db-not-exists
            -if-replica-exists
            -config /etc/litestream.yml
            /data/db.sqlite3
        envFrom:
          - secretRef:
              name: litestream
          - configMapRef:
              name: litestream
        volumeMounts:
          - name: data
            mountPath: /data
          - name: configmap
            mountPath: /etc/litestream.yml
            subPath: litestream.yml
            readOnly: true
    livenessProbe:
      httpGet:
        path: /alive
        port: http
    persistence:
      enabled: true
      mountPath: /data
      storage: 2Gi
      accessMode: ReadWriteOnce
      storageClassName: ceph-block
    ports:
      - name: http
        containerPort: 80
    readinessProbe:
      httpGet:
        path: /alive
        port: http
    service:
      ports:
        - targetPort: http
          protocol: TCP
          name: http
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: vaultwarden.samcday.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: vaultwarden.samcday.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: certificate
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  hostnames:
    - vaultwarden.samcday.com
  parentRefs:
    - name: vaultwarden
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vaultwarden-generic
          port: 80
