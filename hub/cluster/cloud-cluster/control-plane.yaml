---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: control-plane
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/k8s-control-plane
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  interval: 1h
  upgrade:
    # Jobs in this chart have ttlSecondsAfterFinished and get GC'd between chart
    # upgrades; force recreates missing resources instead of failing to patch.
    force: true
  valuesFrom:
    - kind: ConfigMap
      name: control-plane-values
    - kind: Secret
      name: node-bootstrap-token
      valuesKey: id
      targetPath: bootstrapTokens[0].id
    - kind: Secret
      name: node-bootstrap-token
      valuesKey: secret
      targetPath: bootstrapTokens[0].secret
