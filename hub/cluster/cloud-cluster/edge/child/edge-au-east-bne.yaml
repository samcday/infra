apiVersion: blc.samcday.com/v1alpha1
kind: AutoScalingGroup
metadata:
  name: edge-au-east-bne
spec:
  image: ubuntu-24.04
  maxSize: 3
  minSize: 0
  namePrefix: edge-au-east-
  region: bne
  size: std-1vcpu
  template:
    metadata:
      labels:
        samcday.com/edge-region: au-east
        topology.kubernetes.io/zone: bne
  userData: |
    #!/bin/bash
    set -uexo pipefail

    export DEBIAN_FRONTEND=noninteractive

    apt-get update
    apt-get install -y ca-certificates curl gpg

    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    cat > /etc/apt/sources.list.d/kubernetes.list <<'EOF'
    deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /
    EOF
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list

    apt-get update
    apt-get install -y containerd kubeadm kubectl kubelet openssh-server tailscale

    cat > /etc/sysctl.d/k8s.conf <<'EOF'
    net.ipv4.ip_forward = 1
    EOF
    sysctl --system

    mkdir -p /etc/containerd
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml

    sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config

    echo 'KUBELET_EXTRA_ARGS="--cloud-provider=external"' > /etc/default/kubelet

    systemctl enable --now containerd.service kubelet.service ssh.service tailscaled.service
    systemctl restart containerd.service ssh.service
