apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: binarylane-controllers-crds
spec:
  chart:
    spec:
      chart: charts/binarylane-controllers-crds
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: binarylane-controllers
  install:
    crds: CreateReplace
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    crds: CreateReplace
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: binarylane-controllers
spec:
  chart:
    spec:
      chart: charts/binarylane-controllers
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: binarylane-controllers
  dependsOn:
    - name: binarylane-controllers-crds
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: kubeconfig
                  configMap:
                    name: kubeconfig
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: cert
                  secret:
                    secretName: admin
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: kubeconfig
                  mountPath: /kubeconfig
                  subPath: kubeconfig
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: cert
                  mountPath: /cert
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: KUBECONFIG
                  value: /kubeconfig
  releaseName: bl-controllers
  values:
    autoscaler:
      enabled: true
    existingSecret: bl-token
    image:
      tag: 0.0.1-rc.2
    mtls:
      enabled: true
      generate: true
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-cloud-config
data:
  cloud-config: |
    address: bl-controllers-binarylane-controllers.edge.svc:8086
    key: /etc/ssl/client-cert/tls.key
    cert: /etc/ssl/client-cert/tls.crt
    cacert: /etc/ssl/client-cert/ca.crt
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-au-east-cluster-autoscaler
spec:
  chart:
    spec:
      chart: cluster-autoscaler
      sourceRef:
        kind: HelmRepository
        name: autoscaler
      version: 9.56.0
  dependsOn:
    - name: binarylane-controllers
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
            patch: |
              - op: remove
                path: /spec/template/spec/containers/0/command/2
              - op: remove
                path: /spec/template/spec/serviceAccountName
  values:
    autoscalingGroups:
      - name: placeholder
        maxSize: 0
        minSize: 0
    cloudProvider: externalgrpc
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    extraArgs:
      cloud-config: /config/cloud-config
      expander: random
      kubeconfig: /kubeconfig
      leader-elect: "false"
    extraVolumeMounts:
      - name: cloud-config
        mountPath: /config
        readOnly: true
      - name: grpc-client-cert
        mountPath: /etc/ssl/client-cert
        readOnly: true
      - name: cert
        mountPath: /cert
        readOnly: true
      - name: kubeconfig
        mountPath: /kubeconfig
        subPath: kubeconfig
    extraVolumes:
      - name: cloud-config
        configMap:
          name: cluster-autoscaler-cloud-config
      - name: grpc-client-cert
        secret:
          defaultMode: 292
          secretName: binarylane-controller-mtls-client
      - name: cert
        secret:
          secretName: admin
      - name: kubeconfig
        configMap:
          name: kubeconfig
    rbac:
      create: false
