apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-au-east-cilium
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.18.0
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: cilium-operator
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 10
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
                value: 15
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
                value: 10
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 15
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    remediation:
      retries: 3
  values:
    envoy:
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_BIND_SERVICE
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.24.0.0/16
    k8sServiceHost: 100.64.0.64
    k8sServicePort: 6443
    kubeProxyReplacement: true
    nodeIPAM:
      enabled: true
    operator:
      extraArgs:
        - --leader-election-lease-duration=60s
        - --leader-election-renew-deadline=45s
        - --leader-election-retry-period=10s
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
      rollOutPods: true
    routingMode: native
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-au-east-coredns
spec:
  chart:
    spec:
      chart: coredns
      sourceRef:
        kind: HelmRepository
        name: coredns
      version: 1.39.2
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    remediation:
      retries: 3
  values:
    k8sAppLabelOverride: kube-dns
    replicaCount: 1
    service:
      clusterIP: 172.23.0.10
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-au-east-metrics-server
spec:
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: 3.12.1
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    remediation:
      retries: 3
  values:
    args:
      - --kubelet-insecure-tls
    replicas: 1
