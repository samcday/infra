apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: reloader
      version: 1.2.1
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  interval: 1h
  releaseName: reloader-cloud-cluster
  storageNamespace: cloud-cluster
  targetNamespace: cloud-cluster
  values:
    reloader:
      watchGlobally: false
