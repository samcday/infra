apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rokkitpokkit-tenant
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/managed-cluster-tenant-parent
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    tenant:
      name: rokkitpokkit
    namespace:
      create: false
    source:
      ignore: |
        /*
        !/infra/
        !/infra/**
      interval: 5m
      url: https://github.com/samcday/rokkitpokkit.git
    kustomization:
      interval: 5m
      path: ./infra/k8s
      prune: true
      timeout: 2m
    sops:
      enabled: true
      secretName: rokkitpokkit-age-key
    valuesFrom:
      - kind: Secret
        name: rokkitpokkit-age-key
        valuesKey: age.agekey
        targetPath: sops.ageKey
