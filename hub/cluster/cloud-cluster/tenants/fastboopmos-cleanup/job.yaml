apiVersion: batch/v1
kind: Job
metadata:
  name: fastboopmos-b2-purge
  namespace: cloud-cluster
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 900
  # No TTL or Flux force annotation: a managed Job must not recreate itself.
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          # Official docker.io/library/python:3.13.12-slim-bookworm image index.
          image: docker.io/library/python@sha256:a58daefb915e1e03ad48f3ca4df8832065412c5c35cacb9d39f4229184de12b6
          command: ["python", "-B", "-u", "/scripts/cleanup.py"]
          env:
            - name: B2_CLEANUP_MODE
              value: purge
            # Purge requires both IDs from a successful, checked inventory.
            - name: B2_EXPECTED_ACCOUNT_ID
              value: "75f63a749b92"
            - name: B2_EXPECTED_BUCKET_ID
              value: "f7555fa6d30a178499db0912"
            - name: B2_APPLICATION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fastboopmos-tofu-vars
                  key: b2_application_key_id
            - name: B2_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: fastboopmos-tofu-vars
                  key: b2_application_key
            - name: B2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: fastboopmos-tofu-vars
                  key: b2_bucket_name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: fastboopmos-b2-cleanup-script
            defaultMode: 0444
