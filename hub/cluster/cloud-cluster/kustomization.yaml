apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: control-plane-values
    files:
      - values.yaml=control-plane-values.yaml
namespace: cloud-cluster
resources:
  - ../../../.kustomize-config
  - cluster-autoscaler.yaml
  - control-plane.yaml
  - csi-driver.yaml
  - descheduler.yaml
  - etcdetcetc.yaml
  - external-dns.yaml
  - flux.yaml
  - flux-system
  - flux-webhook-token.yaml
  - flux-webhook.yaml
  - hccm.yaml
  - hub-apiserver-bootstrap.yaml
  - headscale-node-cleaner.yaml
  - hcloud-token.yaml
  - keda.yaml
  - keda-vpas.yaml
  - metrics-write-proxy.yaml
  - namespaces.yaml
  - nginx-gateway-fabric.yaml
  - nginx-gateway-shared.yaml
  - node-bootstrap-token.yaml
  - reloader.yaml
  - tofu.yaml
  - ts-apiserver.yaml
  - tofu-controller.yaml
  - vpas.yaml
  - wasmcloud.yaml
  - wasmcloud-nats.yaml
  - wasmcloud-demo.yaml
  - wasmcloud-monitoring.yaml
  - wasmcloud-vpas.yaml
