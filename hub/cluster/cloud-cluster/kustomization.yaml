apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: control-plane-values
    files:
      - values.yaml=control-plane-values.yaml
  - name: edge-au-east-control-plane-values
    files:
      - values.yaml=edge-au-east-control-plane-values.yaml
namespace: cloud-cluster
resources:
  - ../../../.kustomize-config
  - cluster-autoscaler.yaml
  - control-plane.yaml
  - csi-driver.yaml
  - descheduler.yaml
  - edge.yaml
  - edge-au-east-apiserver-proxy.yaml
  - edge-au-east-control-plane.yaml
  - edge-au-east-node-joiner.yaml
  - edge-au-east-node-bootstrap-token.yaml
  - etcdetcetc.yaml
  - external-dns.yaml
  - flux.yaml
  - flux-webhook-token.yaml
  - flux-webhook.yaml
  - hccm.yaml
  - hcloud-token.yaml
  - keda.yaml
  - keda-vpas.yaml
  - kustomizations.yaml
  - metrics-write-proxy.yaml
  - namespaces.yaml
  - node-bootstrap-token.yaml
  - reloader.yaml
  - tenants
  - tofu.yaml
  - ts-apiserver.yaml
  - tofu-controller.yaml
  - vpas.yaml
  - wasmcloud.yaml
  - wasmcloud-demo.yaml
  - wasmcloud-monitoring.yaml
  - wasmcloud-vpas.yaml
