apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: control-plane-values
    files:
      - values.yaml=control-plane-values.yaml
namespace: cloud-cluster
resources:
  - ../../../.kustomize-config
  - cluster-autoscaler.yaml
  - control-plane.yaml
  - csi-driver.yaml
  - descheduler.yaml
  - external-dns.yaml
  - fastboop.yaml
  - fastboopmos.yaml
  - flux.yaml
  - gibblox.yaml
  - hccm.yaml
  - hcloud-token.yaml
  - keda.yaml
  - kustomizations.yaml
  - node-bootstrap-token.yaml
  - rokkitpokkit.yaml
  - rokkitpokkit-tofu-state-passphrase.yaml
  - rokkitpokkit-tofu.yaml
  - tofu.yaml
  - ts-apiserver.yaml
  - tofu-controller.yaml
  - vpas.yaml
