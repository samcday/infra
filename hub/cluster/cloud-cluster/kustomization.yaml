apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: control-plane-values
    files:
      - values.yaml=control-plane-values.yaml
namespace: cloud-cluster
resources:
  - ../../../.kustomize-config
  - cluster-autoscaler.yaml
  - control-plane.yaml
  - csi-driver.yaml
  - descheduler.yaml
  - external-dns.yaml
  - fastboop.yaml
  - fastboopmos/fastboopmos.yaml
  - fastboopmos/fastboopmos-age-key.yaml
  - fastboopmos/fastboopmos-tofu.yaml
  - fastboopmos/fastboopmos-tofu-bucket-vars.yaml
  - flux.yaml
  - flux-webhook-token.yaml
  - flux-webhook.yaml
  - gibblox.yaml
  - hccm.yaml
  - hcloud-token.yaml
  - keda.yaml
  - kustomizations.yaml
  - metrics-write-proxy.yaml
  - namespaces.yaml
  - node-bootstrap-token.yaml
  - reloader.yaml
  - rokkitpokkit/rokkitpokkit.yaml
  - rokkitpokkit/rokkitpokkit-age-key.yaml
  - rokkitpokkit/rokkitpokkit-tofu-bucket-vars.yaml
  - rokkitpokkit/rokkitpokkit-tofu-cloudflare-vars.yaml
  - tofu.yaml
  - ts-apiserver.yaml
  - tofu-controller.yaml
  - vpas.yaml
  - wasmcloud.yaml
  - wasmcloud-demo.yaml
  - wasmcloud-monitoring.yaml
