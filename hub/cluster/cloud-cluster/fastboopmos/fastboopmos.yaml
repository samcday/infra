apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fastboopmos
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  storageNamespace: cloud-cluster
  targetNamespace: cloud-cluster
  values:
    fastboopmos-git:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: fastboopmos
      spec:
        ignore: |
          /*
          !/infra/
          /infra/*
          !/infra/k8s/
          !/infra/k8s/**
        interval: 5m
        ref:
          branch: main
        url: https://github.com/samcday/fastboopmos.git
    fastboopmos-reconciler:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: fastboopmos-reconciler
    fastboopmos-kustomization:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: fastboopmos
      spec:
        interval: 5m
        kubeConfig:
          secretRef:
            name: admin-kubeconfig
        path: ./infra/k8s
        prune: true
        serviceAccountName: fastboopmos-reconciler
        sourceRef:
          kind: GitRepository
          name: fastboopmos
        targetNamespace: fastboopmos
        timeout: 2m
