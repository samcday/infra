apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rokkitpokkit
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: flux-system
  targetNamespace: flux-system
  values:
    rokkitpokkit-git:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: rokkitpokkit
      spec:
        interval: 5m
        ref:
          branch: main
        url: https://github.com/samcday/rokkitpokkit.git
    rokkitpokkit-reconciler:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: rokkitpokkit-reconciler
    rokkitpokkit-reconciler-rb:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: rokkitpokkit-reconciler
        namespace: rokkitpokkit
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: rokkitpokkit-reconciler
          namespace: flux-system
    rokkitpokkit-kustomization:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: rokkitpokkit
      spec:
        interval: 5m
        path: ./infra/k8s
        prune: true
        serviceAccountName: rokkitpokkit-reconciler
        sourceRef:
          kind: GitRepository
          name: rokkitpokkit
        targetNamespace: rokkitpokkit
        timeout: 2m
