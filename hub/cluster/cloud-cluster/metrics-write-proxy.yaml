---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-write-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-write-proxy
  template:
    metadata:
      labels:
        app: metrics-write-proxy
    spec:
      containers:
        - name: kube-rbac-proxy
          image: quay.io/brancz/kube-rbac-proxy:v0.21.2
          args:
            - --insecure-listen-address=0.0.0.0:8080
            - --upstream=http://kube-prometheus-stack-prometheus.monitoring.svc:9090/
            - --kubeconfig=/kubeconfig
            - --auth-token-audiences=metrics-remote-write
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: cert
              mountPath: /cert
            - name: kubeconfig
              mountPath: /kubeconfig
              subPath: kubeconfig
      volumes:
        - name: cert
          secret:
            secretName: admin
        - name: kubeconfig
          configMap:
            name: kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-write-proxy
spec:
  selector:
    app: metrics-write-proxy
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-write
spec:
  hostnames:
    - metrics-write.hub.samcday.com
  parentRefs:
    - name: metrics-write
      namespace: monitoring
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: metrics-write-proxy
          port: 8080
