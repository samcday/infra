apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcdetcetc
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/etcdetcetc
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    crds: Create
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: etcdetcetc
  suspend: true
  targetNamespace: etcdetcetc
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: ghcr.io/samcday/infra-etcdetcetc
      tag: "2026072008" # {"$imagepolicy": "flux-system:etcdetcetc:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcdetcetc-cloud-etcd
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  dependsOn:
    - name: etcdetcetc
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: etcd
  suspend: true
  targetNamespace: etcd
  values:
    etcd:
      apiVersion: etcdetcetc.samcday.com/v1alpha1
      kind: EtcdCluster
      spec:
        endpoints:
          - https://etcd-0.etcd.etcd.svc:2379
          - https://etcd-1.etcd.etcd.svc:2379
          - https://etcd-2.etcd.etcd.svc:2379
        authSecretRef:
          name: etcd-root
        allowedNamespaces:
          - "*"
