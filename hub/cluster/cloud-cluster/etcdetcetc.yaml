apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcdetcetc
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/etcdetcetc
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  dependsOn:
    - name: namespaces
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    crds: Create
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: etcdetcetc
  # Upgrade gate: do not let the current pre-hardening controller reconcile
  # the new shared CRDs/chart. Resume only on a verified hardened digest after
  # every live legacy tenant/cluster namespace is inventoried and represented
  # in the runtime and namespaced RBAC values below. The Cloud etcd StatefulSet
  # is pinned to unsupported 3.6.10; upgrade and qualify it at 3.6.13 before
  # this release can resume. Suspension does not stop the legacy controller
  # Pod: immediately before eventual resume, an attended operation must scale
  # its Deployment to zero and prove the pre-Lease binary is gone so it cannot
  # overlap the hardened replicas. Prove the generated HelmChart artifact is
  # already at the exact hardened Git revision, pin its digest, and set
  # legacyClusterWideCoreWatches=false before removing this gate; the old chart
  # ignores digest values.
  suspend: true
  targetNamespace: etcdetcetc
  upgrade:
    crds: CreateReplace
  values:
    allowedNamespaces:
      # Provisional until the required live pre-resume inventory proves the
      # complete set previously covered by the cluster-wide legacy controller.
      - edge
      - etcd
    clusterNamespaces:
      - etcd
    image:
      repository: ghcr.io/samcday/infra-etcdetcetc
      tag: "2026072008"
    # Required only while the installed pre-hardening Pod remains. Change this
    # to false in the reviewed hardened-artifact resume revision.
    legacyClusterWideCoreWatches: true
    managedNamespaces:
      - edge
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcdetcetc-cloud-etcd
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  dependsOn:
    - name: etcdetcetc
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: etcd
  # Freeze the EtcdCluster owner alongside the controller upgrade gate. A
  # dependsOn edge orders reconciliation but does not stop this release from
  # deleting or replacing cluster state while the legacy controller has no
  # EtcdCluster finalizer. Keep it suspended even after the hardened controller
  # starts: wait for that finalizer, capture the exact observed 16-hex cluster
  # ID from ClusterIdentityAcceptanceRequired, commit it as metadata annotation
  # etcdetcetc.samcday.com/accept-cluster-id below, and only then resume this
  # owner. Repeat the complete live tenant inventory after the old controller
  # Pod is proven absent before finalizing the namespace/RBAC lists.
  suspend: true
  targetNamespace: etcd
  values:
    etcd:
      apiVersion: etcdetcetc.samcday.com/v1alpha1
      kind: EtcdCluster
      spec:
        endpoints:
          - https://etcd-0.etcd.etcd.svc:2379
          - https://etcd-1.etcd.etcd.svc:2379
          - https://etcd-2.etcd.etcd.svc:2379
        authSecretRef:
          name: etcd-root
        allowedNamespaces:
          - "*"
