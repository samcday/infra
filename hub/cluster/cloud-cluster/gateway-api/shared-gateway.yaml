---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: shared-gateway-certificate
      allowedRoutes:
        namespaces:
          from: All

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shared-gateway-certificate
  namespace: kube-system
spec:
  secretName: shared-gateway-certificate
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - "*.samcday.com"
    - "*.cloud.samcday.com"
    - "*.fastboop.win"
    - "*.rokkitpokkit.samcday.com"
    - "*.fastboopmos.samcday.com"
