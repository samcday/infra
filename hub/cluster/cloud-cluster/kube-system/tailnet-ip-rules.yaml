---
# Ensures traffic destined for the tailnet CGNAT range (100.64.0.0/10) and the
# pod CIDR (172.28.0.0/16) is routed via the tailscale policy table (52)
# regardless of the fwmark Cilium sets. Without this, Cilium's fwmark rules at
# priority 5210-5250 send marked traffic to the main table (which has only the
# default route via eth0) before tailscale's own rule at 5270 gets consulted.
# Result: cross-node pod traffic and host->tailnet traffic leak out the public
# interface and never reach the peer. Inserting these rules at priority 100
# puts them before the fwmark rules.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailnet-ip-rules
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    tailnet-ip-rules:
      apiVersion: apps/v1
      kind: DaemonSet
      spec:
        selector:
          matchLabels:
            app: tailnet-ip-rules
        template:
          metadata:
            labels:
              app: tailnet-ip-rules
          spec:
            hostNetwork: true
            tolerations:
              - operator: Exists
            priorityClassName: system-node-critical
            containers:
              - name: apply
                image: alpine:3.20
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    while :; do
                      ip rule add to 100.64.0.0/10 lookup 52 priority 100 2>/dev/null || true
                      ip rule add to 172.28.0.0/16 lookup 52 priority 101 2>/dev/null || true
                      sleep 60
                    done
                securityContext:
                  capabilities:
                    add: [NET_ADMIN]
                resources:
                  requests:
                    cpu: 5m
                    memory: 8Mi
                  limits:
                    memory: 32Mi
