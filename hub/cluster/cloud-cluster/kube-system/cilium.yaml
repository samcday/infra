---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.18.0
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    # https://github.com/cilium/cilium/blob/v1.18.0/install/kubernetes/cilium/values.yaml
    # Pod traffic crosses nodes via tailscale0 (MTU 1280) in this cluster, so
    # pin Cilium's MTU to match. Otherwise pods get MTU 1500, negotiate TCP
    # MSS 1460, and the large segments (e.g. apiserver TLS cert chain) don't
    # survive the WireGuard overhead on tailscale0 — reply gets silently
    # dropped and TLS handshakes stall. Simonet keeps the 1500 override
    # because its pod traffic rides a 1500 MTU LAN, not tailscale0.
    MTU: 1280
    envoy:
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_BIND_SERVICE
    hubble:
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
        # ingress:
        #   enabled: true
        #   className: nginx
        #   hosts: [hubble.samcday.com]
        #   tls:
        #     - hosts: [hubble.samcday.com]
        #       secretName: hubble-cert
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: "true"
      hostNetwork:
        enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.28.0.0/16
    k8sServiceHost: 100.64.0.3
    k8sServicePort: 6443
    kubeProxyReplacement: true
    loadBalancer:
      serviceTopology: true
    nodeIPAM:
      enabled: true
    defaultLBServiceIPAM: nodeipam
    operator:
      prometheus:
        serviceMonitor:
          enabled: true
      rollOutPods: true
      replicas: 2
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    routingMode: native
