---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.6.2
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    # https://github.com/grafana/helm-charts/blob/main/charts/alloy/values.yaml
    alloy:
      configMap:
        content: |
          // Discover and scrape ServiceMonitors and PodMonitors
          prometheus.operator.servicemonitors "default" {
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }
          prometheus.operator.podmonitors "default" {
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }

          // Discover nodes for kubelet + cAdvisor scraping
          discovery.kubernetes "nodes" {
            role = "node"
          }

          // Scrape kubelet metrics
          prometheus.scrape "kubelet" {
            targets         = discovery.kubernetes.nodes.targets
            scheme          = "https"
            scrape_interval = "60s"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }

          // Scrape cAdvisor metrics
          prometheus.scrape "cadvisor" {
            targets         = discovery.kubernetes.nodes.targets
            metrics_path    = "/metrics/cadvisor"
            scheme          = "https"
            scrape_interval = "60s"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              insecure_skip_verify = true
            }
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }

          // Inject cluster label on all metrics
          prometheus.relabel "add_cluster" {
            rule {
              target_label = "cluster"
              replacement  = "cloud"
            }
            forward_to = [prometheus.remote_write.hub.receiver]
          }

          // Ship metrics to hub Prometheus
          prometheus.remote_write "hub" {
            endpoint {
              url = "https://metrics-write.hub.samcday.com/api/v1/write"
              authorization {
                type             = "Bearer"
                credentials_file = "/var/run/secrets/metrics-token/token"
              }
              queue_config {
                max_samples_per_send = 5000
                batch_send_deadline  = "30s"
              }
            }
          }
      mounts:
        extra:
          - name: metrics-token
            mountPath: /var/run/secrets/metrics-token
            readOnly: true
      stabilityLevel: public-preview
    controller:
      type: daemonset
      volumes:
        extra:
          - name: metrics-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: metrics-remote-write
                    expirationSeconds: 3600
                    path: token
    crds:
      create: false
