---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hccm
  namespace: cloud-cluster
spec:
  chart:
    spec:
      chart: charts/hcloud-cloud-controller-manager
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  interval: 1h
  values:
    args:
      kubeconfig: /kubeconfig
      authentication-kubeconfig: /kubeconfig
      authorization-kubeconfig: /kubeconfig
      secure-port: "0"
    dnsPolicy: ~
    env:
      HCLOUD_NETWORK_DISABLE_ATTACHED_CHECK:
        value: 'true'
      HCLOUD_LOAD_BALANCERS_ENABLED:
        value: 'false'
    extraVolumeMounts:
      - name: cert
        mountPath: /cert
      - name: kubeconfig
        mountPath: /kubeconfig
        subPath: kubeconfig
    extraVolumes:
      - name: cert
        secret:
          secretName: admin
      - name: kubeconfig
        configMap:
          name: kubeconfig
    monitoring:
      podMonitor:
        enabled: true
    networking:
      enabled: false
