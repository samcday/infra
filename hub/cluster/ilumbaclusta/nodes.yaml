apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nodes
  namespace: ilumbaclusta
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  values:
    _:
      apiVersion: v1
      kind: Node
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
          kustomize.toolkit.fluxcd.io/ssa: merge
    m509da:
        labels:
          samcday.com/mac: 00-e0-4c-68-05-36
