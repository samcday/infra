apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: butane
  namespace: ilumbaclusta
spec:
  decryption:
    provider: sops
    secretRef:
      name: ignition-key
  interval: 1h
  path: ilumbaclusta/butane
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  targetNamespace: ilumbaclusta
  timeout: 5m
