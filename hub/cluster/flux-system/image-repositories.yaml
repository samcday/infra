apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: image-repositories
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImageRepository
      spec:
        interval: 5m
    bootie:
      spec:
        image: ghcr.io/samcday/infra-bootie
    etcdetcetc:
      spec:
        image: ghcr.io/samcday/infra-etcdetcetc
    headscale-node-cleaner:
      spec:
        image: ghcr.io/samcday/infra-headscale-node-cleaner
    node-joiner:
      spec:
        image: ghcr.io/samcday/infra-node-joiner
