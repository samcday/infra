apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: namespaces
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      kind: Namespace
    bootie:
    cert-manager:
    cloud-cluster:
    conduit:
    dex:
    cnpg-system:
    etcdetcetc:
    external-dns:
    forgejo:
    heisenbridge:
    headscale:
    ilumbaclusta:
    ingress-nginx:
    monitoring:
    openebs:
    prometheus-operator:
    rook-ceph:
    simonet:
    syncthing:
    tailscale:
    vaultwarden:
