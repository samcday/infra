---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  chart:
    spec:
      chart: tofu-controller
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
      version: 0.16.0-rc.5
  interval: 1h0s
  targetNamespace: flux-system
  install:
    crds: Create
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    # https://github.com/flux-iac/tofu-controller/blob/main/charts/tofu-controller/values.yaml
    allowBreakTheGlass: true
    allowCrossNamespaceRefs: true
    # branchPlanner:
    #   enabled: true
    caCertValidityDuration: 24h
    certRotationCheckFrequency: 30m
    clusterDomain: cluster.hub.internal
    concurrency: 4
    eventsAddress: http://notification-controller.flux-system.svc.cluster.hub.internal./
    image:
      tag: v0.16.0-rc.5
    replicaCount: 2
    runner:
      grpc:
        maxMessageSize: 30
      image:
        tag: v0.16.0-rc.5
      serviceAccount:
        allowedNamespaces:
          - fedora-mobility-ci
          - cloud-cluster
          - flux-system
          - headscale
          - kube-system
          - simonet
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: flux-system
  name: branch-planner
data:
  secretName: github-token
  resources: |-
    - namespace: fedora-mobility-ci
    - namespace: cloud-cluster
    - namespace: flux-system
    - namespace: headscale
    - namespace: kube-system
