apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: image-policies
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: image.toolkit.fluxcd.io/v1beta2
      kind: ImagePolicy
      spec:
        filterTags:
          pattern: '^(?P<timestamp>[0-9+]{10}(\.[0-9]+)?)$'
          extract: '$timestamp'
        policy:
          alphabetical:
            order: asc
    bootie:
      spec:
        imageRepositoryRef:
          name: bootie
    etcdetcetc:
      spec:
        imageRepositoryRef:
          name: etcdetcetc
    node-joiner:
      spec:
        imageRepositoryRef:
          name: node-joiner
