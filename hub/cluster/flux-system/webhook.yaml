apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: public-nginx
  rules:
  - host: flux.hub.samcday.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: webhook-receiver
            port: 
              number: 80
  tls:
  - hosts: [flux.hub.samcday.com]
    secretName: webhook-cert
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: infra
  namespace: flux-system
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: webhook-token
  resources:
    - kind: GitRepository
      name: infra
