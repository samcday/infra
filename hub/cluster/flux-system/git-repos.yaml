apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: git-repos
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      spec:
        interval: 1h
        ref:
          branch: main
    samcday-hetznercloud-csi-driver:
      spec:
        url: https://github.com/samcday/hetznercloud-csi-driver.git
