apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kustomizations
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      spec:
        decryption:
          provider: sops
          secretRef:
            name: age-key
        interval: 1h
        prune: true
        sourceRef:
          kind: GitRepository
          name: infra
          namespace: flux-system
        timeout: 5m
    cert-manager:
      spec:
        path: hub/cluster/cert-manager
    cnpg-system:
      spec:
        path: hub/cluster/cnpg-system
    external-dns:
      spec:
        path: hub/cluster/external-dns
    global:
      spec:
        path: hub/cluster/global
    headscale:
      spec:
        path: hub/cluster/headscale
    ilumbaclusta:
      spec:
        path: hub/cluster/ilumbaclusta
    ingress-nginx:
      spec:
        path: hub/cluster/ingress-nginx
    kube-system:
      spec:
        path: hub/cluster/kube-system
    openebs:
      spec:
        path: hub/cluster/openebs
    pixiecore:
      spec:
        path: hub/cluster/pixiecore
    prometheus-operator:
      spec:
        path: hub/cluster/prometheus-operator
    rook-ceph:
      spec:
        path: hub/cluster/rook-ceph
    tailscale:
      spec:
        path: hub/cluster/tailscale
