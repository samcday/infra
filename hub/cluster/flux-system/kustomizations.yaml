apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kustomizations
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      spec:
        decryption:
          provider: sops
          secretRef:
            name: age-key
        interval: 1h
        prune: true
        sourceRef:
          kind: GitRepository
          name: infra
          namespace: flux-system
        timeout: 5m
    cert-manager:
      spec:
        path: hub/cluster/cert-manager
    external-dns:
      spec:
        path: hub/cluster/external-dns
    global:
      spec:
        path: hub/cluster/global
    ingress-nginx:
      spec:
        path: hub/cluster/ingress-nginx
    kube-system:
      spec:
        path: hub/cluster/kube-system
    matchbox:
      spec:
        path: hub/cluster/matchbox
    prometheus-operator:
      spec:
        path: hub/cluster/prometheus-operator
