apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kustomizations
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      spec:
        decryption:
          provider: sops
          secretRef:
            name: age-key
        interval: 1h
        prune: true
        sourceRef:
          kind: GitRepository
          name: infra
          namespace: flux-system
        timeout: 5m
    bootie:
      spec:
        path: hub/cluster/bootie
    butane:
      spec:
        path: hub/butane
        targetNamespace: bootie
    butane-common:
      spec:
        path: common/butane
        targetNamespace: bootie
    gateway-api:
      spec:
        path: hub/cluster/gateway-api
    cert-manager:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/cert-manager
    dex:
      spec:
        dependsOn: [name: ingress-nginx]
        path: hub/cluster/dex
    etcdetcetc:
      spec:
        dependsOn: [name: cert-manager]
        path: hub/cluster/etcdetcetc
    external-dns:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/external-dns
    forgejo:
      spec:
        dependsOn:
          - name: dex
          - name: ingress-nginx
          - name: rook-ceph
        path: hub/cluster/forgejo
    global:
      spec:
        path: hub/cluster/global
    headscale:
      spec:
        path: hub/cluster/headscale
    ingress-nginx:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/ingress-nginx
    kube-system:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/kube-system
    cdi-operator:
      spec:
        path: hub/cluster/kubevirt/cdi-operator
        timeout: 10m
        wait: true
    kubevirt-operator:
      spec:
        path: hub/cluster/kubevirt/operator
        timeout: 10m
        wait: true
    llm-gateway:
      spec:
        dependsOn:
          - name: ingress-nginx
          - name: rook-ceph
        path: hub/cluster/llm-gateway
        wait: true
    monitoring:
      spec:
        dependsOn:
          - name: cert-manager
          - name: gateway-api
          - name: prometheus-operator
        path: hub/cluster/monitoring
    openebs:
      spec:
        path: hub/cluster/openebs
    prometheus-operator:
      spec:
        path: hub/cluster/prometheus-operator
    rook-ceph:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/rook-ceph
    syncthing:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/syncthing
    tailscale:
      spec:
        path: hub/cluster/tailscale
    vaultwarden:
      spec:
        dependsOn:
          - name: gateway-api
          - name: cert-manager
          - name: rook-ceph
        path: hub/cluster/vaultwarden
