apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kustomizations
  namespace: flux-system
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  values:
    _:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      spec:
        decryption:
          provider: sops
          secretRef:
            name: age-key
        interval: 1h
        prune: true
        sourceRef:
          kind: GitRepository
          name: infra
          namespace: flux-system
        timeout: 5m
    bootie:
      spec:
        path: hub/cluster/bootie
    butane:
      spec:
        path: hub/butane
        targetNamespace: bootie
    butane-common:
      spec:
        path: common/butane
        targetNamespace: bootie
    gateway-api:
      spec:
        path: hub/cluster/gateway-api
    cert-manager:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/cert-manager
    cloud-cluster:
      spec:
        path: hub/cluster/cloud-cluster
    fastboop:
      spec:
        path: hub/cluster/fastboop
    cnpg-system:
      spec:
        path: hub/cluster/cnpg-system
    dex:
      spec:
        dependsOn: [name: ingress-nginx]
        path: hub/cluster/dex
    conduit:
      spec:
        dependsOn:
          - name: gateway-api
          - name: ingress-nginx
        path: hub/cluster/conduit
    conduit-fastboop:
      spec:
        dependsOn:
          - name: gateway-api
          - name: ingress-nginx
        path: hub/cluster/conduit-fastboop
    external-dns:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/external-dns
    global:
      spec:
        path: hub/cluster/global
    headscale:
      spec:
        path: hub/cluster/headscale
    heisenbridge:
      spec:
        dependsOn:
          - name: conduit
        path: hub/cluster/heisenbridge
    ilumbaclusta:
      spec:
        path: hub/cluster/ilumbaclusta
    ilumbaclusta-butane:
      spec:
        path: ilumbaclusta/butane
        targetNamespace: ilumbaclusta
    ilumbaclusta-butane-common:
      spec:
        path: common/butane
        targetNamespace: ilumbaclusta
    ingress-nginx:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/ingress-nginx
    kube-system:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/kube-system
    monitoring:
      spec:
        dependsOn:
          - name: gateway-api
          - name: prometheus-operator
        path: hub/cluster/monitoring
    openebs:
      spec:
        path: hub/cluster/openebs
    paste:
      spec:
        dependsOn:
          - name: gateway-api
          - name: ingress-nginx
          - name: headscale
        path: hub/cluster/paste
    prometheus-operator:
      spec:
        path: hub/cluster/prometheus-operator
    rook-ceph:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/rook-ceph
    simonet:
      spec:
        path: hub/cluster/simonet
    simonet-butane:
      spec:
        path: simonet/butane
        targetNamespace: simonet
    simonet-butane-common:
      spec:
        path: common/butane
        targetNamespace: simonet
    syncthing:
      spec:
        dependsOn: [name: gateway-api]
        path: hub/cluster/syncthing
    tailscale:
      spec:
        path: hub/cluster/tailscale
