apiVersion: etcdetcetc.samcday.com/v1alpha1
kind: EtcdCluster
# Upgrade freeze: do not change or delete this directly Kustomized object while
# the etcdetcetc HelmRelease is suspended at the legacy-controller gate. The
# physical Hub store is still etcd 3.6.4 and cannot become Ready under the
# hardened controller until a separate attended 3.6.13 upgrade is qualified.
metadata:
  name: hub-etcd
spec:
  endpoints:
    - https://hub-az1-cp1.hub.internal:2379
    - https://hub-az1-cp2.hub.internal:2379
    - https://hub-az1-cp3.hub.internal:2379
  authSecretRef:
    name: hub-etcd-auth
  allowedNamespaces:
    - "*"
