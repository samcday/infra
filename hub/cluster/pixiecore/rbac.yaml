apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pixiecore
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pixiecore
subjects:
  - kind: ServiceAccount
    name: pixiecore-generic
    namespace: pixiecore
roleRef:
  kind: ClusterRole
  name: pixiecore
  apiGroup: rbac.authorization.k8s.io
