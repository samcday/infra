apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pixiecore
configMapGenerator:
  - name: api-scripts
    files:
      - api/boot-request.sh
      - api/generate-ignition.sh
      - api/nginx.conf
secretGenerator:
  - name: ignition
    files:
      - ignition/base.json
      - ignition/control-plane.json
      - ignition/etcd.json
      - ignition/tpm.json
      - ignition/var.json
resources:
  - ../../../.kustomize-config
  - pixiecore.yaml
  - rbac.yaml
