apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  repo: https://helm.cilium.io/
  chart: cilium
  version: 1.19.4
  bootstrap: true
  targetNamespace: kube-system
  # https://github.com/cilium/cilium/blob/v1.19.4/install/kubernetes/cilium/values.yaml
  valuesContent: |-
    autoDirectNodeRoutes: true
    bgpControlPlane:
      enabled: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.30.0.0/16
    k8sServiceHost: 10.0.1.254
    k8sServicePort: 6443
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      dsrDispatch: opt
      mode: dsr
      serviceTopology: true
    # Cilium is autodetecting the incorrect 1280 MTU of tailscale0
    # https://github.com/cilium/cilium/issues/14339
    MTU: 1500
    operator:
      rollOutPods: true
      replicas: 2
    routingMode: native
    socketLB:
      hostNamespaceOnly: true
