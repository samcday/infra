apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-sync
data:
  sync.sh: |
    #!/bin/sh
    set -eu

    export PATH="/tools:${PATH}"

    FORGEJO_URL="https://code.samcday.com"
    REMOTE_KUBECONFIG="/kubeconfigs/cloud-cluster"
    REMOTE_NAMESPACE="forgejo-runners"
    REMOTE_SECRET="forgejo-runner-secrets"
    FORGEJO_ADMIN_USERNAME="me"

    AMD64_NAME="forgejo-amd64"
    ARM64_NAME="forgejo-arm64"
    AMD64_LABELS="linux-amd64:docker://node:20-bookworm"
    ARM64_LABELS="linux-arm64:docker://node:20-bookworm"

    forgejo_exec() {
      pod_name="$(kubectl get pods -l app.kubernetes.io/instance=forgejo,app.kubernetes.io/name=forgejo -o jsonpath='{.items[0].metadata.name}')"
      if [ -z "${pod_name}" ]; then
        echo "failed to find forgejo pod"
        exit 1
      fi
      kubectl exec "${pod_name}" -- "$@"
    }

    remote_kubectl() {
      KUBECONFIG="${REMOTE_KUBECONFIG}" kubectl "$@"
    }

    remote_secret_value() {
      key="$1"
      remote_kubectl -n "${REMOTE_NAMESPACE}" get secret "${REMOTE_SECRET}" -o jsonpath="{.data.${key}}" 2>/dev/null | base64 -d || true
    }

    register_runner() {
      name="$1"
      labels="$2"
      workdir="$(mktemp -d)"
      token="$(forgejo_exec forgejo forgejo-cli actions generate-runner-token)"

      (
        cd "${workdir}"
        forgejo-runner register \
          --no-interactive \
          --instance "${FORGEJO_URL}" \
          --token "${token}" \
          --name "${name}" \
          --labels "${labels}" \
          >/dev/null
        cat .runner
      )

      rm -rf "${workdir}"
    }

    ensure_runner_file() {
      key="$1"
      name="$2"
      labels="$3"

      existing="$(remote_secret_value "${key}")"
      if [ -n "${existing}" ]; then
        printf '%s' "${existing}"
        return 0
      fi

      register_runner "${name}" "${labels}"
    }

    ensure_scaler_token() {
      existing="$(remote_secret_value 'forgejoToken')"
      if [ -n "${existing}" ]; then
        printf '%s' "${existing}"
        return 0
      fi

      forgejo_exec forgejo admin user generate-access-token \
        --username "${FORGEJO_ADMIN_USERNAME}" \
        --token-name "keda-forgejo-runners-$(date +%s)" \
        --scopes all \
        --raw
    }

    mkdir -p /tmp/forgejo-runner-sync
    AMD64_RUNNER="$(ensure_runner_file 'amd64\.runner' "${AMD64_NAME}" "${AMD64_LABELS}")"
    ARM64_RUNNER="$(ensure_runner_file 'arm64\.runner' "${ARM64_NAME}" "${ARM64_LABELS}")"
    SCALER_TOKEN="$(ensure_scaler_token)"

    printf '%s' "${AMD64_RUNNER}" > /tmp/forgejo-runner-sync/amd64.runner
    printf '%s' "${ARM64_RUNNER}" > /tmp/forgejo-runner-sync/arm64.runner

    remote_kubectl -n "${REMOTE_NAMESPACE}" create secret generic "${REMOTE_SECRET}" \
      --from-literal=forgejoToken="${SCALER_TOKEN}" \
      --from-file=amd64.runner=/tmp/forgejo-runner-sync/amd64.runner \
      --from-file=arm64.runner=/tmp/forgejo-runner-sync/arm64.runner \
      --dry-run=client \
      -o yaml | remote_kubectl apply -f -
