apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-runner-sync
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: forgejo-runner-sync
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: forgejo-runner-sync
                defaultMode: 0755
            - name: tools
              emptyDir: {}
            - name: cloud-cluster-kubeconfig
              secret:
                secretName: cloud-cluster-forgejo-runner-sync-kubeconfig
                items:
                  - key: value
                    path: cloud-cluster
          initContainers:
            - name: forgejo-runner-bin
              image: data.forgejo.org/forgejo/runner:12
              command:
                - /bin/sh
                - -ec
                - cp "$(command -v forgejo-runner)" /tools/forgejo-runner
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: sync
              image: bitnami/kubectl:1.33
              command:
                - /bin/sh
                - -ec
                - /script/sync.sh
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: cloud-cluster-kubeconfig
                  mountPath: /kubeconfigs
                  readOnly: true
