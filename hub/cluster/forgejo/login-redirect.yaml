apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: login-redirect
  namespace: forgejo
spec:
  hostnames:
    - code.samcday.com
  parentRefs:
    - name: public
      namespace: ingress-nginx
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /user/login
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /user/oauth2/dex
            statusCode: 302
