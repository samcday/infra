---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  chart:
    spec:
      chart: dex
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux-system
      version: 0.23.0
  interval: 1h
  values:
    # https://github.com/dexidp/helm-charts/blob/master/charts/dex/values.yaml
    config:
      issuer: https://dex.samcday.com
      storage:
        type: kubernetes
        config:
          inCluster: true
      enablePasswordDB: true
      staticClients:
        - id: tailscale
          redirectURIs: [https://login.tailscale.com/a/oauth_response]
          name: Tailscale
          secretEnv: TS_SECRET
        - id: fastboop-kubectl
          redirectURIs: [http://localhost:8000]
          name: fastboop kubectl
          public: true
      staticPasswords:
        - email: me@samcday.com
          hashFromEnv: PASS_HASH
          username: samcday
    envFrom:
      - secretRef:
          name: dex-secrets
    ingress:
      enabled: false
    replicaCount: 2
    serviceMonitor:
      enabled: true

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  hostnames:
    - dex.samcday.com
  parentRefs:
    - name: public
      namespace: ingress-nginx
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          port: 5556
