---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 1h
  ref:
    branch: main
  secretRef:
    name: ssh-key
  url: ssh://git@github.com:22/samcday/infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 1h
  path: hub/cluster/flux-system
  prune: false
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
