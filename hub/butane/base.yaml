variant: fcos
version: 1.5.0
passwd:
    users:
        - name: sam
          groups:
            - adm
            - wheel
            - sudo
            - systemd-journal
          ssh_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwawprQXEkGl38Q7T0PNseL0vpoyr4TbATMkEaZJTWQ
storage:
    files:
        - path: /etc/rancher/k3s/agent.token
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:wrsMxxT/J8HoZiOPh+lVyeWZhjz3TEl8E3AJsIoEvgf7ZbjaG3w+g3XfKvFfV+XBr6xhHWP3MPdXd9foA9FuYPI=,iv:phS7C8FCBJ/9T6FO6JpohHdsAdNWVsWH4RQoYAGx+os=,tag:xQXH58nwjo6ezn0y1oZqWg==,type:str]
        - path: /etc/rancher/k3s/registries.yaml
          contents:
            inline: |
                mirrors:
                  "*":
          overwrite: true
        - path: /etc/zincati/config.d/90-disable.toml
          contents:
            inline: |
                [updates]
                enabled = false
          overwrite: true
        - path: /usr/local/bin/k3s
          overwrite: true
          contents:
            source: http://10.0.1.1/static/k3s
          mode: 493
        - path: /usr/local/bin/install-k3s
          overwrite: true
          contents:
            source: http://10.0.1.1/static/install-k3s
          mode: 493
        - path: /var/lib/rancher/k3s/server/manifests/traefik.yaml.skip
          contents:
            inline: ""
          overwrite: true
systemd:
    units:
        - name: install-k3s.service
          enabled: true
          contents: |
            [Unit]
            Description=Run k3s install script
            ConditionPathExists=!/etc/%N.stamp

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            Environment=INSTALL_K3S_SKIP_DOWNLOAD=true
            ExecStart=/usr/local/bin/install-k3s
            ExecStart=/bin/touch /etc/%N.stamp

            [Install]
            WantedBy=multi-user.target
