storage:
    files:
        - path: /etc/rancher/k3s/agent.token
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:/Q4kjzPCj6KnuCn7Bj/Udvt+419EOXX+vvqmAmL6auoqGgRiMGL6qbtDuDrPw/8/rcH/ed0tWD1DVZ7Ak0qO0Rc=,iv:Bkj1WpUjAV5v6N3houvhasBF8A2yk5KYhyX21UwvyVM=,tag:+GGQp0k+rQ6fIj5iLRuToQ==,type:str]
        - path: /etc/rancher/k3s/registries.yaml
          contents:
            inline: |
                mirrors:
                  "*":
          overwrite: true
        - path: /etc/zincati/config.d/90-disable.toml
          contents:
            inline: |
                [updates]
                enabled = false
          overwrite: true
        - path: /usr/local/bin/k3s
          overwrite: true
          contents:
            source: http://10.0.1.1/static/k3s
          mode: 493
        - path: /usr/local/bin/install-k3s
          overwrite: true
          contents:
            source: http://10.0.1.1/static/install-k3s
          mode: 493
        - path: /var/lib/rancher/k3s/server/manifests/traefik.yaml.skip
          contents:
            inline: ""
          overwrite: true
systemd:
    units:
        - name: install-k3s.service
          enabled: true
          contents: |
            [Unit]
            Description=Run k3s install script
            ConditionPathExists=!/etc/%N.stamp
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            Environment=INSTALL_K3S_SKIP_DOWNLOAD=true
            ExecStart=/usr/local/bin/install-k3s
            ExecStart=/bin/touch /etc/%N.stamp

            [Install]
            WantedBy=multi-user.target
