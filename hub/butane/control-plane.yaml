variant: fcos
version: 1.5.0
storage:
    directories:
        - path: /etc/rancher/k3s/config.yaml.d
        - path: /var/lib/rancher/k3s/server
    files:
        - path: /etc/rancher/k3s/config.yaml.d/embedded-registry.yaml
          contents:
            inline: |
                embedded-registry: true
          overwrite: true
        - path: /etc/rancher/k3s/config.yaml.d/etcd-client.yaml
          overwrite: true
          contents:
            inline: |
                datastore-endpoint: https://hub-az1-cp1.hub.internal:2379,https://hub-az1-cp2.hub.internal:2379,https://hub-az1-cp3.hub.internal:2379
                datastore-cafile: /var/lib/rancher/k3s/server/etcd-ca.pem
                datastore-certfile: /var/lib/rancher/k3s/server/etcd-client.pem
                datastore-keyfile: /var/lib/rancher/k3s/server/etcd-client-key.pem
                kube-apiserver-arg+:
                  - etcd-prefix=/hub-cp
                  - etcd-compaction-interval=0
        - path: /etc/rancher/k3s/config.yaml.d/network.yaml
          overwrite: true
          contents:
            inline: |
                cluster-cidr: 172.30.0.0/16
                service-cidr: 172.31.0.0/16
                cluster-domain: cluster.hub.internal
        - path: /etc/rancher/k3s/config.yaml.d/no-flannel.yaml
          contents:
            inline: |
                flannel-backend: none
          overwrite: true
        - path: /etc/rancher/k3s/config.yaml.d/no-kube-proxy.yaml
          contents:
            inline: |
                disable-kube-proxy: true
        - path: /etc/rancher/k3s/config.yaml.d/tls-san.yaml
          overwrite: true
          contents:
            inline: |
                tls-san:
                  - 10.0.1.254
        - path: /etc/rancher/k3s/server.token
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:Moxa+dKnySAsDWeTMI9VhwKrVWbzcOHqY6QZGyIGUtPZcf92whJGEFna2JdeaHdlwZXv2i1c66sj83YXfVcpPHI=,iv:XzwTtE+3W5KnGbq5LlaxF7++EHQ0IFlSMB3O8eh320o=,tag:AhdhjVPaNtJ1mTU3s7LIuQ==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-ca.pem
          overwrite: true
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:cAPEyAJMj4k54OA44Ks0vJH3/xciSd01K/qGgjkefz0=,tag:4iWM2szKIoXERVGPHH9tOQ==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-client.pem
          overwrite: true
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:yBrw36X35ybuQxY2LHC6hUDaZDE/flayiQiJGl0D8ts=,tag:BgblmHtPxUGSZsqtpiJNUg==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-client-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:CTcvtHr1VOaL0YVZY5NFPnAMOyGH7ac8LQFm2KNawTY=,tag:rGGAyRB/2i7dK1M8U/Nv6g==,type:str]
        - path: /var/lib/rancher/k3s/server/manifests/cilium.yaml
          overwrite: true
          contents:
            inline: |
                apiVersion: helm.cattle.io/v1
                kind: HelmChart
                metadata:
                  name: cilium
                  namespace: kube-system
                spec:
                  repo: https://helm.cilium.io/
                  chart: cilium
                  version: 1.19.4
                  bootstrap: true
                  targetNamespace: kube-system
                  # https://github.com/cilium/cilium/blob/v1.19.4/install/kubernetes/cilium/values.yaml
                  valuesContent: |-
                    autoDirectNodeRoutes: true
                    bgpControlPlane:
                      enabled: true
                    ipam:
                      mode: kubernetes
                    ipv4NativeRoutingCIDR: 172.30.0.0/16
                    k8sServiceHost: 10.0.1.254
                    k8sServicePort: 6443
                    kubeProxyReplacement: true
                    l2announcements:
                      enabled: true
                    loadBalancer:
                      algorithm: maglev
                      dsrDispatch: opt
                      mode: dsr
                      serviceTopology: true
                    # Cilium is autodetecting the incorrect 1280 MTU of tailscale0
                    # https://github.com/cilium/cilium/issues/14339
                    MTU: 1500
                    operator:
                      rollOutPods: true
                      replicas: 2
                    routingMode: native
                    socketLB:
                      hostNamespaceOnly: true
        - path: /var/lib/rancher/k3s/server/manifests/flux-bootstrap.yaml
          overwrite: true
          contents:
            inline: |
                apiVersion: source.toolkit.fluxcd.io/v1
                kind: GitRepository
                metadata:
                  name: infra
                  namespace: flux-system
                spec:
                  interval: 1h
                  ref:
                    branch: main
                  secretRef:
                    name: ssh-key
                  url: ssh://git@github.com:22/samcday/infra.git
                ---
                apiVersion: kustomize.toolkit.fluxcd.io/v1
                kind: Kustomization
                metadata:
                  name: infra
                  namespace: flux-system
                spec:
                  decryption:
                    provider: sops
                    secretRef:
                      name: age-key
                  interval: 1h
                  path: hub/cluster/flux-system
                  prune: false
                  sourceRef:
                    kind: GitRepository
                    name: infra
                    namespace: flux-system
                  timeout: 5m
        - path: /var/lib/rancher/k3s/server/manifests/flux.yaml
          overwrite: true
          contents:
            inline: |
                apiVersion: helm.cattle.io/v1
                kind: HelmChart
                metadata:
                  name: flux
                  namespace: kube-system
                spec:
                  repo: https://fluxcd-community.github.io/helm-charts
                  chart: flux2
                  version: 2.16.4
                  bootstrap: true
                  createNamespace: true
                  targetNamespace: flux-system
                  # https://github.com/fluxcd-community/helm-charts/blob/main/charts/flux2/values.yaml
                  valuesContent: |-
                    clusterDomain: cluster.hub.internal
                    policies:
                      create: false
        - path: /var/lib/rancher/k3s/server/manifests/flux-age-key.yaml
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:VvhUZuZFzuKmtXcCJV7N0b2Xp4T38bUa76OU9rZtA9o=,tag:z1aCfNeff72Ob04YMjEuWg==,type:str]
        - path: /var/lib/rancher/k3s/server/manifests/flux-ssh-key.yaml
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:dBulNDIDhi3WK+l6tSbRhQbd3dIV13agpMpPTb0zsa4=,tag:lUR7AZEEy1fW/HGyaYW+cg==,type:str]
        - path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
          overwrite: true
          contents:
            # $ podman run --rm ghcr.io/kube-vip/kube-vip:v1.0.0 manifest daemonset --taint --address 10.0.1.254 --controlplane --arp --leaderElection --k8sConfigPath=/etc/rancher/k3s/k3s.yaml
            inline: |
                apiVersion: apps/v1
                kind: DaemonSet
                metadata:
                  creationTimestamp: null
                  labels:
                    app.kubernetes.io/name: kube-vip-ds
                    app.kubernetes.io/version: v1.0.0
                  name: kube-vip-ds
                  namespace: kube-system
                spec:
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: kube-vip-ds
                  template:
                    metadata:
                      creationTimestamp: null
                      labels:
                        app.kubernetes.io/name: kube-vip-ds
                        app.kubernetes.io/version: v1.0.0
                    spec:
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                            - matchExpressions:
                              - key: node-role.kubernetes.io/master
                                operator: Exists
                            - matchExpressions:
                              - key: node-role.kubernetes.io/control-plane
                                operator: Exists
                      containers:
                      - args:
                        - manager
                        env:
                        - name: vip_arp
                          value: "true"
                        - name: port
                          value: "6443"
                        - name: vip_nodename
                          valueFrom:
                            fieldRef:
                              fieldPath: spec.nodeName
                        - name: vip_subnet
                          value: "32"
                        - name: dns_mode
                          value: first
                        - name: cp_enable
                          value: "true"
                        - name: cp_namespace
                          value: kube-system
                        - name: vip_leaderelection
                          value: "true"
                        - name: vip_leasename
                          value: plndr-cp-lock
                        - name: vip_leaseduration
                          value: "30"
                        - name: vip_renewdeadline
                          value: "20"
                        - name: vip_retryperiod
                          value: "5"
                        - name: address
                          value: 10.0.1.254
                        - name: prometheus_server
                          value: :2112
                        image: ghcr.io/kube-vip/kube-vip:v1.0.0
                        imagePullPolicy: IfNotPresent
                        name: kube-vip
                        resources: {}
                        securityContext:
                          capabilities:
                            add:
                            - NET_ADMIN
                            - NET_RAW
                            drop:
                            - ALL
                        volumeMounts:
                        - mountPath: /etc/kubernetes/admin.conf
                          name: kubeconfig
                      hostAliases:
                      - hostnames:
                        - kubernetes
                        ip: 127.0.0.1
                      hostNetwork: true
                      tolerations:
                      - effect: NoSchedule
                        operator: Exists
                      - effect: NoExecute
                        operator: Exists
                      volumes:
                      - hostPath:
                          path: /etc/rancher/k3s/k3s.yaml
                        name: kubeconfig
                  updateStrategy: {}
systemd:
    units:
        - name: install-k3s.service
          dropins:
            - name: server.conf
              contents: |
                [Service]
                Environment=K3S_TOKEN_FILE=/etc/rancher/k3s/server.token
                Environment=K3S_AGENT_TOKEN_FILE=/etc/rancher/k3s/agent.token
