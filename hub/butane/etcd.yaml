variant: fcos
version: 1.5.0
storage:
    directories:
        - path: /var/lib/etcd
    files:
        - path: /var/lib/etcd/ca.pem
          overwrite: true
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:BKM0q5twsn8PgTy60QCmVgBWVlxtbgjhnnK94wCx/wk=,tag:XLIHAYTiMlBS63S//pK/YQ==,type:str]
        - path: /var/lib/etcd/peer.pem
          overwrite: true
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:lPCgBVwJW40fUcXysN3yiQKmcjwUy7MmglhpFnbL+Us=,tag:qsQ+5SzTe5a1ky9hbKRHlA==,type:str]
        - path: /var/lib/etcd/peer-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:+NboHcyE93QjSoJN+jRUYu1YZe9AUC/9d+IFMNQGvXk=,tag:RUnozPFo6Gl2dO1cjjqwvw==,type:str]
        - path: /etc/profile.d/etcdctl.sh
          overwrite: true
          contents:
            inline: |
                export ETCDCTL_KEY=/var/lib/etcd/peer-key.pem
                export ETCDCTL_CERT=/var/lib/etcd/peer.pem
                export ETCDCTL_CACERT=/var/lib/etcd/ca.pem
                export ETCDCTL_DISCOVERY_SRV=etcd.hub.internal

                alias etcdctl='sudo -E podman exec -it --env=ETCDCTL_* etcd etcdctl'
systemd:
    units:
        - name: etcd.service
          enabled: true
          contents: |
            [Unit]
            After=network-online.target
            Wants=network-online.target

            [Service]
            Environment=CLUSTER_STATE=existing
            # The etcd process runs in a Podman-managed libpod scope, so its
            # block-I/O weight is set on the container below rather than this
            # service cgroup. BFQ is active on the control-plane hosts.
            IOSchedulingClass=best-effort
            IOSchedulingPriority=0
            Restart=always
            RestartSec=5s
            ExecStartPre=-podman kill etcd
            ExecStartPre=-podman rm etcd
            ExecStart=podman run --name etcd --blkio-weight=100 --volume /var/lib/etcd:/var/lib/etcd:z --net=host quay.io/coreos/etcd:v3.6.4 \
                /usr/local/bin/etcd \
                    --name %H.hub.internal \
                    --initial-cluster-state=${CLUSTER_STATE} \
                    --initial-cluster hub-az1-cp1.hub.internal=https://hub-az1-cp1.hub.internal:2380,hub-az1-cp2.hub.internal=https://hub-az1-cp2.hub.internal:2380,hub-az1-cp3.hub.internal=https://hub-az1-cp3.hub.internal:2380 \
                    --initial-cluster-token hub-etcd \
                    --data-dir /var/lib/etcd \
                    --initial-advertise-peer-urls https://%H.hub.internal:2380 \
                    --listen-peer-urls https://0.0.0.0:2380 \
                    --advertise-client-urls https://%H.hub.internal:2379 \
                    --listen-client-urls https://0.0.0.0:2379 \
                    --client-cert-auth=true \
                    --peer-client-cert-auth=true \
                    --cert-file=/var/lib/etcd/peer.pem \
                    --key-file=/var/lib/etcd/peer-key.pem \
                    --trusted-ca-file=/var/lib/etcd/ca.pem \
                    --peer-cert-file=/var/lib/etcd/peer.pem \
                    --peer-key-file=/var/lib/etcd/peer-key.pem \
                    --peer-trusted-ca-file=/var/lib/etcd/ca.pem \
                    --auto-compaction-retention=5m \
                    --auto-compaction-mode=periodic
            ExecStop=/bin/podman stop etcd

            [Install]
            WantedBy=multi-user.target
