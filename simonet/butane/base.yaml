variant: fcos
version: 1.5.0
ignition:
    config:
        merge:
            # generated at runtime in bootie initContainer
            - local: secrets.ign
passwd:
    users:
        - name: sam
          groups:
            - adm
            - wheel
            - sudo
            - systemd-journal
          ssh_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwawprQXEkGl38Q7T0PNseL0vpoyr4TbATMkEaZJTWQ
storage:
    files:
        - path: /var/lib/extensions/tailscale.raw
          contents:
            # https://extensions.fcos.fr/extensions/tailscale/tailscale-0-1.88.1-1-43-x86-64.raw
            source: http://10.0.5.1/static/tailscale-0-1.88.1-1-43-x86-64.raw
        - path: /etc/zincati/config.d/90-disable.toml
          contents:
            inline: |
                [updates]
                enabled = false
          overwrite: true
systemd:
    units:
        - name: systemd-sysext.service
          enabled: true
        - name: tailscaled.service
          enabled: true
        - name: tailscale-up.service
          enabled: true
          contents: |-
            [Unit]
            After=network-online.target tailscaled.service
            Requires=network-online.target tailscaled.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=tailscale up --login-server=https://headscale.tail22d0a0.ts.net --accept-routes --auth-key=file:/etc/ts-authkey
            Restart=on-failure
            RestartSec=10s

            [Install]
            WantedBy=multi-user.target
