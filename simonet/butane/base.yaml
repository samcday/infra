variant: fcos
version: 1.5.0
passwd:
    users:
        - name: sam
          groups:
            - adm
            - wheel
            - sudo
            - systemd-journal
          ssh_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwawprQXEkGl38Q7T0PNseL0vpoyr4TbATMkEaZJTWQ
storage:
    files:
        - path: /var/lib/extensions/tailscale.raw
          contents:
            # https://extensions.fcos.fr/extensions/tailscale/tailscale-0-1.88.1-1-43-x86-64.raw
            source: http://10.0.5.1/static/tailscale-0-1.88.1-1-43-x86-64.raw
        - path: /var/lib/extensions/kubernetes-1.33.raw
          contents:
            # https://extensions.fcos.fr/extensions/kubernetes-1.33/kubernetes-1.33-1.33.4-1.fc42-42-x86-64.raw
            source: http://10.0.5.1/static/kubernetes-1.33-1.33.4-1.fc42-42-x86-64.raw
        # This file doesn't seem to end up in the right place when installing tailscale as a sysext.
        - path: /etc/default/tailscaled
          contents:
            inline: |
                PORT="41641"
                FLAGS=""
        - path: /etc/zincati/config.d/90-disable.toml
          contents:
            inline: |
                [updates]
                enabled = false
          overwrite: true
systemd:
    units:
        - name: systemd-sysext.service
          enabled: true
        - name: tailscaled.service
          enabled: true
        - name: tailscale-up.service
          enabled: true
          contents: |-
            [Unit]
            After=tailscaled.service
            Requires=tailscaled.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=tailscale up --login-server=https://headscale.tail22d0a0.ts.net --accept-routes --auth-key=file:/etc/ts-authkey
            Restart=on-failure
            RestartSec=10s

            [Install]
            WantedBy=multi-user.target
        # Without this, tailscale-up.service will never activate, because it's loaded before systemd-sysext has merged
        - name: tailscale-up.path
          enabled: true
          contents: |
            [Unit]
            After=systemd-sysext.service
            Wants=systemd-sysext.service

            [Path]
            PathExists=/usr/lib/systemd/system/tailscaled.service

            [Install]
            WantedBy=multi-user.target
        - name: kubelet.service
          enabled: true
        - name: kubeadm-join.service
          enabled: true
          contents: |
            [Unit]
            After=tailscale-up.service
            Requires=tailscale-up.service
            ConditionPathExists=!/etc/kubernetes/kubelet.conf
            ConditionPathExists=/etc/kubeadm.join

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=kubeadm join --config /etc/kubeadm.join
            Restart=on-failure
            RestartSec=30s

            [Install]
            WantedBy=multi-user.target
        # Same deal as tailscale-up.path. sysexts be wild, yo
        - name: kubeadm-join.path
          enabled: true
          contents: |
            [Unit]
            After=systemd-sysext.service
            Wants=systemd-sysext.service

            [Path]
            PathExists=/usr/bin/kubeadm

            [Install]
            WantedBy=multi-user.target
