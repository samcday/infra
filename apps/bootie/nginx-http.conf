access_log /dev/stdout;

server {
    listen 80;

    location /boot.ipxe {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/bootie/fcgi.sock;
        fastcgi_param BOOT_FORMAT ipxe;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/boot-request;
    }
    location /boot.grub {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/bootie/fcgi.sock;
        fastcgi_param BOOT_FORMAT grub;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/boot-request;
    }
    location /ignition {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/run/bootie/fcgi.sock;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/generate-ignition;
    }
    # Continue refusing old capability-shaped snapshots on mounted /pxe volumes.
    # They must not become public files when retiring their provisioning handler.
    location ~ "^/static/[0-9a-f]{32,64}\.img$" {
        access_log off;
        return 404;
    }
    location /static/ {
        alias /pxe/;
        autoindex off;
    }
}
