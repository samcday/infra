access_log /dev/stdout;

server {
    listen 80;

    location /boot.ipxe {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param BOOT_FORMAT ipxe;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/boot-request;
    }
    location /boot.grub {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param BOOT_FORMAT grub;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/boot-request;
    }
    location /ignition {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/generate-ignition;
    }
    location /custom-initramfs/ {
        access_log off;
        fastcgi_buffering off;
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param DOCUMENT_ROOT /tmp;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/serve-custom-initramfs;
    }
    # The normal static alias and the capability handoff share /pxe. Refuse
    # the capability namespace here so the same file cannot bypass the
    # re-stat/re-hash handler through /static/<capability>.
    location ~ ^/static/[0-9a-f]{32,64}\.img$ {
        access_log off;
        return 404;
    }
    location /static/ {
        alias /pxe/;
        autoindex off;
    }
}
