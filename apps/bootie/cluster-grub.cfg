set timeout=0
insmod net
insmod efinet
insmod http

if [ -z "$net_default_server" ]; then
  echo 'PXE supplied no Bootie server; continuing to the next firmware device.'
  sleep --interruptible 2
  exit
fi

if [ -z "$net_default_mac" ]; then
  echo 'PXE supplied no client MAC; continuing to the next firmware device.'
  sleep --interruptible 2
  exit
fi

configfile (http,$net_default_server)/boot.grub?mac=$net_default_mac
echo 'Bootie returned no bootable response; continuing to the next firmware device.'
sleep --interruptible 2
exit
