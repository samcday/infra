apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcdetcetc
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcdetcetc
rules:
  - apiGroups: ["etcdetcetc.samcday.com"]
    resources: ["etcdclusters", "etcdtenants"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["etcdetcetc.samcday.com"]
    resources: ["etcdclusters/status", "etcdtenants/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcdetcetc
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["etcdetcetc-leader"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcdetcetc
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etcdetcetc
subjects:
  - kind: ServiceAccount
    name: etcdetcetc
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcdetcetc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcdetcetc
subjects:
  - kind: ServiceAccount
    name: etcdetcetc
    namespace: default
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: etcdetcetc-leader
  namespace: default
  labels:
    app.kubernetes.io/name: etcdetcetc
    app.kubernetes.io/component: leader-election
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcdetcetc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcdetcetc
  template:
    metadata:
      labels:
        app: etcdetcetc
    spec:
      serviceAccountName: etcdetcetc
      containers:
        - name: controller
          image: localhost:5001/etcdetcetc
          env:
            - name: RUST_LOG
              value: info,etcdetcetc=debug
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 8080
              name: health
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
