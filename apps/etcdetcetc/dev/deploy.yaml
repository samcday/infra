apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcdetcetc
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcdetcetc
rules:
  - apiGroups: ["etcdetcetc.samcday.com"]
    resources: ["etcdclusters", "etcdtenants"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["etcdetcetc.samcday.com"]
    resources: ["etcdclusters/status", "etcdtenants/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcdetcetc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcdetcetc
subjects:
  - kind: ServiceAccount
    name: etcdetcetc
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcdetcetc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcdetcetc
  template:
    metadata:
      labels:
        app: etcdetcetc
    spec:
      serviceAccountName: etcdetcetc
      containers:
        - name: controller
          image: localhost:5001/etcdetcetc
          env:
            - name: RUST_LOG
              value: info,etcdetcetc=debug
