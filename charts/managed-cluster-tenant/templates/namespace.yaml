{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "managed-cluster-tenant.namespace" . }}
{{- with .Values.namespace.labels }}
  labels:
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .Values.namespace.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
