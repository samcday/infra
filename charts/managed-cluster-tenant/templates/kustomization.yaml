apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ include "managed-cluster-tenant.kustomizationName" . }}
  namespace: {{ include "managed-cluster-tenant.namespace" . }}
spec:
{{- if .Values.sops.enabled }}
  decryption:
    provider: sops
    secretRef:
      name: {{ include "managed-cluster-tenant.sopsSecretName" . }}
{{- end }}
  interval: {{ .Values.kustomization.interval }}
  path: {{ required "kustomization.path is required" .Values.kustomization.path }}
  prune: {{ .Values.kustomization.prune }}
  sourceRef:
    kind: GitRepository
    name: {{ include "managed-cluster-tenant.sourceName" . }}
{{- if .Values.kustomization.suspend }}
  suspend: true
{{- end }}
  targetNamespace: {{ default (include "managed-cluster-tenant.namespace" .) .Values.kustomization.targetNamespace }}
  timeout: {{ .Values.kustomization.timeout }}
