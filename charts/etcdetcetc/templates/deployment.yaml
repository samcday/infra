apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcdetcetc
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: etcdetcetc
  template:
    metadata:
      labels:
        app: etcdetcetc
        app.kubernetes.io/name: etcdetcetc
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: etcdetcetc
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := deepCopy .Values.affinity }}
      {{- if gt (int .Values.replicaCount) 1 }}
      {{- $controllerLabels := dict "app.kubernetes.io/name" "etcdetcetc" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "controller" }}
      {{- $requiredTerm := dict "labelSelector" (dict "matchLabels" $controllerLabels) "topologyKey" "kubernetes.io/hostname" }}
      {{- $affinity = mergeOverwrite $affinity (dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $requiredTerm))) }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: etcdetcetc
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: controller
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}{{ with .Values.image.tag }}:{{ . }}{{ end }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-election-lease-name={{ .Values.leaderElection.leaseName }}
            {{- if .Values.allowedNamespaces }}
            {{- range .Values.allowedNamespaces }}
            - --allowed-namespace={{ . }}
            {{- end }}
            {{- else }}
            - --allowed-namespace={{ .Release.Namespace }}
            {{- end }}
          env:
            - name: RUST_LOG
              value: info,etcdetcetc=debug
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 8080
              name: health
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
