apiServer:
  extraArgs: []
  image:
    digest: ""
    repository: registry.k8s.io/kube-apiserver
    pullPolicy: IfNotPresent
    tag: "v{{ $.Values.version }}"
  replicas: 2
  resources: {}
  securityContext: {}
  service:
    annotations:
    labels:
    # Set everything allowed in ServiceSpec here
    # Do not set a selector or add the apiserver 6443 port, that's handled by the chart.
    spec:
      type: ClusterIP
  vpa:
    enabled: true

adminKubeconfig:
  # Refresh flattened kubeconfigs after cert-manager rotates their source
  # certificates. Existing releases retain the historical weekly cadence.
  schedule: "@weekly"
  concurrencyPolicy: ""

bootstrapTokens:
  # - token: abcdef.0123456789abcdef
  # - id: abcdef
  #   extraGroups: [system:bootstrappers:kubeadm:default-node-token]
  #   secret: 0123456789abcdef

bootstrap:
  # kubeadm 1.31 and newer write v1beta4; keep v1beta3 as the legacy default.
  kubeadmAPIVersion: kubeadm.k8s.io/v1beta3

clusterDomain: cluster.local

clusterCIDRs: []
clusterDNS: []

clusterName: ~ # required

controllerManager:
  image:
    digest: ""
    repository: registry.k8s.io/kube-controller-manager
    pullPolicy: IfNotPresent
    tag: "v{{ $.Values.version }}"
  replicas: 2
  resources: {}
  securityContext: {}
  vpa:
    enabled: true

etcd:
  # a cert-manager issuerRef that can provide a client certificate for the etcd endpoint
  # https://cert-manager.io/docs/reference/api-docs/#meta.cert-manager.io/v1.ObjectReference
  certIssuer: # required
    # name: etcd
    # kind: ClusterIssuer
  clientSecret:
    # Set create=false when an external controller/template manages the Secret.
    create: true
    name: apiserver-etcd-client
  endpoints: []
  # A stable SHA-256 revision of an externally managed client leaf certificate.
  # The apiserver does not reliably reload --etcd-certfile/--etcd-keyfile, so
  # changing this rolls its Pods.
  clientCertificateRevision: ""
  # Require both public revision signals for controller-managed external
  # Secrets. etcdetcetc sets this true in its complete values handoff. The
  # false default preserves pre-handoff legacy releases until they can migrate.
  externalSecretRevisionsRequired: false
  # A stable revision of the physical etcd server-CA bundle. When this changes,
  # the apiserver Pods roll so their process-local RootCAs are rebuilt.
  serverCATrustRevision: ""
  # It's assumed that this control plane is using a multi-tenanted etcd cluster with RBAC enabled,
  # and thus the compaction API is not permitted.
  compactionInterval: "0"
  prefix: "/{{ $.Values.clusterName }}/"

# the hostname used to externally access this apiserver
externalHostname: ~ # required if externalIP is not set

# if not explicitly provided, it's assumed the apiserver Service is a LoadBalancer, so a Job
# will run during chart reconciliation to fetch the LB IP.
externalIP: ~

konnectivity:
  enabled: true
  agent:
    image: registry.k8s.io/kas-network-proxy/proxy-agent:v0.33.0
    replicas: 2
  port: 8091
  server:
    # dedicated uses a child-CA identity scoped to TokenReview delegation.
    # legacyAdmin preserves the historical system:masters client identity.
    clientIdentity: legacyAdmin
    extraArgs: []
    image: registry.k8s.io/kas-network-proxy/proxy-server:v0.33.0
    resources: {}

monitoring:
  podMonitors:
    enabled: true

parentClusterDomain: cluster.local

serviceIP: null

# Opt-in contract for workloads that run in the parent/hosting cluster. Keeping
# this disabled preserves the historical manifests for existing releases.
parentWorkloads:
  enabled: false
  placement:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  podSecurityContext: {}
  containerSecurityContext: {}
  deployment:
    priorityClassName: ""
    requiredPodAntiAffinityTopologyKey: ""
    minReadySeconds: 0
    terminationGracePeriodSeconds: null
    strategy: {}
    pdb:
      enabled: false
      spec: {}

scheduler:
  enabled: true
  config:
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
  deployment:
    annotations:
    labels:
    spec:
      replicas: 2
      # template:
      #   metadata:
      #     annotations:
      #     labels:
      #   spec:
      #     # extra containers can be added, and the main container can be fully customized
      #     containers:
      #       - name: extra-sidecar
      #       - name: kube-scheduler
      #         # command, ports and volumeMounts are appended to base instead of overwriting:
      #         command: [extra, args]
      #         ports:
      #           - name: extra
      #         volumeMounts:
      #           - name: extra
      #     nodeSelector:
      #       foo: bar
      #     volumes:
      #       - name: extra
  image:
    digest: ""
    repository: registry.k8s.io/kube-scheduler
    pullPolicy: IfNotPresent
    tag: "v{{ $.Values.version }}"
  resources: {}
  securityContext: {}
  vpa:
    enabled: true

utilities:
  image: bitnamilegacy/kubectl:1.33.4
  resources: {}
  # Mount an emptyDir at /tmp and set HOME there. Required when the common
  # container security context makes the root filesystem read-only.
  writableTmp: false

# Additional client-certificate identities for child-cluster access.
#
# Example:
# users:
#   - name: forgejo-runner-sync
#     commonName: forgejo-runner-sync
#     organizations: []
#     exportKubeconfigs:
#       - name: cloud-cluster-forgejo-runner-sync-kubeconfig
#         namespace: forgejo
#         external: true
#     rbac:
#       - namespace: forgejo-runners
#         rules:
#           - apiGroups: [""]
#             resources: ["secrets"]
#             verbs: ["create"]
#           - apiGroups: [""]
#             resources: ["secrets"]
#             resourceNames: ["forgejo-runner-secrets"]
#             verbs: ["get", "update", "patch"]
users: []

# Can be either an IPv4 subnet, an IPv6 subnet, or exactly one of each.
serviceCIDRs: []

version: 1.35.3
