{{- $jobSpec := fromYaml (tpl ($.Files.Get "files/admin-kubeconfig-generator.yaml") $) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: admin-kubeconfig-generator
  {{- if $.Values.parentWorkloads.enabled }}
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "admin-kubeconfig-generator") | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ required "missing adminKubeconfig.schedule" $.Values.adminKubeconfig.schedule | quote }}
  {{- with $.Values.adminKubeconfig.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      {{- toYaml $jobSpec | nindent 6 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "k8s-control-plane.run-once-job-name" (dict "root" $ "component" "admin-kubeconfig-generator") }}
  {{- if $.Values.parentWorkloads.enabled }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "admin-kubeconfig-generator") | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $jobSpec | nindent 2 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-kubeconfig-generator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-kubeconfig-generator
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
- apiGroups: [""]
  resourceNames: [admin-kubeconfig, admin-kubeconfig-external]
  resources: [secrets]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-kubeconfig-generator
subjects:
  - kind: ServiceAccount
    name: admin-kubeconfig-generator
roleRef:
  kind: Role
  name: admin-kubeconfig-generator
  apiGroup: rbac.authorization.k8s.io
{{- range $user := $.Values.users }}
{{- $userName := required "users[].name is required" $user.name }}
{{- range $export := $user.exportKubeconfigs }}
{{- if ne $export.namespace $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-kubeconfig-generator-{{ $userName }}-{{ required (printf "users[%s].exportKubeconfigs[].name is required" $userName) $export.name }}
  namespace: {{ required (printf "users[%s].exportKubeconfigs[].namespace is required" $userName) $export.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [create]
- apiGroups: [""]
  resourceNames: [{{ required (printf "users[%s].exportKubeconfigs[].name is required" $userName) $export.name }}]
  resources: ["secrets"]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-kubeconfig-generator-{{ $userName }}-{{ required (printf "users[%s].exportKubeconfigs[].name is required" $userName) $export.name }}
  namespace: {{ required (printf "users[%s].exportKubeconfigs[].namespace is required" $userName) $export.namespace }}
subjects:
  - kind: ServiceAccount
    name: admin-kubeconfig-generator
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: admin-kubeconfig-generator-{{ $userName }}-{{ required (printf "users[%s].exportKubeconfigs[].name is required" $userName) $export.name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
