apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "k8s-control-plane.run-once-job-name" (dict "root" $ "component" "ca-hash") }}
  {{- if $.Values.parentWorkloads.enabled }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "ca-hash") | nindent 4 }}
  {{- end }}
spec:
  template:
    {{- if $.Values.parentWorkloads.enabled }}
    metadata:
      labels:
        {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "ca-hash") | nindent 8 }}
    {{- end }}
    spec:
      {{- include "k8s-control-plane.parent-pod-spec" (dict "root" $ "component" "ca-hash") | nindent 6 }}
      containers:
        - name: ca-hash
          image: {{ include "k8s-control-plane.kubectl-image" $ }}
          {{- with $.Values.utilities.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "k8s-control-plane.container-security-context" (dict "root" $ "securityContext" (dict)) | nindent 10 }}
          {{- if $.Values.utilities.writableTmp }}
          env:
            - name: HOME
              value: /tmp
          {{- end }}
          command:
            - bash
            - -uexo
            - pipefail
            - -c
            - |
              hash=$(openssl x509 -pubkey -in /ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //')
              kubectl create configmap ca-hash --from-literal=hash="$hash" --dry-run=client --output yaml \
                | kubectl apply -f-
          volumeMounts:
            - name: ca
              mountPath: /ca.crt
              subPath: tls.crt
            {{- if $.Values.utilities.writableTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      serviceAccount: ca-hash
      restartPolicy: OnFailure
      volumes:
        - name: ca
          secret:
            secretName: ca
        {{- if $.Values.utilities.writableTmp }}
        - name: tmp
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-hash
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ca-hash
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resourceNames: [ca-hash]
  resources: [configmaps]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-hash
subjects:
  - kind: ServiceAccount
    name: ca-hash
roleRef:
  kind: Role
  name: ca-hash
  apiGroup: rbac.authorization.k8s.io
