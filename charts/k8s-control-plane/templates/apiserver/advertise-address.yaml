{{- if not $.Values.externalIP -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: advertise-address
  {{- if $.Values.parentWorkloads.enabled }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "advertise-address") | nindent 4 }}
  {{- end }}
spec:
  template:
    {{- if $.Values.parentWorkloads.enabled }}
    metadata:
      labels:
        {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "advertise-address") | nindent 8 }}
    {{- end }}
    spec:
      {{- include "k8s-control-plane.parent-pod-spec" (dict "root" $ "component" "advertise-address") | nindent 6 }}
      containers:
        - name: advertise-address
          image: {{ include "k8s-control-plane.kubectl-image" $ }}
          {{- with $.Values.utilities.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "k8s-control-plane.container-security-context" (dict "root" $ "securityContext" (dict)) | nindent 10 }}
          {{- if $.Values.utilities.writableTmp }}
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          command:
            - bash
            - -uexo
            - pipefail
            - -c
            - |
              {{- if $.Values.externalHostname }}
              until ip=$(getent ahostsv4 {{ $.Values.externalHostname | quote }} | awk '{print $1; exit}') && [[ -n "$ip" ]]; do
                sleep 5
              done
              {{- else }}
              ip=$(kubectl get svc apiserver -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              {{- end }}
              kubectl create configmap advertise-address --from-literal=value="$ip" --dry-run=client --output yaml \
                | kubectl apply -f-
              kubectl patch cert apiserver --type merge -p "{\"spec\":{\"ipAddresses\":[\"$ip\",\"{{ $.Values.serviceIP }}\"]}}"
      serviceAccount: advertise-address
      restartPolicy: OnFailure
      {{- if $.Values.utilities.writableTmp }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
  ttlSecondsAfterFinished: 60
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: advertise-address
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: advertise-address
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resourceNames: [advertise-address]
  resources: [configmaps]
  verbs: [get, update, patch]
- apiGroups: [""]
  resourceNames: [apiserver]
  resources: [services]
  verbs: [get]
- apiGroups: [cert-manager.io]
  resourceNames: [apiserver]
  resources: [certificates]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: advertise-address
subjects:
  - kind: ServiceAccount
    name: advertise-address
roleRef:
  kind: Role
  name: advertise-address
  apiGroup: rbac.authorization.k8s.io
{{ end }}
