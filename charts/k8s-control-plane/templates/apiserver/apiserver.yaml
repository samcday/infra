{{- if (empty $.Values.etcd.endpoints) -}}{{- fail "missing etcd.endpoints" -}}{{- end -}}
{{- if and $.Values.etcd.clientSecret.create $.Values.etcd.externalSecretRevisionsRequired -}}
{{- fail "etcd.externalSecretRevisionsRequired is valid only when etcd.clientSecret.create=false" -}}
{{- end -}}
{{- if and (not $.Values.etcd.clientSecret.create) $.Values.etcd.externalSecretRevisionsRequired (empty $.Values.etcd.serverCATrustRevision) -}}
{{- fail "missing etcd.serverCATrustRevision for externally managed etcd client Secret" -}}
{{- end -}}
{{- if and (not $.Values.etcd.clientSecret.create) $.Values.etcd.externalSecretRevisionsRequired (empty $.Values.etcd.clientCertificateRevision) -}}
{{- fail "missing etcd.clientCertificateRevision for externally managed etcd client Secret" -}}
{{- end -}}
{{- if and (not (empty $.Values.etcd.serverCATrustRevision)) (not (regexMatch "^sha256:[0-9a-f]{64}$" $.Values.etcd.serverCATrustRevision)) -}}
{{- fail "etcd.serverCATrustRevision must be sha256:<64 lowercase hex characters>" -}}
{{- end -}}
{{- if and (not (empty $.Values.etcd.clientCertificateRevision)) (not (regexMatch "^sha256:[0-9a-f]{64}$" $.Values.etcd.clientCertificateRevision)) -}}
{{- fail "etcd.clientCertificateRevision must be sha256:<64 lowercase hex characters>" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  {{- if $.Values.parentWorkloads.enabled }}
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "apiserver") | nindent 4 }}
  {{- end }}
spec:
  {{- include "k8s-control-plane.parent-deployment-spec" $ | nindent 2 }}
  replicas: {{ required "missing apiServer.replicas" $.Values.apiServer.replicas }}
  selector:
    matchLabels:
      app: apiserver
  template:
    metadata:
      {{- if or (not (empty $.Values.etcd.serverCATrustRevision)) (not (empty $.Values.etcd.clientCertificateRevision)) }}
      annotations:
        {{- with $.Values.etcd.clientCertificateRevision }}
        etcd.samcday.com/client-certificate-revision: {{ . | quote }}
        {{- end }}
        {{- with $.Values.etcd.serverCATrustRevision }}
        etcd.samcday.com/server-ca-trust-revision: {{ . | quote }}
        {{- end }}
      {{- end }}
      labels:
        app: apiserver
        {{- if $.Values.parentWorkloads.enabled }}
        {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "apiserver") | nindent 8 }}
        {{- end }}
    spec:
      {{- include "k8s-control-plane.parent-pod-spec" (dict "root" $ "component" "apiserver" "deployment" true "disableServiceAccountToken" true) | nindent 6 }}
      containers:
        - image: {{ include "k8s-control-plane.component-image" (dict "root" $ "image" $.Values.apiServer.image) }}
          {{- with $.Values.apiServer.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          name: apiserver
          {{- with $.Values.apiServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "k8s-control-plane.container-security-context" (dict "root" $ "securityContext" $.Values.apiServer.securityContext) | nindent 10 }}
          command:
            - kube-apiserver
            {{- if $.Values.externalIP }}
            - --advertise-address={{ $.Values.externalIP }}
            {{- else }}
            - --advertise-address=$(ADVERTISE_ADDRESS)
            {{- end }}
            - --allow-privileged=true
            - --authorization-mode=Node,RBAC
            - --client-ca-file=/cert/ca.crt
            {{- if $.Values.konnectivity.enabled }}
            - --egress-selector-config-file=/esc
            {{- end }}
            - --enable-admission-plugins=NodeRestriction
            - --enable-bootstrap-token-auth=true
            - --etcd-cafile=/apiserver-etcd-client/ca.crt
            - --etcd-certfile=/apiserver-etcd-client/tls.crt
            {{- with $.Values.etcd.compactionInterval }}
            - --etcd-compaction-interval={{ . }}
            {{- end }}
            - --etcd-keyfile=/apiserver-etcd-client/tls.key
            - --etcd-prefix={{ tpl (required "missing etcd.prefix" $.Values.etcd.prefix) $ }}
            - --etcd-servers={{ join "," (required "missing etcd.endpoints" $.Values.etcd.endpoints) }}
            - --kubelet-client-certificate=/admin/tls.crt
            - --kubelet-client-key=/admin/tls.key
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --proxy-client-cert-file=/front-proxy-client/tls.crt
            - --proxy-client-key-file=/front-proxy-client/tls.key
            - --requestheader-allowed-names=front-proxy-client
            - --requestheader-client-ca-file=/front-proxy-client/ca.crt
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-username-headers=X-Remote-User
            - --secure-port=6443
            {{- with $.Values.apiServer.extraArgs }}
            {{- range . }}
            - {{ tpl . $ | quote }}
            {{- end }}
            {{- end }}
            - --service-account-issuer=https://kubernetes.default.svc.{{ required "missing clusterDomain" $.Values.clusterDomain }}
            - --service-account-key-file=/sa/tls.crt
            - --service-account-signing-key-file=/sa/tls.key
            - --service-cluster-ip-range={{ join "," (required "missing serviceCIDRs" $.Values.serviceCIDRs) }}
            - --tls-cert-file=/cert/tls.crt
            - --tls-private-key-file=/cert/tls.key
          {{- if not $.Values.externalIP }}
          env:
            - name: ADVERTISE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: advertise-address
                  key: value
          {{- end }}
          livenessProbe:
            failureThreshold: 8
            httpGet:
              path: /livez
              port: 6443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 15
          ports:
            - containerPort: 6443
              name: https
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 6443
              scheme: HTTPS
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 15
          startupProbe:
            failureThreshold: 24
            httpGet:
              path: /livez
              port: 6443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 15
          volumeMounts:
            - name: admin
              mountPath: /admin
            - name: cert
              mountPath: /cert
            - name: apiserver-etcd-client
              mountPath: /apiserver-etcd-client
            - name: front-proxy-client
              mountPath: /front-proxy-client
            - name: sa
              mountPath: /sa
        {{- if $.Values.konnectivity.enabled }}
            - name: apiserver-egress
              mountPath: /esc
              subPath: egress.yaml
            - name: konnectivity
              mountPath: /konnectivity
        - name: konnectivity-server
          image: {{ $.Values.konnectivity.server.image }}
          command: [/proxy-server]
          args:
            - --uds-name=/konnectivity/socket
            - --delete-existing-uds-file
            - --cluster-cert=/apiserver-cert/tls.crt
            - --cluster-key=/apiserver-cert/tls.key
            - --server-port=0
            - --agent-port={{ $.Values.konnectivity.port }}
            - --health-port=8092
            - --admin-port=8093
            - --keepalive-time=1h
            - --mode=grpc
            - --agent-namespace=kube-system
            - --agent-service-account=konnectivity-agent
            {{- if eq $.Values.konnectivity.server.clientIdentity "dedicated" }}
            - --kubeconfig=/konnectivity-kubeconfig
            {{- else }}
            - --kubeconfig=/kubeconfig
            {{- end }}
            - --authentication-audience=system:konnectivity-server
            - --server-count={{ $.Values.apiServer.replicas }}
            {{- range $.Values.konnectivity.server.extraArgs }}
            - {{ tpl . $ | quote }}
            {{- end }}
          {{- with $.Values.konnectivity.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "k8s-control-plane.container-security-context" (dict "root" $ "securityContext" (dict)) | nindent 10 }}
          livenessProbe:
            httpGet:
              port: 8092
              path: /healthz
            initialDelaySeconds: 10
            timeoutSeconds: 60
          volumeMounts:
            {{- if eq $.Values.konnectivity.server.clientIdentity "dedicated" }}
            - name: konnectivity-client
              mountPath: /konnectivity-client
            {{- else }}
            - name: admin
              mountPath: /cert
            {{- end }}
            - name: cert
              mountPath: /apiserver-cert
            - name: konnectivity
              mountPath: /konnectivity
            {{- if eq $.Values.konnectivity.server.clientIdentity "dedicated" }}
            - name: konnectivity-kubeconfig
              mountPath: /konnectivity-kubeconfig
              subPath: kubeconfig
            {{- else }}
            - name: kubeconfig
              mountPath: /kubeconfig
              subPath: kubeconfig
            {{- end }}
        {{- end }}
      volumes:
        - name: cert
          secret:
            secretName: apiserver-cert
        - name: apiserver-etcd-client
          secret:
            secretName: {{ required "missing etcd.clientSecret.name" $.Values.etcd.clientSecret.name }}
        - name: front-proxy-client
          secret:
            secretName: front-proxy-client
        - name: sa
          secret:
            secretName: sa
        {{ if $.Values.konnectivity.enabled }}
        - name: admin
          secret:
            secretName: admin
        - name: apiserver-egress
          configMap:
            name: apiserver-egress
        - name: konnectivity
          emptyDir: {}
        - name: kubeconfig
          configMap:
            name: kubeconfig
        {{- if eq $.Values.konnectivity.server.clientIdentity "dedicated" }}
        - name: konnectivity-client
          secret:
            secretName: konnectivity-server
        - name: konnectivity-kubeconfig
          configMap:
            name: konnectivity-server-kubeconfig
        {{- end }}
        {{ end }}
---
{{ if $.Values.konnectivity.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver-egress
data:
    egress.yaml: |
      apiVersion: apiserver.k8s.io/v1beta1
      kind: EgressSelectorConfiguration
      egressSelections:
        - name: cluster
          connection:
            proxyProtocol: GRPC
            transport:
              uds:
                udsName: /konnectivity/socket
        - name: controlplane
          connection:
            proxyProtocol: GRPC
            transport:
              uds:
                udsName: /konnectivity/socket
---
{{- if eq $.Values.konnectivity.server.clientIdentity "legacyAdmin" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:konnectivity-server
  labels:
    kubernetes.io/cluster-service: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:konnectivity-server
---
{{- end }}
{{ end }}
