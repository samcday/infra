apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apiserver-etcd-client
spec:
  secretName: apiserver-etcd-client
  duration: 24h
  usages: [client auth]
  commonName: {{ $.Values.clusterName }}
  issuerRef:
    {{- required "missing etcd.certIssuer" $.Values.etcd.certIssuer | toYaml | nindent 4 }}
