apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
spec:
  template:
    spec:
      containers:
        - name: bootstrap
          image: {{ include "k8s-control-plane.kubectl-image" $ }}
          command:
            - bash
            - -uexo
            - pipefail
            - -c
            - |
              ca_hash=$(base64 -w0 < /cert/ca.crt)
              cat <<HERE | sed "s/__CAHASH__/$ca_hash/" > /tmp/manifests
              {{- tpl ($.Files.Get "files/cluster-bootstrap.yaml") $ | nindent 14 -}}
              HERE
              kubectl apply -f /tmp/manifests
          env:
            - name: KUBECONFIG
              value: /kubeconfig
          volumeMounts:
            - name: cert
              mountPath: /cert
            - name: kubeconfig
              mountPath: /kubeconfig
              subPath: kubeconfig
      volumes:
        - name: cert
          secret:
            secretName: admin
        - name: kubeconfig
          configMap:
            name: kubeconfig
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 60
