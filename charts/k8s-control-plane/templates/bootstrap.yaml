apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  {{- if $.Values.parentWorkloads.enabled }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
  labels:
    {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "bootstrap") | nindent 4 }}
  {{- end }}
spec:
  template:
    {{- if $.Values.parentWorkloads.enabled }}
    metadata:
      labels:
        {{- include "k8s-control-plane.stable-labels" (dict "root" $ "component" "bootstrap") | nindent 8 }}
    {{- end }}
    spec:
      {{- include "k8s-control-plane.parent-pod-spec" (dict "root" $ "component" "bootstrap" "disableServiceAccountToken" true) | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "k8s-control-plane.kubectl-image" $ }}
          {{- with $.Values.utilities.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "k8s-control-plane.container-security-context" (dict "root" $ "securityContext" (dict)) | nindent 10 }}
          command:
            - bash
            - -uexo
            - pipefail
            - -c
            - |
              ca_hash=$(base64 -w0 < /cert/ca.crt)
              cat <<HERE | sed "s/__CAHASH__/$ca_hash/" > /tmp/manifests
              {{- tpl ($.Files.Get "files/cluster-bootstrap.yaml") $ | nindent 14 -}}
              HERE
              kubectl apply -f /tmp/manifests
          env:
            - name: KUBECONFIG
              value: /kubeconfig
            {{- if $.Values.utilities.writableTmp }}
            - name: HOME
              value: /tmp
            {{- end }}
          volumeMounts:
            - name: cert
              mountPath: /cert
            - name: kubeconfig
              mountPath: /kubeconfig
              subPath: kubeconfig
            {{- if $.Values.utilities.writableTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: cert
          secret:
            secretName: admin
        - name: kubeconfig
          configMap:
            name: kubeconfig
        {{- if $.Values.utilities.writableTmp }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 60
