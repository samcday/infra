apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig
data:
    kubeconfig: |
        apiVersion: v1
        clusters:
          - cluster:
              certificate-authority: /cert/ca.crt
              server: https://apiserver.{{ $.Release.Namespace }}.svc.{{ $.Values.parentClusterDomain }}:6443
            name: {{ $.Values.clusterName }}
        contexts:
          - context:
              cluster: {{ $.Values.clusterName }}
              user: {{ $.Values.clusterName }}-admin
            name: {{ $.Values.clusterName }}-admin@{{ $.Values.clusterName }}
        current-context: {{ $.Values.clusterName }}-admin@{{ $.Values.clusterName }}
        kind: Config
        preferences: {}
        users:
          - name: {{ $.Values.clusterName }}-admin
            user:
              client-certificate: /cert/tls.crt
              client-key: /cert/tls.key
{{- if and $.Values.konnectivity.enabled (eq $.Values.konnectivity.server.clientIdentity "dedicated") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: konnectivity-server-kubeconfig
data:
  kubeconfig: |
    apiVersion: v1
    clusters:
      - cluster:
          certificate-authority: /konnectivity-client/ca.crt
          server: https://apiserver.{{ $.Release.Namespace }}.svc.{{ $.Values.parentClusterDomain }}:6443
        name: {{ $.Values.clusterName }}
    contexts:
      - context:
          cluster: {{ $.Values.clusterName }}
          user: system:konnectivity-server
        name: system:konnectivity-server@{{ $.Values.clusterName }}
    current-context: system:konnectivity-server@{{ $.Values.clusterName }}
    kind: Config
    preferences: {}
    users:
      - name: system:konnectivity-server
        user:
          client-certificate: /konnectivity-client/tls.crt
          client-key: /konnectivity-client/tls.key
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig-external
data:
    kubeconfig: |
        apiVersion: v1
        clusters:
          - cluster:
              certificate-authority: /cert/ca.crt
              server: https://{{ default $.Values.externalIP $.Values.externalHostname }}:6443
            name: {{ $.Values.clusterName }}
        contexts:
          - context:
              cluster: {{ $.Values.clusterName }}
              user: {{ $.Values.clusterName }}-admin
            name: {{ $.Values.clusterName }}-admin@{{ $.Values.clusterName }}
        current-context: {{ $.Values.clusterName }}-admin@{{ $.Values.clusterName }}
        kind: Config
        preferences: {}
        users:
          - name: {{ $.Values.clusterName }}-admin
            user:
              client-certificate: /cert/tls.crt
              client-key: /cert/tls.key
