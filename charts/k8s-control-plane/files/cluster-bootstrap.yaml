apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: kube-public
data:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        certificate-authority-data: __CAHASH__
        server: https://{{ default $.Values.externalIP $.Values.externalHostname }}:6443
      name: ""
    contexts: null
    current-context: ""
    kind: Config
    preferences: {}
    users: null
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeadm-config
  namespace: kube-system
data:
  ClusterConfiguration: |
    apiVersion: {{ $.Values.bootstrap.kubeadmAPIVersion }}
    kind: ClusterConfiguration
    clusterName: {{ $.Values.clusterName }}
    kubernetesVersion: v{{ $.Values.version }}
    networking:
      dnsDomain: {{ $.Values.clusterDomain }}
      podSubnet: {{ join "," $.Values.clusterCIDRs }}
      serviceSubnet: {{ join "," $.Values.serviceCIDRs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelet-config
  namespace: kube-system
data:
  kubelet: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    cgroupDriver: systemd
    {{- with $.Values.clusterDNS }}
    clusterDNS:
      {{- . | toYaml | nindent 6 }}
    {{- end }}
    clusterDomain: {{ $.Values.clusterDomain }}
    rotateCertificates: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeadm:node-autoapprove-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:certificates.k8s.io:certificatesigningrequests:nodeclient
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:bootstrappers:kubeadm:default-node-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeadm:node-autoapprove-certificate-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:certificates.k8s.io:certificatesigningrequests:selfnodeclient
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeadm:kubelet-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:node-bootstrapper
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:bootstrappers:kubeadm:default-node-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeadm:get-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeadm:get-nodes
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:bootstrappers:kubeadm:default-node-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeadm:get-nodes
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
---
{{- if $.Values.konnectivity.enabled }}
{{- if eq $.Values.konnectivity.server.clientIdentity "dedicated" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:konnectivity-server
  labels:
    kubernetes.io/cluster-service: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:konnectivity-server
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konnectivity-agent
  namespace: kube-system
  labels:
    kubernetes.io/cluster-service: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kube-system
  name: konnectivity-agent
spec:
  replicas: {{ required "missing konnectivity.agent.replicas" $.Values.konnectivity.agent.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: konnectivity-agent
  template:
    metadata:
      labels:
        app: konnectivity-agent
    spec:
      containers:
        - name: konnectivity-agent
          image: {{ $.Values.konnectivity.agent.image }}
          command: [/proxy-agent]
          args:
            - --logtostderr=true
            - --ca-cert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --proxy-server-host={{ default $.Values.externalHostname $.Values.externalIP }}
            - --proxy-server-port={{ $.Values.konnectivity.port }}
            - --sync-interval=5s
            - --sync-interval-cap=30s
            - --sync-forever
            - --probe-interval=5s
            - --service-account-token-path=/var/run/secrets/tokens/konnectivity-agent-token
            - --agent-identifiers=ipv4=\${HOST_IP}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          livenessProbe:
            httpGet:
              scheme: HTTP
              port: 8093
              path: /healthz
            initialDelaySeconds: 15
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 50m
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              scheme: HTTP
              port: 8093
              path: /readyz
            initialDelaySeconds: 15
            timeoutSeconds: 15
          volumeMounts:
            - mountPath: /var/run/secrets/tokens
              name: konnectivity-agent-token
      hostNetwork: true
      priorityClassName: system-cluster-critical
      serviceAccountName: konnectivity-agent
      tolerations:
        - operator: Exists
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: konnectivity-agent
      volumes:
        - name: konnectivity-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: konnectivity-agent-token
                  audience: system:konnectivity-server
---
{{- end }}
{{- range $.Values.bootstrapTokens }}
{{- $id := .id }}
{{- $secret := .secret }}
{{- with .token }}
{{- $parts := splitList "." . }}
{{- if ne (len $parts) 2 }}
{{- fail "token must be formatted as <id>.<secret>" }}
{{- end }}
{{- $id = index $parts 0 }}
{{- $secret = index $parts 1 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-token-{{ required "token missing id" $id }}
  namespace: kube-system
type: bootstrap.kubernetes.io/token
stringData:
  token-id: {{ $id }}
  token-secret: {{ required "token missing secret" $secret }}
  {{- with .extraGroups }}
  auth-extra-groups: {{ . | join "," }}
  {{- end }}
  usage-bootstrap-authentication: "true"
  usage-bootstrap-signing: "true"
---
{{- end }}
