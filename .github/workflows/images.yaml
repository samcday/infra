name: Build app images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yaml
      - .github/workflows/node-image.yml
      - 'apps/**'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-node

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - bootie
          - etcdetcetc
          - headscale-node-cleaner
          - node-joiner
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Select changed app
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${before}^{commit}" 2>/dev/null ||
            ! git diff --quiet "$before" "${{ github.sha }}" -- "apps/${{ matrix.name }}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select image tag
        id: image-tag
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          commit_epoch=$(git show -s --format=%ct "${{ github.sha }}")
          printf -v run_id '%020d' "$GITHUB_RUN_ID"
          printf 'value=%s.%s\n' \
            "$(date -u --date="@$commit_epoch" +%Y%m%d%H)" \
            "$run_id" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.scope.outputs.changed == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.scope.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        if: steps.scope.outputs.changed == 'true'
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
      - name: Build and push Docker image
        id: build-and-push
        if: steps.scope.outputs.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/${{ matrix.name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest pushed image provenance
        if: steps.scope.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
