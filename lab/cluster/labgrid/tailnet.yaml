apiVersion: v1
kind: ConfigMap
metadata:
  name: labgrid-coordinator-ts-serve-config
data:
  serve.json: |
    {
      "TCP": {
        "20408": {
          "TCPForward": "labgrid-coordinator.labgrid.svc.cluster.local:20408"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: labgrid-coordinator-ts-state
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labgrid-coordinator-tailnet
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: labgrid-coordinator-tailnet
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [labgrid-coordinator-ts-state]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: labgrid-coordinator-tailnet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: labgrid-coordinator-tailnet
subjects:
  - kind: ServiceAccount
    name: labgrid-coordinator-tailnet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labgrid-coordinator-tailnet
  labels:
    app.kubernetes.io/name: labgrid-coordinator-tailnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: labgrid-coordinator-tailnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labgrid-coordinator-tailnet
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: labgrid-coordinator-tailnet
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.86.5@sha256:9e2bfdd9e2ce724df53f976d06a4a9933aa730dc655ace42798f4c73735d1cac
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: labgrid-ts-auth
                  key: authkey
                  optional: false
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.tail22d0a0.ts.net --accept-routes=false --ssh=false
            - name: TS_HOSTNAME
              value: labgrid-coordinator
            - name: TS_KUBE_SECRET
              value: labgrid-coordinator-ts-state
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_SOCKET
              value: /var/run/tailscale/tailscaled.sock
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: --no-logs-no-support
            - name: TS_USERSPACE
              value: "true"
          ports:
            - containerPort: 9002
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: serve-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/tailscale
      volumes:
        - name: serve-config
          configMap:
            name: labgrid-coordinator-ts-serve-config
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
