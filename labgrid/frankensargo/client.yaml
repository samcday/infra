targets:
  main:
    resources:
      # labgrid 26 acquire/release iterate RemotePlace entries whenever an
      # environment is loaded. A tools-only environment silently acquires no
      # places, so keep the dedicated frankensargo place explicit here.
      RemotePlace:
        name: frankensargo

tools:
  # The client invokes this path over SSH on the exporter host.
  fastboot: /home/deck/.local/share/frankensargo-lab/fastboot
