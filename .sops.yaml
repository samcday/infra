creation_rules:
  # The fabric SOPS identity is the one intentional recovery bootstrap: only
  # Sam's offline key may decrypt the private identity that the cluster uses.
  - age: age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    path_regex: fabric/pki/sops-age-key\.txt\.enc$

  # Fabric runtime GitOps secrets are recoverable with either the fabric
  # identity or Sam's offline identity.
  - age: >-
      age1r8tha72lm6j96pre8qrlxj2nyyzm9cq38umh9dcd2kf5hhjnqsfqe6saex,
      age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    encrypted_regex: ^(data|stringData)$
    path_regex: fabric/cluster

  # Consensus bootstrap profiles and PKI are offline recovery material, not
  # runtime Flux inputs. A compromised live fabric identity must not decrypt
  # every member key, LUKS recovery key, or the etcd CA from Git.
  - age: age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    encrypted_comment_regex: "cryptme"
    path_regex: fabric/butane/.*\.yaml$

  - age: age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    path_regex: fabric/pki/etcd/.*\.enc$

  # encrypt files in hub/cluster to the hub age key
  - age: >-
      age1tu8l2llfk32g0c4mvklqazjkj977h9xwvx3ntwt2ucdert8sufgq2g8mgs,
      age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    encrypted_regex: ^(data|stringData)$
    path_regex: hub/cluster

  # encrypt Butane configs to the hub age key
  - age: >-
      age1tu8l2llfk32g0c4mvklqazjkj977h9xwvx3ntwt2ucdert8sufgq2g8mgs,
      age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    encrypted_comment_regex: "cryptme"
    path_regex: .*/butane/.*\.yaml$

  # encrypt hub k8s PKI artifacts with same key as hub/pki/etcd
  - age: age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
    path_regex: hub/pki/k8s/.*\.enc$

  # encrypt everything else against Sam's personal key
  - age: age14taxy23wzym2r9jndzsq5h8dx2f5cj5vtusfet2ggjjepp8pkfdqf6mus0
