[package]
name = "credhelper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
pem = "3"
age = { version = "0.11", default-features = false, features = ["armor"] }
aes-gcm = "0.10"
base64ct = { version = "1", features = ["std", "alloc"] }
der = { version = "0.7", features = ["std", "pem"] }
kube = { version = "0.97", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", default-features = false, features = ["v1_30"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "macros"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
zeroize = { version = "1", features = ["derive"] }
