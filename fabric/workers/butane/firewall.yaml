variant: fcos
version: 1.5.0
storage:
  directories:
    - path: /etc/nftables
      mode: 493
  files:
    - path: /etc/nftables/fabric-services-guard.nft
      overwrite: true
      mode: 420
      contents:
        inline: |
          # This table owns host input only. K3s/Flannel/kube-proxy retain the
          # forwarding plane required by Pods; do not add a late-priority
          # default-drop forward hook here.
          destroy table inet fabric_services_guard

          table inet fabric_services_guard {
              set root_nodes_v4 {
                  type ipv4_addr
                  flags constant
                  elements = { 10.66.0.10, 10.66.0.11, 10.66.0.12 }
              }

              set service_nodes_v4 {
                  type ipv4_addr
                  flags constant
                  elements = { 10.66.1.10, 10.66.1.11 }
              }

              chain input {
                  type filter hook input priority 10; policy drop;

                  iifname "lo" counter accept comment "local host traffic"
                  meta nfproto ipv6 counter drop comment "no physical IPv6 input"
                  ct state invalid counter drop comment "invalid conntrack state"
                  ct state { established, related } counter accept comment "reply traffic"

                  ip saddr @root_nodes_v4 ip protocol icmp counter accept comment "root diagnostics"
                  ip saddr @service_nodes_v4 ip protocol icmp counter accept comment "services diagnostics"
                  ip saddr 10.66.0.2 ip protocol icmp counter accept comment "operator diagnostics"

                  ip saddr @root_nodes_v4 udp dport 8472 counter accept comment "root Flannel VXLAN"
                  ip saddr @service_nodes_v4 udp dport 8472 counter accept comment "services Flannel VXLAN"
                  ip saddr @root_nodes_v4 tcp dport 10250 counter accept comment "root control plane to kubelet"
                  ip saddr @service_nodes_v4 tcp dport 10250 counter accept comment "services metrics to kubelet"
                  iifname "cni0" ip saddr 172.22.0.0/16 tcp dport 10250 counter accept comment "same-node Pod metrics to kubelet"
                  ip saddr 10.66.0.2 tcp dport 22 counter accept comment "attended operator SSH"

                  counter drop comment "deny all remaining host input"
              }
          }
systemd:
  units:
    - name: fabric-services-guard.service
      enabled: true
      contents: |
        [Unit]
        Description=Install the fabric services-worker nftables guard
        Documentation=man:nft(8)
        Wants=network-pre.target
        Before=network-pre.target install-k3s.service k3s-agent.service sshd.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ProtectSystem=full
        ProtectHome=true
        ExecStartPre=/usr/bin/test -r /etc/nftables/fabric-services-guard.nft
        ExecStart=/usr/sbin/nft --check --file /etc/nftables/fabric-services-guard.nft
        ExecStart=/usr/sbin/nft --file /etc/nftables/fabric-services-guard.nft
        ExecReload=/usr/sbin/nft --check --file /etc/nftables/fabric-services-guard.nft
        ExecReload=/usr/sbin/nft --file /etc/nftables/fabric-services-guard.nft

        [Install]
        WantedBy=multi-user.target
    - name: install-k3s.service
      dropins:
        - name: 10-fabric-services-guard.conf
          contents: |
            [Unit]
            Requires=fabric-services-guard.service
            After=fabric-services-guard.service
    - name: k3s-agent.service
      dropins:
        - name: 10-fabric-services-guard.conf
          contents: |
            [Unit]
            Requires=fabric-services-guard.service
            After=fabric-services-guard.service
    - name: sshd.service
      dropins:
        - name: 10-fabric-services-guard.conf
          contents: |
            [Unit]
            Requires=fabric-services-guard.service
            After=fabric-services-guard.service
