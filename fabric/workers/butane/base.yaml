variant: fcos
version: 1.5.0
passwd:
  users:
    - name: sam
      groups:
        - adm
        - wheel
        - sudo
        - systemd-journal
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFwawprQXEkGl38Q7T0PNseL0vpoyr4TbATMkEaZJTWQ
storage:
  directories:
    - path: /etc/fabric
      mode: 493
    - path: /etc/rancher/k3s/config.yaml.d
      mode: 448
    - path: /var/lib/fabric/assets
      mode: 493
    - path: /var/lib/rancher/k3s/agent/images
      mode: 493
  files:
    - path: /etc/hosts
      overwrite: true
      mode: 420
      contents:
        inline: |
          127.0.0.1 localhost localhost.localdomain
          ::1 localhost localhost.localdomain
          10.66.0.10 fabric-az1-cp1.fabric.internal fabric-az1-cp1
          10.66.0.11 fabric-az1-cp2.fabric.internal fabric-az1-cp2
          10.66.0.12 fabric-az1-cp3.fabric.internal fabric-az1-cp3
          10.66.0.254 api.fabric.internal
          10.66.1.10 fabric-az1-svc1.fabric.internal fabric-az1-svc1
          10.66.1.11 fabric-az1-svc2.fabric.internal fabric-az1-svc2
    - path: /etc/rancher/k3s/agent.token
      overwrite: true
      mode: 384
      contents:
        inline: '@FABRIC_AGENT_TOKEN@'
    - path: /etc/ssh/sshd_config.d/90-fabric-services.conf
      overwrite: true
      mode: 384
      contents:
        inline: |
          AuthenticationMethods publickey
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          PermitRootLogin no
          AllowUsers sam@10.66.0.2
          DisableForwarding yes
          AllowAgentForwarding no
          AllowTcpForwarding no
          GatewayPorts no
          PermitTunnel no
          X11Forwarding no
          UseDNS no
    - path: /etc/sysctl.d/90-fabric-services-routing.conf
      overwrite: true
      mode: 420
      contents:
        inline: |
          # The services and root prefixes temporarily share one Ethernet
          # broadcast domain but remain routed prefixes. Never accept an ICMP
          # redirect that turns a root destination into a direct same-wire
          # route and silently bypasses the intended OpenWrt hairpin path.
          net.ipv4.conf.*.accept_redirects = 0
          net.ipv4.conf.*.secure_redirects = 0
    - path: /etc/zincati/config.d/90-disable.toml
      overwrite: true
      mode: 420
      contents:
        inline: |
          [updates]
          enabled = false
    - path: /usr/local/sbin/verify-fabric-services-route
      overwrite: true
      mode: 493
      contents:
        inline: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${FABRIC_NODE_IP:?missing FABRIC_NODE_IP}"
          : "${FABRIC_CONNECTION_UUID:?missing FABRIC_CONNECTION_UUID}"
          [[ $FABRIC_NODE_IP =~ ^10\.66\.1\.(10|11)$ ]] || {
            echo "unexpected services IP: $FABRIC_NODE_IP" >&2
            exit 1
          }
          [[ $FABRIC_CONNECTION_UUID =~ ^b8ee0dd1-ff31-4bd6-8901-66000000011[01]$ ]] || {
            echo "unexpected services connection UUID: $FABRIC_CONNECTION_UUID" >&2
            exit 1
          }

          root_route=$(/usr/sbin/ip -4 route get 10.66.0.254)
          [[ $root_route =~ ^10\.66\.0\.254[[:space:]]via[[:space:]]10\.66\.1\.1[[:space:]]dev[[:space:]]([^[:space:]]+)[[:space:]]src[[:space:]]$FABRIC_NODE_IP([[:space:]]|$) ]] || {
            echo "root API route does not use the services router: $root_route" >&2
            exit 1
          }
          interface=${BASH_REMATCH[1]}
          router_route=$(/usr/sbin/ip -4 route get 10.66.1.1)
          [[ $router_route =~ ^10\.66\.1\.1[[:space:]]dev[[:space:]]$interface[[:space:]]src[[:space:]]$FABRIC_NODE_IP([[:space:]]|$) ]] || {
            echo "services-router route is not directly connected: $router_route" >&2
            exit 1
          }
          [[ $(/usr/bin/nmcli --get-values GENERAL.CON-UUID device show "$interface") == "$FABRIC_CONNECTION_UUID" ]] || {
            echo "$interface is not using the admitted NetworkManager profile" >&2
            exit 1
          }
          for scope in all default "$interface"; do
            [[ $(/usr/sbin/sysctl --values "net.ipv4.conf.$scope.accept_redirects") == 0 ]] || {
              echo "IPv4 redirects remain enabled for $scope" >&2
              exit 1
            }
          done

          # Do not require the API to be live here. K3s has its own retry loop,
          # so a root-first or service-first power-up must remain recoverable.
    - path: /usr/local/bin/k3s
      overwrite: true
      mode: 493
      contents:
        source: http://10.66.1.1/static/k3s
        verification:
          hash: sha256-65a55ec56c24eab44383086166ec620a491952b7e23941a49ddca6e8a4c4b4de
    - path: /usr/local/bin/install-k3s
      overwrite: true
      mode: 493
      contents:
        source: http://10.66.1.1/static/install-k3s
        verification:
          hash: sha256-46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
    - path: /var/lib/fabric/assets/k3s-selinux-1.6-1.coreos.noarch.rpm
      overwrite: true
      mode: 420
      contents:
        source: http://10.66.1.1/static/k3s-selinux-1.6-1.coreos.noarch.rpm
        verification:
          hash: sha256-ff171703f71f8c2c987342267d674a9ee3b86bb2e5d4c7cbd4a3a4be3be386d3
    - path: /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst
      overwrite: true
      mode: 420
      contents:
        source: http://10.66.1.1/static/k3s-airgap-images-amd64.tar.zst
        verification:
          hash: sha256-da6a3b2dbd55cc368d930078ae8814ed22eb9c92247f7b9b46bf073445ff55b3
systemd:
  units:
    - name: install-k3s-selinux.service
      enabled: true
      contents: |
        [Unit]
        Description=Layer the pinned K3s SELinux policy for a fabric services worker
        ConditionPathExists=!/usr/share/selinux/packages/k3s.pp
        RequiresMountsFor=/var/lib/fabric/assets
        Before=verify-k3s-selinux.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        TimeoutStartSec=0
        ExecStart=/usr/bin/rpm-ostree install --idempotent --reboot /var/lib/fabric/assets/k3s-selinux-1.6-1.coreos.noarch.rpm

        [Install]
        WantedBy=multi-user.target
    - name: fabric-services-route.service
      enabled: true
      contents: |
        [Unit]
        Description=Verify the routed fabric services-prefix path
        Wants=network-online.target
        After=network-online.target NetworkManager-wait-online.service
        Before=install-k3s.service k3s-agent.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        EnvironmentFile=/etc/fabric/services-network.env
        ExecStart=/usr/local/sbin/verify-fabric-services-route

        [Install]
        WantedBy=multi-user.target
    - name: k3s-agent.service
      dropins:
        - name: 05-fabric-services-route.conf
          contents: |
            [Unit]
            Requires=fabric-services-route.service
            After=fabric-services-route.service
    - name: verify-k3s-selinux.service
      enabled: true
      contents: |
        [Unit]
        Description=Verify the active K3s SELinux policy for a fabric services worker
        Requires=install-k3s-selinux.service
        After=install-k3s-selinux.service
        Before=install-k3s.service
        RequiresMountsFor=/var/lib/fabric

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/bin/rm -f /var/lib/fabric/k3s-selinux-ready
        ExecStart=/usr/bin/test -s /usr/share/selinux/packages/k3s.pp
        ExecStart=/usr/bin/sh -ceu '/usr/sbin/semodule -l | /usr/bin/grep -Eq "^k3s([[:space:]]|$)"'
        ExecStart=/usr/sbin/restorecon -F /usr/local/bin/k3s
        ExecStart=/usr/bin/touch /var/lib/fabric/k3s-selinux-ready

        [Install]
        WantedBy=multi-user.target
    - name: install-k3s.service
      enabled: true
      contents: |
        [Unit]
        Description=Install and start a fabric K3s services agent
        ConditionPathExists=!/etc/install-k3s.service.stamp
        ConditionPathExists=/var/lib/fabric/k3s-selinux-ready
        Wants=network-online.target
        Requires=verify-k3s-selinux.service
        After=network-online.target verify-k3s-selinux.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        TimeoutStartSec=0
        Environment=INSTALL_K3S_SKIP_DOWNLOAD=true
        Environment=INSTALL_K3S_SKIP_SELINUX_RPM=true
        Environment=INSTALL_K3S_BIN_DIR=/usr/local/bin
        Environment=INSTALL_K3S_EXEC=agent
        Environment=K3S_URL=https://10.66.0.254:6443
        Environment=K3S_TOKEN_FILE=/etc/rancher/k3s/agent.token
        ExecStart=/usr/local/bin/install-k3s
        ExecStart=/usr/bin/touch /etc/install-k3s.service.stamp

        [Install]
        WantedBy=multi-user.target
      dropins:
        - name: 05-fabric-services-route.conf
          contents: |
            [Unit]
            Requires=fabric-services-route.service
            After=fabric-services-route.service
