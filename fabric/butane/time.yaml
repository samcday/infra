variant: fcos
version: 1.5.0
storage:
  files:
    - path: /etc/chrony.conf
      overwrite: true
      mode: 420
      contents:
        inline: |
          # The dedicated router is the sole configured NTP source. It syncs
          # from the public OpenWrt pool and serves only the observer and three
          # roots on the isolated LAN.
          server 10.66.0.1 iburst prefer
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          keyfile /etc/chrony.keys
          leapsectz right/UTC
          logdir /var/log/chrony
