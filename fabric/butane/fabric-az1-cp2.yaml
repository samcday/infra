variant: fcos
version: 1.5.0
boot_device:
    # The FCOS root volume unlocks locally. There is deliberately no Tang or
    # dependency on the router for a cold boot.
    luks:
        tpm2: true
storage:
    disks:
        - device: /dev/disk/by-id/coreos-boot-disk
          wipe_table: false
          partitions:
            - number: 4
              label: root
              size_mib: 16384
              resize: true
            - number: 5
              label: etcd
              size_mib: 32768
            - number: 6
              label: var
              size_mib: 0
    luks:
        - name: etcd
          device: /dev/disk/by-partlabel/etcd
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:44pyrSPORTBBxSNXpohMncQbLVGbFc5RE5WuPLuVHi6b0ka7PojImRpi4OTaWYSjQdm0W+u6owAkiIQgKyP8fw==,iv:r8/+WN++4Nzp/KdH2ahf2sPOUSGaIv4u41ZuamK2FMM=,tag:94ZWQrqhtK8R+7RTrBEP5w==,type:str]
        - name: var
          device: /dev/disk/by-partlabel/var
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:lLg+uUoCfHPoljuMm/cnmE+a9/63v+olPzE7yzGAzwGE+pHxrwsJBEfNgUXcJ9sZiS6IKzQMj1atYDhEPBgvxg==,iv:lp3EQWPgfprXxxwSHCwxMZRnZ7upnn4XHQsRrIuh3Lk=,tag:E+aDxLjC6UZIcYtxytXZLQ==,type:str]
    filesystems:
        - path: /var
          device: /dev/mapper/var
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
        - path: /var/lib/etcd
          device: /dev/mapper/etcd
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
    files:
        - path: /etc/hostname
          overwrite: true
          mode: 420
          contents:
            inline: fabric-az1-cp2
        - path: /etc/NetworkManager/system-connections/fabric-static.nmconnection
          overwrite: true
          mode: 384
          contents:
            inline: |
                [connection]
                id=fabric-static
                uuid=b8ee0dd2-ff31-4bd6-8902-660000000011
                type=ethernet
                autoconnect=true
                autoconnect-priority=100

                [ethernet]
                mac-address=@FABRIC_NODE_MAC@

                [ipv4]
                method=manual
                dad-timeout=3000
                address1=10.66.0.11/24,10.66.0.1
                dns=10.66.0.1;
                dns-search=fabric.internal;
                may-fail=false
                route-metric=10

                [ipv6]
                method=disabled
        - path: /etc/rancher/k3s/config.yaml.d/40-node.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                node-name: fabric-az1-cp2
                node-ip: 10.66.0.11
        - path: /etc/etcd/pki/peer.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:7A1no+zGBizCM3J8t6af6P3Mx0ucdi8zuxfzoIzscys=,tag:v/6nAhZgNwh4KoklSRI5yQ==,type:str]
        - path: /etc/etcd/pki/peer-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:wGc9Fhy7nlYrJi2E6hAltRZvf+rzIUni0zhXwik1bxQ=,tag:FJZYNJ8S9tqS0xOTWqc2Lw==,type:str]
        - path: /etc/fabric/root-recovery.key
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:ub/atDaSjEDPLlKA8p36pFiYCyDj5t3F6WRx+ulLz8bGF2O+30Vc8UOgWv+QHiFFkvqZU2/hCJTKpEPF8/vuuw==,iv:Pzz3K9VqlOkpEgxwbygVjeR8EY5XxVlAjeBP+ARGA+k=,tag:VAjClg1fLybdEYwD6Ujc1w==,type:str]
systemd:
    units:
        - name: NetworkManager-wait-online.service
          enabled: true
