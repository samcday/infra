                127.0.0.1 localhost localhost.localdomain
                ::1 localhost localhost.localdomain
                10.66.0.10 fabric-az1-cp1.fabric.internal fabric-az1-cp1
                10.66.0.11 fabric-az1-cp2.fabric.internal fabric-az1-cp2
                10.66.0.12 fabric-az1-cp3.fabric.internal fabric-az1-cp3
                10.66.0.254 api.fabric.internal
        - path: /etc/rancher/k3s/agent.token
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:PGM3g6q5IBZD+M4y6+ZnCkiVoYiAgQxFinczB/L6JXxv+zZwEwhOUDc4/cE5rGi3tCrK4Ky9z18Hz4DLCYLQsxY=,iv:zMH1E3IHZ568AIoc7M60H70lukhous6yD9hKqvlXcU8=,tag:4Zlya88i543lSCGWkbQxCw==,type:str]
        - path: /usr/local/sbin/enroll-fabric-root-recovery
          overwrite: true
          mode: 493
          contents:
            inline: |
                #!/usr/bin/env bash
                set -euo pipefail

                umask 077

                device=/dev/disk/by-partlabel/root
                recovery_key=/etc/fabric/root-recovery.key
                marker=/var/lib/fabric/root-recovery-enrolled
                marker_tmp=$marker.tmp.$$

                cleanup() {
                    rm -f -- "$marker_tmp"
                }
                trap cleanup EXIT

                fail() {
                    printf 'root recovery enrollment failed: %s\n' "$*" >&2
                    exit 1
                }

                [[ -b $device ]] || fail "root LUKS device is absent: $device"
                cryptsetup isLuks "$device" || fail 'root device is not LUKS'

                if [[ -f $marker ]]; then
                    if [[ -e $recovery_key ]]; then
                        [[ $(stat -Lc '%u:%g:%a' "$recovery_key") == 0:0:600 ]] ||
                            fail 'persisted recovery-key file has unsafe ownership or mode'
                        cryptsetup open --test-passphrase \
                            --key-file "$recovery_key" "$device" ||
                            fail 'persisted recovery key is not enrolled'
                        rm -f -- "$recovery_key"
                        sync -f "${recovery_key%/*}"
                    fi
                    exit 0
                fi

                [[ $(stat -Lc '%u:%g:%a' "$recovery_key") == 0:0:600 ]] ||
                    fail 'offline recovery-key file is absent or has unsafe ownership or mode'
                if [[ $(wc -c < "$recovery_key") != 64 ]] ||
                    ! grep -Eq '^[0-9a-f]{64}$' "$recovery_key"; then
                    fail 'offline recovery-key file is malformed'
                fi

                if ! cryptsetup open --test-passphrase \
                    --key-file "$recovery_key" "$device"; then
                    mapfile -t clevis_slots < <(
                        clevis luks list -d "$device" |
                            sed -nE 's/^[[:space:]]*([0-9]+):.*/\1/p'
                    )
                    ((${#clevis_slots[@]} == 1)) ||
                        fail 'root must have exactly one Clevis keyslot before recovery enrollment'
                    clevis_slot=${clevis_slots[0]}
                    clevis_policy=$(clevis luks list -d "$device" -s "$clevis_slot") ||
                        fail 'root Clevis policy could not be inspected'
                    [[ $clevis_policy == *tpm2* ]] ||
                        fail 'root Clevis keyslot is not bound to the local TPM2'
                    clevis luks pass -d "$device" -s "$clevis_slot" |
                        cryptsetup luksAddKey --key-file - \
                            "$device" "$recovery_key" ||
                        fail 'offline recovery key could not be enrolled through TPM2'
                fi
                cryptsetup open --test-passphrase \
                    --key-file "$recovery_key" "$device" ||
                    fail 'offline recovery key did not unlock root after enrollment'

                install -m 0600 /dev/null "$marker_tmp"
                mv -f -- "$marker_tmp" "$marker"
                sync -f "${marker%/*}"
                rm -f -- "$recovery_key"
                sync -f "${recovery_key%/*}"
                echo 'verified and removed the installed copy of the root recovery key'
        - path: /etc/zincati/config.d/90-disable.toml
          overwrite: true
          mode: 420
          contents:
            inline: |
                [updates]
                enabled = false
