systemd:
    units:
        - name: install-k3s.service
          enabled: true
          contents: |
            [Unit]
            Description=Install and start the fabric K3s server
            ConditionPathExists=!/etc/install-k3s.service.stamp
            ConditionPathExists=/var/lib/fabric/k3s-selinux-ready
            Wants=network-online.target
            Requires=verify-k3s-selinux.service
            After=network-online.target verify-k3s-selinux.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            TimeoutStartSec=0
            Environment=INSTALL_K3S_SKIP_DOWNLOAD=true
            Environment=INSTALL_K3S_SKIP_SELINUX_RPM=true
            Environment=INSTALL_K3S_BIN_DIR=/usr/local/bin
            ExecStart=/usr/local/bin/install-k3s
            ExecStart=/usr/bin/touch /etc/install-k3s.service.stamp

            [Install]
            WantedBy=multi-user.target
        - name: enroll-root-recovery-key.service
          enabled: true
          contents: |
            [Unit]
            Description=Enroll the offline fabric root recovery key
            After=local-fs.target
            Before=verify-k3s-selinux.service etcd.service install-k3s.service
            RequiresMountsFor=/var/lib/fabric

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/local/sbin/enroll-fabric-root-recovery

            [Install]
            WantedBy=multi-user.target
        - name: install-k3s-selinux.service
          contents: |
            [Unit]
            Description=Layer the pinned K3s SELinux policy
            ConditionPathExists=!/usr/share/selinux/packages/k3s.pp
            RequiresMountsFor=/var/lib/fabric/assets
            Requires=enroll-root-recovery-key.service
            After=enroll-root-recovery-key.service
            Before=verify-k3s-selinux.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            TimeoutStartSec=0
            ExecStart=/usr/bin/rpm-ostree install --idempotent --reboot /var/lib/fabric/assets/k3s-selinux-1.6-1.coreos.noarch.rpm

            [Install]
            WantedBy=multi-user.target
          enabled: true
        - name: verify-k3s-selinux.service
          enabled: true
          contents: |
            [Unit]
            Description=Verify the active K3s SELinux policy
            Requires=enroll-root-recovery-key.service install-k3s-selinux.service
            After=enroll-root-recovery-key.service install-k3s-selinux.service
            Before=etcd.service install-k3s.service
            RequiresMountsFor=/var/lib/fabric

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/bin/rm -f /var/lib/fabric/k3s-selinux-ready
            ExecStart=/usr/bin/test -s /usr/share/selinux/packages/k3s.pp
            ExecStart=/usr/bin/sh -ceu '/usr/sbin/semodule -l | /usr/bin/grep -Eq "^k3s([[:space:]]|$)"'
            ExecStart=/usr/sbin/restorecon -F /usr/local/bin/k3s
            ExecStart=/usr/bin/touch /var/lib/fabric/k3s-selinux-ready

            [Install]
            WantedBy=multi-user.target
        - name: systemd-pcrnvdone.service
          contents: |
            # Host-side workaround for coreos/fedora-coreos-tracker#2193.
            # Remove after FCOS ships systemd commit 856ab04a29 and cold boot is verified.
            [Unit]
            Description=TPM PCR NvPCR Initialization Separator
            Documentation=man:systemd-pcrnvdone.service(8)
            DefaultDependencies=no
            Conflicts=shutdown.target initrd-switch-root.target
            After=tpm2.target systemd-tpm2-setup-early.service
            Before=sysinit.target cryptsetup-pre.target cryptsetup.target shutdown.target initrd-switch-root.target
            ConditionSecurity=measured-uki
            ConditionPathExists=/etc/initrd-release
            FailureAction=reboot-force

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/lib/systemd/systemd-pcrextend --graceful --pcr=kernel-initrd --event-type=nvpcr-separator nvpcr-separator
