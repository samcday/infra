variant: fcos
version: 1.5.0
storage:
    directories:
        - path: /etc/rancher/k3s/config.yaml.d
          mode: 448
        - path: /var/lib/rancher/k3s/server
          mode: 448
        - path: /var/lib/rancher/k3s/server/manifests
          mode: 448
    files:
        - path: /etc/rancher/k3s/config.yaml.d/10-datastore.yaml
          overwrite: true
          mode: 384
          contents:
            inline: |
                datastore-endpoint: https://fabric-az1-cp1.fabric.internal:2379,https://fabric-az1-cp2.fabric.internal:2379,https://fabric-az1-cp3.fabric.internal:2379
                datastore-cafile: /var/lib/rancher/k3s/server/etcd-ca.pem
                datastore-certfile: /var/lib/rancher/k3s/server/etcd-client.pem
                datastore-keyfile: /var/lib/rancher/k3s/server/etcd-client-key.pem
                kube-apiserver-arg:
                  - etcd-prefix=/fabric-root
                  - etcd-compaction-interval=0
        - path: /etc/rancher/k3s/config.yaml.d/20-network.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                cluster-cidr: 172.22.0.0/16
                service-cidr: 172.21.0.0/16
                cluster-domain: cluster.fabric.internal
                flannel-backend: vxlan
                tls-san:
                  - 10.66.0.254
                  - api.fabric.internal
        - path: /etc/rancher/k3s/config.yaml.d/30-server.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                disable:
                  - coredns
                  - local-storage
                  - metrics-server
                  - servicelb
                  - traefik
                node-label:
                  - fabric.samcday.com/root-consensus=true
                node-taint:
                  - node-role.kubernetes.io/control-plane=true:NoSchedule
                  - fabric.samcday.com/root-consensus=true:NoSchedule
                secrets-encryption: true
                selinux: true
                write-kubeconfig-mode: "0640"
                kubelet-arg:
                  - system-reserved=cpu=500m,memory=2Gi,ephemeral-storage=2Gi
                  - kube-reserved=cpu=500m,memory=1Gi,ephemeral-storage=2Gi
                  - eviction-hard=memory.available<500Mi,nodefs.available<10%,imagefs.available<10%
        - path: /etc/rancher/k3s/server.token
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:dAy78Mi2e18nfcnyGzjvu2cExN4l34hdUSFO0lSlT3Iox02n0NVqK7OyZcz7q1B4mScztW+QEavO9TXO7KPtlLA=,iv:Y+Ib+niOV3tUCI1KFiolsM9i3GqzFewjvq0w8l3SDeg=,tag:SkAmsFKzmeVsvwV1f2M8fA==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-client.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:FBupfwrX53kzHcEyY4U+XB5I6FRhP89jIIXxf+d/mDk=,tag:5VXpPBArLmRthhBLiMugFA==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-ca.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:/D++AUyOdnBEFK4jcrmWpfGnFgJgaPxQrDUDb2a9jyY=,tag:wrMwKaEQNHuNC19GdIdG5w==,type:str]
        - path: /var/lib/rancher/k3s/server/etcd-client-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:R+dlj5csL7W7QH9erqMObW4XgAtbRv3MvtgQ3ACwU8s=,tag:R+BSN5P2tGv6wm5mSZxhew==,type:str]
        - path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: kube-vip
                  namespace: kube-system
                ---
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: kube-vip-control-plane
                  namespace: kube-system
                rules:
                  - apiGroups:
                      - coordination.k8s.io
                    resources:
                      - leases
                    verbs:
                      - create
                  - apiGroups:
                      - coordination.k8s.io
                    resourceNames:
                      - plndr-cp-lock
                    resources:
                      - leases
                    verbs:
                      - get
                      - patch
                      - update
                ---
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: kube-vip-control-plane
                  namespace: kube-system
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: kube-vip-control-plane
                subjects:
                  - kind: ServiceAccount
                    name: kube-vip
                    namespace: kube-system
                ---
                apiVersion: apps/v1
                kind: DaemonSet
                metadata:
                  labels:
                    app.kubernetes.io/name: kube-vip-ds
                    app.kubernetes.io/version: v1.2.1
                  name: kube-vip-ds
                  namespace: kube-system
                spec:
                  selector:
                    matchLabels:
                      app.kubernetes.io/name: kube-vip-ds
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/name: kube-vip-ds
                        app.kubernetes.io/version: v1.2.1
                    spec:
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: fabric.samcday.com/root-consensus
                                    operator: In
                                    values:
                                      - "true"
                      containers:
                        - name: kube-vip
                          image: ghcr.io/kube-vip/kube-vip:v1.2.1
                          imagePullPolicy: Never
                          args:
                            - manager
                          env:
                            - name: vip_arp
                              value: "true"
                            - name: port
                              value: "6443"
                            - name: vip_nodename
                              valueFrom:
                                fieldRef:
                                  fieldPath: spec.nodeName
                            - name: vip_subnet
                              value: "32"
                            - name: dns_mode
                              value: first
                            - name: cp_enable
                              value: "true"
                            - name: cp_namespace
                              value: kube-system
                            - name: vip_leaderelection
                              value: "true"
                            - name: vip_leasename
                              value: plndr-cp-lock
                            - name: vip_leaseduration
                              value: "30"
                            - name: vip_renewdeadline
                              value: "20"
                            - name: vip_retryperiod
                              value: "5"
                            - name: address
                              value: 10.66.0.254
                            - name: prometheus_server
                              value: :2112
                          resources:
                            requests:
                              cpu: 20m
                              memory: 32Mi
                            limits:
                              memory: 128Mi
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              add:
                                - NET_ADMIN
                                - NET_RAW
                              drop:
                                - ALL
                      hostNetwork: true
                      priorityClassName: system-node-critical
                      serviceAccountName: kube-vip
                      terminationGracePeriodSeconds: 5
                      tolerations:
                        - operator: Exists
                          effect: NoSchedule
                        - operator: Exists
                          effect: NoExecute
        - path: /usr/local/sbin/wait-for-fabric-etcd-quorum
          overwrite: true
          mode: 493
          contents:
            inline: |
                #!/usr/bin/env bash
                set -euo pipefail

                metrics_url=http://127.0.0.1:2381/metrics
                attempt=0

                while true; do
                    metrics=$(
                        /usr/bin/curl --silent --fail --max-time 2 "$metrics_url" 2>/dev/null || true
                    )
                    if /usr/bin/awk '
                        $1 == "etcd_server_has_leader" && $2 == "1" { found = 1 }
                        END { exit found ? 0 : 1 }
                    ' <<<"$metrics"; then
                        echo 'fabric etcd reports an elected leader; allowing K3s to start'
                        exit 0
                    fi

                    ((attempt += 1))
                    if ((attempt == 1 || attempt % 15 == 0)); then
                        echo 'waiting for fabric etcd quorum before starting K3s'
                    fi
                    sleep 2
                done
systemd:
    units:
        - name: install-k3s.service
          dropins:
            - name: fabric-server.conf
              contents: |
                [Unit]
                Requires=etcd.service
                After=etcd.service

                [Service]
                Environment=INSTALL_K3S_EXEC=server
                Environment=K3S_TOKEN_FILE=/etc/rancher/k3s/server.token
                Environment=K3S_AGENT_TOKEN_FILE=/etc/rancher/k3s/agent.token
        - name: k3s.service
          dropins:
            - name: etcd.conf
              contents: |
                [Unit]
                Requires=etcd.service
                After=etcd.service
            - name: 20-etcd-quorum.conf
              contents: |
                [Service]
                ExecStartPre=/usr/local/sbin/wait-for-fabric-etcd-quorum
