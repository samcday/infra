variant: fcos
version: 1.5.0
storage:
    files:
        - path: /etc/etcd/pki/observer.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:KOYrQJ/pYvX1g4kCSpZcL9Ej4061klmcWGDFMfIEr08=,tag:qOSrU7gUxoSIqERe1cJ3RA==,type:str]
        - path: /etc/etcd/pki/observer-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:M67AdhZX2WbzYVH4akPOdVPgo8v06yLL+JjAo3K+Wbw=,tag:0PFXTKfxwYLC4y8Z70M6zw==,type:str]
        - path: /usr/local/sbin/collect-fabric-etcd-alarms
          overwrite: true
          mode: 493
          contents:
            local: files/collect-fabric-etcd-alarms
systemd:
    units:
        - name: fabric-etcd-alarm-collector.service
          contents: |
            [Unit]
            Description=Export authenticated local fabric etcd alarm state
            Documentation=https://etcd.io/docs/v3.6/op-guide/monitoring/
            Wants=etcd.service
            After=etcd.service
            RequiresMountsFor=/var/lib/fabric/node-exporter-textfile

            [Service]
            Type=oneshot
            User=root
            Group=root
            ExecStart=/usr/local/sbin/collect-fabric-etcd-alarms
            TimeoutStartSec=10s
            AmbientCapabilities=
            CapabilityBoundingSet=
            LockPersonality=yes
            NoNewPrivileges=yes
            PrivateDevices=yes
            PrivateTmp=yes
            ProtectClock=yes
            ProtectControlGroups=yes
            ProtectHome=yes
            ProtectHostname=yes
            ProtectKernelLogs=yes
            ProtectKernelModules=yes
            ProtectKernelTunables=yes
            ProtectSystem=strict
            ReadWritePaths=/var/lib/fabric/node-exporter-textfile
            RestrictAddressFamilies=AF_INET
            RestrictNamespaces=yes
            RestrictRealtime=yes
        - name: fabric-etcd-alarm-collector.timer
          enabled: true
          contents: |
            [Unit]
            Description=Poll authenticated local fabric etcd alarm state

            [Timer]
            OnBootSec=30s
            OnUnitInactiveSec=15s
            AccuracySec=1s
            RandomizedDelaySec=2s
            Unit=fabric-etcd-alarm-collector.service

            [Install]
            WantedBy=timers.target
