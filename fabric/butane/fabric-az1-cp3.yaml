variant: fcos
version: 1.5.0
boot_device:
    # The FCOS root volume unlocks locally. There is deliberately no Tang or
    # dependency on the router for a cold boot.
    luks:
        tpm2: true
storage:
    disks:
        - device: /dev/disk/by-id/coreos-boot-disk
          wipe_table: false
          partitions:
            - number: 4
              label: root
              size_mib: 16384
              resize: true
            - number: 5
              label: etcd
              size_mib: 32768
            - number: 6
              label: var
              size_mib: 0
    luks:
        - name: etcd
          device: /dev/disk/by-partlabel/etcd
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:SiF8DIfr6svKXnLZZqHWgHMguMWFEsnJwnxhH7ieaz6Aqvkbw1d7YmSVYp3R+J7w2qDTTDJlth/AIL5TPq6hhw==,iv:jG3APOZ2j9wo3QqYKy6vYKbj23T9coJe3U3Uqfx4W0o=,tag:8rdFC8UHjDnFq1h9TYpGnw==,type:str]
        - name: var
          device: /dev/disk/by-partlabel/var
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:0Ll2id/IbptWlUg+31jZmA2aNkvharUdOdqbMoaCxUEG0F1iHur4owaeelcSYXej7/NouOkw7mFgXmnfDhQLVQ==,iv:iqtMi7MmpKsyvrGlG77MRR4fwnloUJqPrRM19l5th3o=,tag:fjDqHGt8QryzzMIFwYwUDw==,type:str]
    filesystems:
        - path: /var
          device: /dev/mapper/var
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
        - path: /var/lib/etcd
          device: /dev/mapper/etcd
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
    files:
        - path: /etc/hostname
          overwrite: true
          mode: 420
          contents:
            inline: fabric-az1-cp3
        - path: /etc/NetworkManager/system-connections/fabric-static.nmconnection
          overwrite: true
          mode: 384
          contents:
            inline: |
                [connection]
                id=fabric-static
                uuid=b8ee0dd3-ff31-4bd6-8903-660000000012
                type=ethernet
                autoconnect=true
                autoconnect-priority=100

                [ethernet]
                mac-address=@FABRIC_NODE_MAC@

                [ipv4]
                method=manual
                dad-timeout=3000
                address1=10.66.0.12/24,10.66.0.1
                dns=10.66.0.1;
                dns-search=fabric.internal;
                may-fail=false
                route-metric=10

                [ipv6]
                method=disabled
        - path: /etc/rancher/k3s/config.yaml.d/40-node.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                node-name: fabric-az1-cp3
                node-ip: 10.66.0.12
        - path: /etc/etcd/pki/peer.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:f6Je54pJkoWkMx48qE+Lu71dbMoHV+azePIKNYEVhIw=,tag:H02KNluZlBi98E8QDBh0Zw==,type:str]
        - path: /etc/etcd/pki/peer-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:WQLPt5V+2ZYlc7KbvXe9YgWaBkRqcqmSU34Fw1+QqWo=,tag:1szGI6wH4dc2TUuqAqGsVA==,type:str]
        - path: /etc/fabric/root-recovery.key
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:ktYZ7lJ2+SW2UgThqoaxdBaEODpXeNrtebrhMKuB6oFHUMQ3RElVcyiN+4YJiwUEMmemm6clAyhtUH54U5T5CQ==,iv:ANIHcN7o0/IY2MKvp+K5slDFkEcIpFqm0KGfzk7/zKQ=,tag:gDgJjMFHv0JiDkVHbpv5aA==,type:str]
systemd:
    units:
        - name: NetworkManager-wait-online.service
          enabled: true
