                JjEkMCIGA1UEAwwbZmFicmljLWV0Y2RldGNldGMtY2xpZW50LWNhMB4XDTI2MDcy
                MTA3MDEzMFoXDTI5MDcyMDA3MDEzMFowJjEkMCIGA1UEAwwbZmFicmljLWV0Y2Rl
                dGNldGMtY2xpZW50LWNhMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEqI06uDtV
                CXuFpwKais7+PIlnA6aniBpZwoApQpPLXFttlb7gSJHa2tDzo8uiHd6YuEJ/L5RR
                8gUoUg3Jb4qlMKN+MHwwHQYDVR0OBBYEFKAh7sIVKCwsSfqXCL0mizUObAXtMB8G
                A1UdIwQYMBaAFKAh7sIVKCwsSfqXCL0mizUObAXtMBIGA1UdEwEB/wQIMAYBAf8C
                AQAwDgYDVR0PAQH/BAQDAgEGMBYGA1UdJQEB/wQMMAoGCCsGAQUFBwMCMAoGCCqG
                SM49BAMCA0gAMEUCIQC73hpQ+0CPkvX0Ntuwqhc7ibmwSfCXmOFjabLephdKEAIg
                BbO31H3mQLsxQ34akhzLFdW9S4lL6CJQZj+Icua0QnQ=
                -----END CERTIFICATE-----
        - path: /usr/local/sbin/render-fabric-etcd-client-trust
          overwrite: true
          mode: 493
          contents:
            inline: |
                #!/usr/bin/env bash
                set -euo pipefail
                umask 077

                readonly physical_ca=/etc/etcd/pki/ca.pem
                readonly delegated_ca=/etc/etcd/pki/etcdetcetc-client-ca.pem
                readonly output=/run/fabric-etcd-client-trust/client-ca-bundle.pem
                readonly physical_fingerprint=FB:23:A7:72:A5:21:41:42:B3:0A:80:70:55:8D:BC:B5:86:D9:A6:BE:86:20:2C:18:31:B3:24:A8:E0:75:6A:52
                readonly delegated_fingerprint=9C:AB:12:25:89:2B:1D:41:12:F5:92:3E:43:D4:0F:65:17:DD:92:5F:18:0A:D0:88:71:4D:06:7C:A6:FD:32:92

                die() {
                  echo "render-fabric-etcd-client-trust: $*" >&2
                  exit 1
                }

                for path in "$physical_ca" "$delegated_ca"; do
                  [[ -f $path && ! -L $path ]] || die "unsafe CA input: $path"
                done
                [[ -d /run/fabric-etcd-client-trust &&
                   ! -L /run/fabric-etcd-client-trust ]] ||
                  die 'systemd runtime directory is absent or unsafe'

                fingerprint() {
                  openssl x509 -in "$1" -noout -fingerprint -sha256 |
                    sed 's/^sha256 Fingerprint=//'
                }

                [[ $(fingerprint "$physical_ca") == "$physical_fingerprint" ]] ||
                  die 'physical etcd CA fingerprint differs from the pinned root'
                [[ $(fingerprint "$delegated_ca") == "$delegated_fingerprint" ]] ||
                  die 'delegated etcdetcetc client CA fingerprint differs from Git'
                [[ $(openssl x509 -in "$physical_ca" -noout -subject -nameopt RFC2253) == 'subject=CN=fabric-etcd-ca' ]] ||
                  die 'physical etcd CA has an unexpected subject'
                [[ $(openssl x509 -in "$delegated_ca" -noout -subject -nameopt RFC2253) == 'subject=CN=fabric-etcdetcetc-client-ca' ]] ||
                  die 'delegated client CA has an unexpected subject'
                delegated_text=$(openssl x509 -in "$delegated_ca" -noout -text)
                grep -Fq 'CA:TRUE, pathlen:0' <<<"$delegated_text" ||
                  die 'delegated client CA is not pathlen:0'
                grep -Fq 'TLS Web Client Authentication' <<<"$delegated_text" ||
                  die 'delegated CA is not constrained to client authentication'
                openssl x509 -in "$delegated_ca" -noout -checkend 604800 >/dev/null ||
                  die 'delegated CA expires in less than seven days'
                openssl verify -CAfile "$physical_ca" "$physical_ca" >/dev/null ||
                  die 'physical CA is not self-consistent'
                openssl verify -CAfile "$delegated_ca" "$delegated_ca" >/dev/null ||
                  die 'delegated client CA is not self-consistent'

                candidate=$(mktemp --tmpdir=/run/fabric-etcd-client-trust .client-ca-bundle.XXXXXX)
                trap 'rm -f -- "$candidate"' EXIT
                cat "$physical_ca" "$delegated_ca" >"$candidate"
                [[ $(grep -c '^-----BEGIN CERTIFICATE-----$' "$candidate") -eq 2 &&
                   $(grep -c '^-----END CERTIFICATE-----$' "$candidate") -eq 2 ]] ||
                  die 'rendered client trust bundle does not contain exactly two certificates'
                chmod 0444 "$candidate"
                chown root:root "$candidate"
                mv -f -- "$candidate" "$output"
                trap - EXIT
systemd:
    units:
        - name: fabric-etcd-client-trust.service
          enabled: true
          contents: |
            [Unit]
            Description=Render the pinned Fabric etcd client trust bundle
            Documentation=file:///usr/local/sbin/render-fabric-etcd-client-trust
            Before=etcd.service
            After=local-fs.target

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            RuntimeDirectory=fabric-etcd-client-trust
            RuntimeDirectoryMode=0755
            ExecStart=/usr/local/sbin/render-fabric-etcd-client-trust
            ExecReload=/usr/local/sbin/render-fabric-etcd-client-trust

            [Install]
            WantedBy=multi-user.target
        - name: etcd.slice
          contents: |
            [Slice]
            IOWeight=10000
        - name: etcd.service
          enabled: true
          contents: |
            [Unit]
            Description=Fabric root external etcd member
            Wants=network-online.target
            ConditionPathExists=/var/lib/fabric/k3s-selinux-ready
            Requires=fabric-etcd-client-trust.service install-etcd-binaries.service verify-k3s-selinux.service
            After=network-online.target fabric-etcd-client-trust.service install-etcd-binaries.service verify-k3s-selinux.service
            RequiresMountsFor=/var/lib/etcd

            [Service]
            Environment=CLUSTER_STATE=new
            Slice=etcd.slice
            IOSchedulingClass=best-effort
            IOSchedulingPriority=0
            OOMScoreAdjust=-900
            LimitNOFILE=1048576
            Restart=always
            RestartSec=5s
            TimeoutStartSec=0
            TimeoutStopSec=30s
            ExecStartPre=/usr/bin/test -s /etc/etcd/pki/ca.pem
            ExecStartPre=/usr/bin/test -s /run/fabric-etcd-client-trust/client-ca-bundle.pem
            ExecStartPre=/usr/bin/test -s /etc/etcd/pki/peer.pem
            ExecStartPre=/usr/bin/test -s /etc/etcd/pki/peer-key.pem
            ExecStart=/usr/local/bin/etcd \
              --name=%H \
              --initial-cluster-state=${CLUSTER_STATE} \
              --initial-cluster=fabric-az1-cp1=https://fabric-az1-cp1.fabric.internal:2380,fabric-az1-cp2=https://fabric-az1-cp2.fabric.internal:2380,fabric-az1-cp3=https://fabric-az1-cp3.fabric.internal:2380 \
              --initial-cluster-token=fabric-root-etcd \
              --data-dir=/var/lib/etcd \
              --initial-advertise-peer-urls=https://%H.fabric.internal:2380 \
              --listen-peer-urls=https://0.0.0.0:2380 \
              --advertise-client-urls=https://%H.fabric.internal:2379 \
              --listen-client-urls=https://0.0.0.0:2379 \
              --listen-metrics-urls=http://0.0.0.0:2381 \
              --client-cert-auth=true \
              --peer-client-cert-auth=true \
              --cert-file=/etc/etcd/pki/peer.pem \
              --key-file=/etc/etcd/pki/peer-key.pem \
              --trusted-ca-file=/run/fabric-etcd-client-trust/client-ca-bundle.pem \
              --peer-cert-file=/etc/etcd/pki/peer.pem \
              --peer-key-file=/etc/etcd/pki/peer-key.pem \
              --peer-trusted-ca-file=/etc/etcd/pki/ca.pem \
              --auto-compaction-mode=periodic \
              --auto-compaction-retention=1h \
              --quota-backend-bytes=2147483648

            [Install]
            WantedBy=multi-user.target
        - name: install-etcd-binaries.service
          enabled: true
          contents: |
            [Unit]
            Description=Install pinned fabric etcd binaries
            RequiresMountsFor=/var/lib/fabric/assets
            Before=etcd.service
            ConditionPathExists=!/var/lib/fabric/etcd-binaries-v3.6.13.stamp

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/bin/rm -rf /var/lib/fabric/etcd-v3.6.13-extract
            ExecStart=/usr/bin/mkdir -p /var/lib/fabric/etcd-v3.6.13-extract
            ExecStart=/usr/bin/tar --extract --gzip --no-same-owner --no-same-permissions --file=/var/lib/fabric/assets/etcd-v3.6.13-linux-amd64.tar.gz --directory=/var/lib/fabric/etcd-v3.6.13-extract etcd-v3.6.13-linux-amd64/etcd etcd-v3.6.13-linux-amd64/etcdctl etcd-v3.6.13-linux-amd64/etcdutl
            ExecStart=/usr/bin/install --owner=root --group=root --mode=0755 /var/lib/fabric/etcd-v3.6.13-extract/etcd-v3.6.13-linux-amd64/etcd /usr/local/bin/etcd
            ExecStart=/usr/bin/install --owner=root --group=root --mode=0755 /var/lib/fabric/etcd-v3.6.13-extract/etcd-v3.6.13-linux-amd64/etcdctl /usr/local/bin/etcdctl
            ExecStart=/usr/bin/install --owner=root --group=root --mode=0755 /var/lib/fabric/etcd-v3.6.13-extract/etcd-v3.6.13-linux-amd64/etcdutl /usr/local/bin/etcdutl
            ExecStart=/usr/bin/rm -rf /var/lib/fabric/etcd-v3.6.13-extract
            ExecStart=/usr/bin/test -x /usr/local/bin/etcd
            ExecStart=/usr/bin/test -x /usr/local/bin/etcdctl
            ExecStart=/usr/bin/test -x /usr/local/bin/etcdutl
            ExecStart=/usr/local/bin/etcd --version
            ExecStart=/usr/local/bin/etcdctl version
            ExecStart=/usr/bin/touch /var/lib/fabric/etcd-binaries-v3.6.13.stamp

            [Install]
            WantedBy=multi-user.target
