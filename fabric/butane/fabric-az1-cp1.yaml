variant: fcos
version: 1.5.0
boot_device:
    # The FCOS root volume unlocks locally. There is deliberately no Tang or
    # dependency on the router for a cold boot.
    luks:
        tpm2: true
storage:
    disks:
        - device: /dev/disk/by-id/coreos-boot-disk
          wipe_table: false
          partitions:
            - number: 4
              label: root
              size_mib: 16384
              resize: true
            - number: 5
              label: etcd
              size_mib: 32768
            - number: 6
              label: var
              size_mib: 0
    luks:
        - name: etcd
          device: /dev/disk/by-partlabel/etcd
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:p2FRAuxq86MIwu3O5NWkamh3zWO4qzHSV2tnnew0hGiq+EKddNSdiYLbynQF3eDUl+0NqMK2jdb5hrAtbsynCg==,iv:OAoDU87Un7+ZYBfQ2a83/5nfa1YVKm4YGavGYXeqlsc=,tag:Dr/AUJ+q5eAnPX3/km4GYg==,type:str]
        - name: var
          device: /dev/disk/by-partlabel/var
          discard: true
          wipe_volume: true
          clevis:
            tpm2: true
          key_file:
            # cryptme
            inline: ENC[AES256_GCM,data:05mpsHhHhW1OF83k7IGt8cN2ra6HJKNaNOBHe0mAmHhKLUr2bXaShXGykAxikkaWKp2dqRaJ24k/nBxwrOqB3Q==,iv:FjCG2zcuZOiMx7vRF0UXR+vOvXoMnVuasPNZL6h0pD0=,tag:Re94NRrhfMCRM2RsFckNNA==,type:str]
    filesystems:
        - path: /var
          device: /dev/mapper/var
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
        - path: /var/lib/etcd
          device: /dev/mapper/etcd
          format: ext4
          mount_options:
            - noatime
          with_mount_unit: true
    files:
        - path: /etc/hostname
          overwrite: true
          mode: 420
          contents:
            inline: fabric-az1-cp1
        - path: /etc/NetworkManager/system-connections/fabric-static.nmconnection
          overwrite: true
          mode: 384
          contents:
            inline: |
                [connection]
                id=fabric-static
                uuid=b8ee0dd1-ff31-4bd6-8901-660000000010
                type=ethernet
                autoconnect=true
                autoconnect-priority=100

                [ethernet]
                mac-address=@FABRIC_NODE_MAC@

                [ipv4]
                method=manual
                dad-timeout=3000
                address1=10.66.0.10/24,10.66.0.1
                dns=10.66.0.1;
                dns-search=fabric.internal;
                may-fail=false
                route-metric=10

                [ipv6]
                method=disabled
        - path: /etc/rancher/k3s/config.yaml.d/40-node.yaml
          overwrite: true
          mode: 420
          contents:
            inline: |
                node-name: fabric-az1-cp1
                node-ip: 10.66.0.10
        - path: /etc/etcd/pki/peer.pem
          overwrite: true
          mode: 420
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:pSBjVld6Vv/0x2vHrZIBdugflXsCuyW+sOzAQR7sr+I=,tag:MvBsVYyTeOIJg6A3d4+ojg==,type:str]
        - path: /etc/etcd/pki/peer-key.pem
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:,iv:QjnHrEGRP4v/S+0wkkPokdqe5JbBuH7fojgYn+W/9zw=,tag:hlFahs9+tqfoOL+0dpqLNQ==,type:str]
        - path: /etc/fabric/root-recovery.key
          overwrite: true
          mode: 384
          contents:
            # cryptme
            inline: ENC[AES256_GCM,data:+0bq8sym5aeGJIha0i511GnxhQ8QDBDor4qPD6l7fu5Ek/9km4HqTRs0s9gw89dK2BA8cZnDbP+2zEIg+in9HQ==,iv:P4NBCOADPTu3mjuiEjKd+/op9BQ/Z4kUxRHyfz8v3JI=,tag:Z/XhbvlVDQinMsDvepPdqA==,type:str]
systemd:
    units:
        - name: NetworkManager-wait-online.service
          enabled: true
