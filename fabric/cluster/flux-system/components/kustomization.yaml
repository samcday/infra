apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
images:
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.9.3
    digest: sha256:ff8f3c92f1bcb433e858c948040c3a3393fe73f5dd72048a4502bfaf0a4c26cd
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.9.3
    digest: sha256:0203eb80743814f67bebb5f0b22c7db620bc461cc0b23732e0367a38fce04e4c
  - name: ghcr.io/fluxcd/helm-controller
    newTag: v1.6.2
    digest: sha256:e17ab0e5885d80cebb9890663f85d59cd3866adebfc09a4d8bd2d512ef980bc4
  - name: ghcr.io/fluxcd/notification-controller
    newTag: v1.9.2
    digest: sha256:9ce503e7bcb8493fafe2aaef0c2ac4396df4f6890256acf9cd444a2dcd2a69ed
patches:
  # The upstream export is deliberately kept byte-for-byte canonical. Pin its
  # generated service addresses to fabric's non-default K3s cluster domain in
  # this overlay; the test operations make a future Flux regeneration fail
  # closed if the controller argument layout changes.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.fabric.internal./
      - op: test
        path: /spec/template/spec/containers/0/args/6
        value: --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.local.
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.fabric.internal.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.fabric.internal./
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.fabric.internal./
  - target:
      group: apps
      version: v1
      kind: Deployment
      namespace: flux-system
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/fabric.samcday.com~1platform
        value: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: fabric.samcday.com/platform
            operator: Equal
            value: "true"
            effect: NoSchedule
