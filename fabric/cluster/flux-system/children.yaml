apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-foundation
  namespace: flux-system
spec:
  interval: 10m
  path: ./fabric/cluster/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-platform
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-foundation
  interval: 10m
  path: ./fabric/cluster/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
