apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-foundation
  namespace: flux-system
spec:
  interval: 10m
  path: ./fabric/cluster/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-bootie
  namespace: flux-system
spec:
  # Bootie is the recovery plane for a service node. It must remain
  # reconcilable while foundation is deliberately degraded to one CoreDNS
  # replica during a serial service-node replacement.
  interval: 10m
  path: ./fabric/cluster/bootie
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-platform
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-foundation
  interval: 10m
  path: ./fabric/cluster/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-prometheus-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-platform
  interval: 10m
  path: ./fabric/cluster/prometheus-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-tailnet
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-platform
  interval: 10m
  path: ./fabric/cluster/tailnet
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-monitoring
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-platform
    - name: fabric-prometheus-operator
  interval: 10m
  path: ./fabric/cluster/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-etcdetcetc-policy
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-platform
  interval: 10m
  path: ./fabric/cluster/etcdetcetc-policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-etcdetcetc-controller
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-etcdetcetc-config
  interval: 10m
  path: ./fabric/cluster/etcdetcetc-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-etcdetcetc-config
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    # Apply only the CA/ClusterIssuer/admin Certificate while the controller and its
    # CRDs remain absent. This creates the delegated identity needed for the
    # attended etcd-user ceremony without creating runtime custom resources.
    - name: fabric-etcdetcetc-policy
  interval: 10m
  path: ./fabric/cluster/etcdetcetc
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-etcdetcetc-runtime
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-etcdetcetc-config
    - name: fabric-etcdetcetc-controller
  interval: 10m
  path: ./fabric/cluster/etcdetcetc/runtime
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-foundation
  namespace: flux-system
spec:
  # Activation is intentionally attended: (1) reconcile the Hub Terraform
  # auth key, (2) run scripts/handoff-lab-apiserver-auth, (3) add the generated
  # SOPS Secret to lab/foundation/kustomization.yaml, then (4) unsuspend only
  # this foundation and wait for the tenant, Tailnet proxy, and endpoint
  # publisher to become Ready.
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-platform
    - name: fabric-tailnet
    - name: fabric-etcdetcetc-runtime
  healthCheckExprs:
    - apiVersion: etcdetcetc.samcday.com/v1alpha1
      kind: EtcdTenant
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c,
          c.type == 'Ready' && c.status == 'True' &&
          has(c.observedGeneration) &&
          c.observedGeneration == metadata.generation)
      failed: "false"
  healthChecks:
    - apiVersion: etcdetcetc.samcday.com/v1alpha1
      kind: EtcdTenant
      name: apiserver
      namespace: lab
    - apiVersion: apps/v1
      kind: Deployment
      name: lab-apiserver-tailnet
      namespace: lab
    - apiVersion: apps/v1
      kind: Deployment
      name: lab-apiserver-endpoint-publisher
      namespace: lab
  interval: 10m
  path: ./fabric/cluster/lab/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-bootstrap
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-lab-foundation
  interval: 10m
  path: ./fabric/cluster/lab/bootstrap
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-common-butane
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-platform
  interval: 10m
  path: ./common/butane
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  targetNamespace: lab
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-butane
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-common-butane
  interval: 10m
  path: ./lab/butane
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  targetNamespace: lab
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-control-plane
  namespace: flux-system
spec:
  # The short-lived kubeadm token is supplied only after the persistent
  # foundation is healthy.
  suspend: false
  dependsOn:
    - name: fabric-lab-foundation
    - name: fabric-lab-bootstrap
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: control-plane
      namespace: lab
  interval: 10m
  path: ./fabric/cluster/lab/control-plane
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-inventory
  namespace: flux-system
spec:
  dependsOn:
    - name: fabric-lab-control-plane
  interval: 10m
  kubeConfig:
    secretRef:
      name: lab-flux-kubeconfig
  path: ./lab/cluster/inventory
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-bootie
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-lab-control-plane
    - name: fabric-lab-bootstrap
    - name: fabric-common-butane
    - name: fabric-lab-butane
    - name: fabric-lab-inventory
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: lab-bootie
      namespace: lab
    - apiVersion: apps/v1
      kind: Deployment
      name: lab-bootie-tailnet
      namespace: lab
  interval: 10m
  path: ./fabric/cluster/lab/bootie
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-child
  namespace: flux-system
spec:
  suspend: true
  decryption:
    provider: sops
    secretRef:
      name: age-key
  dependsOn:
    - name: fabric-lab-control-plane
  interval: 10m
  path: ./fabric/cluster/lab/child
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabric-lab-coordinator
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: fabric-lab-child
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: labgrid-coordinator
      namespace: labgrid
    - apiVersion: apps/v1
      kind: Deployment
      name: labgrid-coordinator-tailnet
      namespace: labgrid
  interval: 10m
  kubeConfig:
    secretRef:
      name: lab-flux-kubeconfig
  path: ./lab/cluster/labgrid
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 15m
  wait: true
