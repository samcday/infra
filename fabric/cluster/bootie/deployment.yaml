apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootie
  namespace: bootie
  labels:
    app.kubernetes.io/name: bootie
    app.kubernetes.io/part-of: fabric
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bootie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootie
        app.kubernetes.io/part-of: fabric
    spec:
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      hostNetwork: true
      nodeSelector:
        fabric.samcday.com/platform: "true"
      priorityClassName: system-cluster-critical
      serviceAccountName: bootie
      terminationGracePeriodSeconds: 15
      tolerations:
        - effect: NoSchedule
          key: fabric.samcday.com/platform
          operator: Equal
          value: "true"
      containers:
        - name: bootie
          image: ghcr.io/samcday/infra-bootie@sha256:100eef2a463cd132302e47fe02608e80baf899b40128526ccf2fb955a9ea4bab
          imagePullPolicy: IfNotPresent
          command:
            - /bin/run-cluster
          env:
            - name: BOOTIE_HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: BOOTIE_IMAGE_DIGEST
              value: sha256:100eef2a463cd132302e47fe02608e80baf899b40128526ccf2fb955a9ea4bab
            - name: BOOTIE_IMAGE_REVISION
              value: fb12e742a7db3f924d54358d5fbe5d772fc1f053
            - name: BOOTIE_NODE_INVENTORY_FILE
              value: /config/nodes.tsv
            - name: BOOTIE_SESSION_NAMESPACE
              value: bootie
            - name: BOOTIE_SESSION_SECRET
              value: bootie-session
            - name: FCOS_VERSION
              value: 44.20260621.3.1
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: dhcp
              containerPort: 67
              protocol: UDP
            - name: tftp
              containerPort: 69
              protocol: UDP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /boot.grub?mac=00-00-00-00-00-00
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /boot.grub?mac=00-00-00-00-00-00
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - NET_ADMIN
                - NET_BIND_SERVICE
                - NET_RAW
                - SETGID
                - SETUID
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: inventory
              mountPath: /config/nodes.tsv
              readOnly: true
              subPath: nodes.tsv
            - name: run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/lib/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: inventory
          configMap:
            name: bootie-node-inventory
            items:
              - key: nodes.tsv
                path: nodes.tsv
            defaultMode: 292
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-log
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
