apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: alerting
    app.kubernetes.io/name: fabric-monitoring
    app.kubernetes.io/part-of: fabric-monitoring
    release: kube-prometheus-stack
  name: fabric-pagerduty-delivery-test
  namespace: monitoring
spec:
  groups:
    - name: fabric-pagerduty-delivery-test
      rules:
        - alert: FabricPagerDutyDeliveryTest
          annotations:
            description: >-
              Controlled Fabric monitoring activation test. This incident is
              expected and will be resolved through Git after delivery is
              proven.
            summary: Fabric PagerDuty delivery test
          expr: vector(1)
          labels:
            cluster: fabric
            severity: critical
            test: "true"
