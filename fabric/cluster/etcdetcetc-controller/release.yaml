apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcdetcetc
  namespace: etcdetcetc
spec:
  chart:
    spec:
      chart: charts/etcdetcetc
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  driftDetection:
    ignore:
      # The chart creates the coordination object, but only the controller owns
      # its spec. Never let Helm drift correction clear a live holder record.
      - paths:
          - /spec
        target:
          group: coordination.k8s.io
          version: v1
          kind: Lease
          name: etcdetcetc-leader
    mode: enabled
  install:
    crds: Create
    remediation:
      retries: 3
  interval: 1h
  # Activation remains attended; keep both this release and its parent
  # Kustomization suspended until the live configuration gates pass.
  suspend: true
  timeout: 5m
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    allowedNamespaces:
      - etcdetcetc
      - etcdetcetc-smoke
    image:
      repository: ghcr.io/samcday/infra-etcdetcetc
      tag: "2026072201.00000000029883331493"
      digest: sha256:640c7237c0931d01f8a867e713d60752ab450cda38726d2a1b864ea4dbfc6f35
      pullPolicy: IfNotPresent
    managedNamespaces:
      - etcdetcetc-smoke
    legacyClusterWideCoreWatches: false
    replicaCount: 2
    nodeSelector:
      fabric.samcday.com/platform: "true"
      kubernetes.io/os: linux
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchFields:
                - key: metadata.name
                  operator: In
                  values:
                    - fabric-az1-svc1
                    - fabric-az1-svc2
    priorityClassName: system-cluster-critical
    tolerations:
      - effect: NoSchedule
        key: fabric.samcday.com/platform
        operator: Equal
        value: "true"
