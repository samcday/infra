apiVersion: batch/v1
kind: CronJob
metadata:
  name: fabric-etcd-smoke
  namespace: etcdetcetc-smoke
  labels:
    app.kubernetes.io/name: fabric-etcd-smoke
    app.kubernetes.io/instance: fabric-smoke
    app.kubernetes.io/component: smoke-test
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-etcd-smoke
        app.kubernetes.io/instance: fabric-smoke
        app.kubernetes.io/component: smoke-test
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fabric-etcd-smoke
            app.kubernetes.io/instance: fabric-smoke
            app.kubernetes.io/component: smoke-test
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          nodeSelector:
            fabric.samcday.com/platform: "true"
            kubernetes.io/os: linux
          tolerations:
            - effect: NoSchedule
              key: fabric.samcday.com/platform
              operator: Equal
              value: "true"
          hostAliases:
            - ip: 10.66.0.10
              hostnames:
                - fabric-az1-cp1.fabric.internal
            - ip: 10.66.0.11
              hostnames:
                - fabric-az1-cp2.fabric.internal
            - ip: 10.66.0.12
              hostnames:
                - fabric-az1-cp3.fabric.internal
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: smoke-test
              image: ghcr.io/samcday/infra-etcd-smoke:2026072803.00000000030325176009@sha256:d473d5358155357c4041f5ea89b5add09482b769c41a09f188e5b81492a9cc0a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  set -eu
                  umask 077

                  expected_prefix=/etcdetcetc-smoke:fabric-smoke/
                  expected_endpoints=https://fabric-az1-cp1.fabric.internal:2379,https://fabric-az1-cp2.fabric.internal:2379,https://fabric-az1-cp3.fabric.internal:2379
                  prefix=$(cat /contract/prefix)
                  endpoints=$(cat /contract/endpoints)
                  [ "$prefix" = "$expected_prefix" ]
                  [ "$endpoints" = "$expected_endpoints" ]
                  case "$POD_UID" in
                    ????????-????-????-????-????????????) ;;
                    *) exit 10 ;;
                  esac
                  case "$POD_UID" in
                    *[!0-9a-f-]*) exit 10 ;;
                  esac

                  ctl=/usr/local/bin/etcdctl
                  lease_id=

                  tenant_ctl() {
                    "$ctl" --endpoints="$endpoints" \
                      --cacert=/credential/ca.crt \
                      --cert=/credential/tls.crt \
                      --key=/credential/tls.key \
                      --dial-timeout=3s --command-timeout=8s "$@"
                  }

                  cleanup() {
                    if [ -n "$lease_id" ]; then
                      tenant_ctl lease revoke "$lease_id" >/dev/null 2>&1 || true
                    fi
                  }
                  trap cleanup EXIT HUP INT TERM

                  version_output=$($ctl version)
                  [ "$(printf '%s\n' "$version_output" | sed -n '1p')" = \
                    'etcdctl version: 3.6.13' ]
                  [ "$(printf '%s\n' "$version_output" | sed -n '2p')" = \
                    'API version: 3.6' ]

                  tenant_ctl get "$prefix" --limit=1 >/dev/null

                  lease_output=$(tenant_ctl lease grant 90)
                  lease_id=$(printf '%s\n' "$lease_output" | awk '{print $2}')
                  case "$lease_id" in
                    ''|*[!0-9a-f]*) exit 11 ;;
                  esac

                  key=${prefix}.periodic-smoke/$POD_UID
                  value=fabric-etcd-smoke:$POD_UID
                  tenant_ctl put "$key" "$value" --lease="$lease_id" >/dev/null
                  [ "$(tenant_ctl get "$key" --print-value-only)" = "$value" ]
                  [ "$(tenant_ctl del "$key")" = 1 ]
                  [ -z "$(tenant_ctl get "$key" --print-value-only)" ]

                  tenant_ctl lease revoke "$lease_id" >/dev/null
                  lease_id=
                  trap - EXIT HUP INT TERM
                  printf 'FABRIC_ETCD_SMOKE=pass pod=%s\n' "$POD_NAME"
              env:
                - name: HOME
                  value: /work
                - name: TMPDIR
                  value: /work
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 1Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
                  ephemeral-storage: 8Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: credential
                  mountPath: /credential
                  readOnly: true
                - name: contract
                  mountPath: /contract
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: credential
              secret:
                secretName: fabric-smoke-etcd
                optional: false
                defaultMode: 0440
                items:
                  - key: ca.crt
                    path: ca.crt
                    mode: 0440
                  - key: tls.crt
                    path: tls.crt
                    mode: 0440
                  - key: tls.key
                    path: tls.key
                    mode: 0440
            - name: contract
              configMap:
                name: fabric-smoke-etcd
                optional: false
                defaultMode: 0444
                items:
                  - key: endpoints
                    path: endpoints
                  - key: prefix
                    path: prefix
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fabric-etcd-smoke
  namespace: etcdetcetc-smoke
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fabric-etcd-smoke
      app.kubernetes.io/instance: fabric-smoke
      app.kubernetes.io/component: smoke-test
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.66.0.10/32
        - ipBlock:
            cidr: 10.66.0.11/32
        - ipBlock:
            cidr: 10.66.0.12/32
      ports:
        - port: 2379
          protocol: TCP
