apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: labgrid-auth-handoff
  namespace: lab
spec:
  chart:
    spec:
      chart: charts/resources
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: labgrid
  targetNamespace: labgrid
  values:
    labgridNamespace:
      kind: Namespace
      metadata:
        name: labgrid
    labgridTailnetAuth:
      kind: Secret
      metadata:
        name: labgrid-ts-auth
      stringData:
        authkey: ""
  valuesFrom:
    - kind: Secret
      name: labgrid-ts-auth-source
      valuesKey: authkey
      targetPath: labgridTailnetAuth.stringData.authkey
