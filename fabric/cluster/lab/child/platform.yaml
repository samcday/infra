apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab-cilium
  namespace: lab
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.19.4
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    bpf:
      masquerade: true
    hubble:
      relay:
        enabled: false
      ui:
        enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 172.26.0.0/16
    k8sServiceHost: lab-apiserver.tailnet.hub.samcday.com
    k8sServicePort: 6443
    kubeProxyReplacement: true
    operator:
      replicas: 1
      rollOutPods: true
    rollOutCiliumPods: true
    routingMode: native
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab-coredns
  namespace: lab
spec:
  chart:
    spec:
      chart: coredns
      sourceRef:
        kind: HelmRepository
        name: coredns
        namespace: flux-system
      version: 1.39.2
  dependsOn:
    - name: lab-cilium
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    k8sAppLabelOverride: kube-dns
    replicaCount: 1
    service:
      clusterIP: 172.25.0.10
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab-openebs
  namespace: lab
spec:
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: 4.5.1
  dependsOn:
    - name: lab-cilium
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  kubeConfig:
    secretRef:
      name: admin-kubeconfig
  storageNamespace: openebs
  targetNamespace: openebs
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    alloy:
      enabled: false
    engines:
      local:
        hostpath:
          enabled: true
        lvm:
          enabled: false
        rawfile:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      localpv:
        basePath: /var/openebs/local
      hostpathClass:
        enabled: true
        isDefaultClass: true
        name: lab-local
    loki:
      enabled: false
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
    zfs-localpv:
      enabled: false
