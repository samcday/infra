apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: control-plane
  namespace: lab
spec:
  chart:
    spec:
      chart: charts/k8s-control-plane
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 1h
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    # Jobs in this chart have ttlSecondsAfterFinished and get GC'd between
    # upgrades; force recreates missing resources instead of patching them.
    force: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: control-plane-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: apiserver-etcd
      valuesKey: values.yaml
    - kind: ConfigMap
      name: lab-control-plane-endpoint
      valuesKey: values.yaml
