apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-bootie-child-api-egress
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-bootie
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.21.0.25/32
      ports:
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-bootie-proxy
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-bootie
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-bootie-tailnet
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-bootie-tailnet-egress
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-bootie-tailnet
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.21.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-bootie
      ports:
        - port: 80
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - port: 443
          protocol: TCP
