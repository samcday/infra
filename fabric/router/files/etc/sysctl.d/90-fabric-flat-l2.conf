# The temporary root/services router-on-a-stick has two IPv4 prefixes on the
# same br-lan device. Never teach either side a direct route around fw4 with an
# ICMP redirect. Apply both all and default so hotplugged interfaces inherit the
# same policy. This uniquely named image file deliberately lives outside
# /etc/sysctl.conf: an attended ordinary sysupgrade preserves the old conffile,
# but installs this reviewed profile from the new immutable image.
net.ipv4.ip_forward=1
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.br-lan.send_redirects=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.br-lan.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0

# Fabric has no IPv6 control or service plane. fw4 remains reject-by-default as
# defense in depth, while the network stack itself creates no IPv6 path.
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
# Kernel value 0 still accepts IPv6 Routing Header type 2. Use -1 to reject
# source routing completely even though the IPv6 stack is disabled below.
net.ipv6.conf.all.accept_source_route=-1
net.ipv6.conf.default.accept_source_route=-1
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.br-lan.disable_ipv6=1
