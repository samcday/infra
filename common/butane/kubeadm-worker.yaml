variant: fcos
version: 1.5.0
storage:
  files:
    - path: /etc/containerd/config.toml
      overwrite: true
      contents:
        inline: |
          version = 2
          [plugins]
            [plugins."io.containerd.grpc.v1.cri"]
              [plugins."io.containerd.grpc.v1.cri".cni]
                bin_dir = "/var/opt/cni/bin"
                conf_dir = "/etc/cni/net.d"
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                runtime_type = "io.containerd.runc.v2"
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                  SystemdCgroup = true
            [plugins."io.containerd.internal.v1.opt"]
              path = "/var/lib/containerd/opt"
systemd:
  units:
    - name: containerd.service
      enabled: true
    - name: kubelet.service
      enabled: true
    - name: kubeadm-join.service
      enabled: true
      contents: |
        [Unit]
        After=tailscale-up.service
        Requires=tailscale-up.service
        ConditionPathExists=!/etc/kubernetes/kubelet.conf
        ConditionPathExists=/etc/kubeadm.join

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=kubeadm join --config /etc/kubeadm.join
        Restart=on-failure
        RestartSec=30s

        [Install]
        WantedBy=multi-user.target
    # Same deal as tailscale-up.path. sysexts be wild, yo
    - name: kubeadm-join.path
      enabled: true
      contents: |
        [Unit]
        After=systemd-sysext.service
        Wants=systemd-sysext.service

        [Path]
        PathExists=/usr/bin/kubeadm

        [Install]
        WantedBy=multi-user.target
