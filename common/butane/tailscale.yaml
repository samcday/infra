variant: fcos
version: 1.5.0
storage:
  files:
    # This file doesn't seem to end up in the right place when installing tailscale as a sysext.
    - path: /etc/default/tailscaled
      contents:
        inline: |
            PORT="41641"
            FLAGS=""
systemd:
  units:
    - name: tailscaled.service
      enabled: true
    - name: tailscale-up.service
      enabled: true
      contents: |-
        [Unit]
        After=tailscaled.service
        Requires=tailscaled.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=tailscale up --login-server=https://headscale.tail22d0a0.ts.net --accept-routes --auth-key=file:/etc/ts-authkey
        Restart=on-failure
        RestartSec=10s

        [Install]
        WantedBy=multi-user.target
    # Without this, tailscale-up.service will never activate, because it's loaded before systemd-sysext has merged
    - name: tailscale-up.path
      enabled: true
      contents: |
        [Unit]
        After=systemd-sysext.service
        Wants=systemd-sysext.service

        [Path]
        PathExists=/usr/lib/systemd/system/tailscaled.service

        [Install]
        WantedBy=multi-user.target
